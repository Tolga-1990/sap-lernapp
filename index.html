ammsatz den Hierarchiebereich ändern", "r": true}, {"t": "In OKENN per Drag-and-drop verschieben", "r": false}, {"t": "Kostenstelle löschen und neu anlegen", "r": false}]}, {"id": "F6", "p": "F", "q": "BP (Geschäftspartner): Lieferant zentral anlegen. Welche Rolle und Gruppierung wählst du?", "a": "Rolle „ZVEND – Kreditor/Lieferant zentr.“ (ZVEND = Rolle Lieferant zentral), Gruppierung „BPCH Interne Nummernvergabe CH“; Feld Geschäftspartner leer lassen (7.5.2.1)", "o": [{"t": "Rolle „ZVEND – Kreditor/Lieferant zentr.“", "r": true}, {"t": "Gruppierung „BPCH Interne Nummernvergabe CH“", "r": true}, {"t": "Feld Geschäftspartner leer lassen", "r": true}, {"t": "Feld Geschäftspartner mit einer eigenen Nummer füllen", "r": false}]}, {"id": "F7", "p": "F", "q": "BP (Geschäftspartner), Lieferant: Kontoführung. Welches Feld ist Pflicht?", "a": "Abstimmkonto (7.5.2.1)", "o": [{"t": "Abstimmkonto", "r": true}, {"t": "Kostenstelle", "r": false}, {"t": "Einkäufergruppe", "r": false}, {"t": "Steuerkategorie", "r": false}]}, {"id": "F8", "p": "F", "q": "Fiori „Hauptbuchbelege buchen“: Reparatur am Pool-Auto, bezahlt mit Bankomatkarte. Was ist auf der Aufwandsposition Pflicht?", "a": "Ein Kontierungsobjekt, hier die Hilfskostenstelle des Pool-Autos (PKW##) (Fallstudie, Aufgabe 7; 8.3)", "o": [{"t": "Ein Kontierungsobjekt, hier die Hilfskostenstelle des Pool-Autos (PKW##)", "r": true}, {"t": "Eine Bestellnummer", "r": false}, {"t": "Ein Umbuchungszyklus", "r": false}, {"t": "Nichts, Hauptbuchbelege brauchen keine Kontierung", "r": false}]}, {"id": "F9", "p": "F", "q": "ME21N (Bestellung anlegen): Lieferdatum „in 14 Tagen“, die Woche genügt. Welcher Lieferdatumstyp?", "a": "W wochengenau (8.6.2.4)", "o": [{"t": "W wochengenau", "r": true}, {"t": "D taggenau", "r": false}, {"t": "M monatsgenau", "r": false}, {"t": "T wochengenau", "r": false}]}, {"id": "F10", "p": "F", "q": "ME23N (Bestellung anzeigen): Du willst das Obligo der Position sehen.", "a": "Umfeld → Belegposition → RW-Obligobelege (RW = Rechnungswesen) (8.6.6.1)", "o": [{"t": "Umfeld → Belegposition → RW-Obligobelege", "r": true}, {"t": "Springen → Varianten", "r": false}, {"t": "Zusätze → Kostenrechnungskreis setzen", "r": false}, {"t": "Umfeld → Ursprungsbeleg", "r": false}]}, {"id": "F11", "p": "F", "q": "MIRO (Rechnung zur Bestellung erfassen): Der Saldo ist nicht null. Was tust du?", "a": "Betrag, Steuer und Bestellpositionen prüfen, bis der Saldo null ist; erst dann buchen (8.6.11)", "o": [{"t": "Betrag, Steuer und Bestellpositionen prüfen, bis der Saldo null ist; erst dann buchen", "r": true}, {"t": "Trotzdem buchen, die Differenz wird automatisch ausgebucht", "r": false}, {"t": "Die Rechnung mit FB60 statt MIRO buchen", "r": false}, {"t": "Den Wareneingang stornieren", "r": false}]}, {"id": "F12", "p": "F", "q": "KB31N (Kennzahlwerte erfassen): Kilometer laut Fahrtenbuch für Juli erfassen. Was beachtest du?", "a": "Kennzahl KM## ist ein Summenwert, sie gilt nur für die erfasste Periode (7.4.6)", "o": [{"t": "KM## ist ein Summenwert, er gilt nur für die erfasste Periode", "r": true}, {"t": "KM## ist ein Festwert, er gilt bis Jahresende", "r": false}, {"t": "Kilometer erfasst man in KK01", "r": false}, {"t": "Kilometer erfasst man in KB11N", "r": false}], "sm": true}, {"id": "F13", "p": "F", "q": "KSV5 (Verteilung ausführen): Der Zyklus soll nur geprüft werden.", "a": "Kennzeichen Testlauf gesetzt lassen und ausführen, Protokoll prüfen (9.4.3.3)", "o": [{"t": "Kennzeichen Testlauf gesetzt lassen und ausführen", "r": true}, {"t": "Danach das Protokoll prüfen", "r": true}, {"t": "Testlauf entfernen und ausführen", "r": false}, {"t": "Den Zyklus in KSV2 öffnen und sichern", "r": false}]}, {"id": "F14", "p": "F", "q": "„Verrechnungen verwalten“: Ein Segment soll im nächsten Lauf nicht mitlaufen.", "a": "Das Segment sperren (9.4.4)", "o": [{"t": "Das Segment sperren", "r": true}, {"t": "Das Segment löschen und später neu anlegen", "r": false}, {"t": "Den ganzen Zyklus löschen", "r": false}, {"t": "Das geht in der App nicht", "r": false}]}, {"id": "F15", "p": "F", "q": "S_ALR_87013611 (Bericht Kostenstellen Ist/Plan/Abweichung): Die Geschäftsleitung will nur Gruppen sehen, die Kostenstellenleitung die Details.", "a": "Kostenstellengruppe selektieren und mit der Variation zwischen den Ebenen wechseln (10.3)", "o": [{"t": "Kostenstellengruppe selektieren und mit der Variation zwischen den Ebenen wechseln", "r": true}, {"t": "Für jede Kostenstelle einen eigenen Bericht starten", "r": false}, {"t": "Den Expertenmodus ausschalten", "r": false}, {"t": "RPC0 für die Geschäftsleitung sperren", "r": false}]}, {"id": "F16", "p": "F", "q": "Bericht: Du rufst ihn täglich mit denselben Werten auf.", "a": "Vorschlagswerte in RPC0 (Benutzereinstellungen für Berichte) speichern (10.5)", "o": [{"t": "Vorschlagswerte in RPC0 speichern", "r": true}, {"t": "Werte in den Benutzervorgaben unter Parameter-ID XTX speichern", "r": false}, {"t": "Den Bericht in KS02 hinterlegen", "r": false}, {"t": "Bei jedem Aufruf F6 drücken", "r": false}]}, {"id": "K1", "p": "K", "q": "Mit welcher Transaktion hat der Trainer die eigenen Benutzerparameter (Aufgabe 2) gepflegt?", "a": "SU3 (Pflege eigener Benutzervorgaben), Reiter Parameter (Kurs 19.11.). Das Skript zeigt denselben Bildschirm über System → Benutzervorgaben → Benutzerdaten bzw. Eigene Daten (Skript S. 12 und 176); den Code SU3 nennt es nicht", "o": [{"t": "SU3, Reiter Parameter", "r": true}, {"t": "KS01, Register Grunddaten", "r": false}, {"t": "FS00, Register Steuerungsdaten", "r": false}, {"t": "OKEON, Änderungsmodus", "r": false}]}, {"id": "K2", "p": "K", "q": "Welche Werte gehören in Aufgabe 2 zu welchem Parameter? (mehrere richtig)", "a": "BUK = B200, CAC = K200, EKO = E200, WRK = W210, EKG = S##, XTX = X (Skript S. 12: Parameter-IDs; S. 42: Werte; S. 176: XTX = X) und LAG = LO## (nur Kurs 19.11.)", "o": [{"t": "BUK = B200", "r": true}, {"t": "CAC = K200", "r": true}, {"t": "WRK = W210", "r": true}, {"t": "EKO = S##", "r": false}]}, {"id": "K3", "p": "K", "q": "Wofür steht die Parameter-ID LAG, und welcher Wert wurde im Kurs eingetragen?", "a": "LAG = Lagerort, Wert LO## (je Benutzer eigener Lagerort) (Kurs 19.11.)", "o": [{"t": "Lagerort, Wert LO##", "r": true}, {"t": "Ledger, Wert 0L", "r": false}, {"t": "Lieferant, Wert S##", "r": false}, {"t": "Lager-Werk, Wert W210", "r": false}]}, {"id": "K4", "p": "K", "q": "Welcher Mandant wurde im Kurssystem verwendet?", "a": "Mandant 400 (Kurs 19.11., Skript S. 11)", "o": [{"t": "400", "r": true}, {"t": "100", "r": false}, {"t": "200", "r": false}, {"t": "K200", "r": false}], "sm": true}, {"id": "K5", "p": "K", "q": "Aufgabe 3: Welches Konto wird OHNE Kostenartentyp angelegt? ", "a": "22154.## S##-Vblk. Kreditkarten ist ein Bilanzkonto (Verbindlichkeit) und keine Kostenart; in der Liste steht weder Steuerkategorie noch Kostenartentyp (Skript S. 13; Kurs 19.11.)", "o": [{"t": "22154.## S##-Vblk. Kreditkarten", "r": true}, {"t": "58102.## S##-Aus- und Fortbildung", "r": false}, {"t": "62002.## S##-Reparaturen", "r": false}, {"t": "65032.## S##-Fachliteratur", "r": false}], "sm": true}, {"id": "K6", "p": "K", "q": "Aufgabe 3: Welche Steuerkategorie bekommt 65032.## S##-Fachliteratur?", "a": "V2 (Vorsteuer 2,6 %), Vorlage 65030, Kostenartentyp 1 (Skript S. 13; 2,6 % laut Rechnung S. 23)", "o": [{"t": "V2", "r": true}, {"t": "V1", "r": false}, {"t": "A2", "r": false}, {"t": "keine", "r": false}], "sm": true}, {"id": "K7", "p": "K", "q": "In FS00 (Sachkonto anlegen): In welchem Register steht der Kostenartentyp?", "a": "Register Steuerungsdaten, Feldgruppe Kontoeinstellungen am Kostenrechnungskreis K200 (Kurs 19.11., Skript S. 49)", "o": [{"t": "Steuerungsdaten, unter Kontoeinstellungen am Kostenrechnungskreis", "r": true}, {"t": "Typ/Bezeichnung, neben der Sachkontoart", "r": false}, {"t": "Erfassung/Bank/Zins", "r": false}, {"t": "Schlagw./Übersetzung", "r": false}], "sm": true}, {"id": "K8", "p": "K", "q": "Aufgabe 4: Welche Transaktion zeigt die Standardhierarchie an, welche ändert sie? (mehrere richtig)", "a": "OKENN = anzeigen (Skript S. 103), OKEON = ändern (S. 105), KSH2 = Kostenstellengruppen ändern (S. 70); im Kurs 19.11. so gezeigt", "o": [{"t": "OKENN = Standardhierarchie anzeigen", "r": true}, {"t": "OKEON = Standardhierarchie ändern", "r": true}, {"t": "KSH2 = Kostenstellengruppen ändern und anlegen", "r": true}, {"t": "KS03 = Standardhierarchie ändern", "r": false}], "sm": true}, {"id": "K9", "p": "K", "q": "Aufgabe 4/5: Unter welchen Gruppen hängen die Kostenstellen in der Hierarchie?", "a": "S##-HG (Hauptgruppe), darunter HAUPT## (Hauptkostenstellen) und HILF## (Hilfskostenstellen) (Skript S. 14)", "o": [{"t": "S##-HG → HAUPT## und HILF##", "r": true}, {"t": "K200 → B200 und W210", "r": false}, {"t": "S##-HG → RW## und PKW##", "r": false}, {"t": "HAUPT## → S##-HG und HILF##", "r": false}]}, {"id": "K10", "p": "K", "q": "Aufgabe 5: Welche Kostenstellen sind Hilfskostenstellen (Art H, Bereich HILF##)? (mehrere richtig)", "a": "PKW##, LIT##, REIN##, BILD## (Skript S. 14–15: Art H, Hierarchiebereich HILF##)", "o": [{"t": "PKW##", "r": true}, {"t": "LIT##", "r": true}, {"t": "BILD##", "r": true}, {"t": "RW##", "r": false}], "sm": true}, {"id": "K11", "p": "K", "q": "Aufgabe 7: Wie lautet der Buchungssatz für die Werkstattrechnung, bezahlt mit Firmenkreditkarte?", "a": "62002.## Reparaturen (Soll, Kostenstelle PKW##) an 22154.## Vblk. Kreditkarten (Haben), Steuerkennzeichen V1 (Konten und V1: Skript S. 13; Rechnung und «passende Hilfskostenstelle» für das Pool-Auto: S. 16; so im Kurs 19.11. gebucht)", "o": [{"t": "62002.## Reparaturen an 22154.## Vblk. Kreditkarten, V1", "r": true}, {"t": "22154.## an 62002.##, V2", "r": false}, {"t": "62002.## an Kasse, V0", "r": false}, {"t": "58102.## an 22154.##, V1", "r": false}], "sm": true}, {"id": "K12", "p": "K", "q": "Aufgabe 7 in FB50: Was musst du einstellen bzw. prüfen, damit Steuer und Kostenstelle erfasst werden? (mehrere richtig)", "a": "Erfassungsvariante STANDARD 3_0100 einschalten (Steuer, Kostenstelle, Auftrag) und Steuer rechnen auf Reiter Detail aktivieren (Skript S. 176: Steuer rechnen im Register Detail; S. 178: Erfassungsvarianten; die Wahl 3_0100 im Kurs 19.11.)", "o": [{"t": "Arbeitsvorlagen → Erfassungsvariante STANDARD 3_0100", "r": true}, {"t": "«Steuer rechnen» auf Reiter Detail aktiv", "r": true}, {"t": "Parameter-ID LAG setzen", "r": false}, {"t": "Belegart auf AB stellen", "r": false}], "sm": true}, {"id": "L1", "p": "L", "q": "Wie viele Buchungskreise können einem Kostenrechnungskreis zugeordnet sein?", "a": "Einem Kostenrechnungskreis können mehrere Buchungskreise zugeordnet sein (1 : N). Im Kurs: K200 mit B200 (Folie des Trainers zu Aufgabe 1; Skript 6.3)", "o": [{"t": "Einer oder mehrere (1 : N)", "r": true}, {"t": "Genau einer (1 : 1)", "r": false}, {"t": "Keiner, der Buchungskreis steht über dem Kostenrechnungskreis", "r": false}, {"t": "Höchstens zwei", "r": false}], "sm": true}, {"id": "L2", "p": "L", "q": "Welche Felder sind laut Folie des Trainers Mussfelder beim Anlegen einer Kostenart? (mehrere richtig)", "a": "Bezeichnung und Kostenartentyp (Folie zu Aufgabe 3; Skript S. 49: Kostenartentyp ist Mussfeld). Achtung: Der Trainer sagte, die Folie stamme aus alten GUI-Unterlagen; die Frage kann in der Prüfung anders gestellt sein", "o": [{"t": "Bezeichnung", "r": true}, {"t": "Kostenartentyp", "r": true}, {"t": "Kostenstelle", "r": false}, {"t": "Steuerkennzeichen", "r": false}], "sm": true}, {"id": "L3", "p": "L", "q": "Sachkonto in Fiori, Buchungskreisebene: Welche zwei Felder zeigte der Trainer als Mussfelder (rotes Sternchen)? (mehrere richtig)", "a": "Kontowährung und Feldstatusgruppe (Trainer, Kurs 19.11.; Feldstatusgruppe Skript S. 50)", "o": [{"t": "Kontowährung", "r": true}, {"t": "Feldstatusgruppe", "r": true}, {"t": "Sortierschlüssel", "r": false}, {"t": "Steuerkategorie", "r": false}]}, {"id": "L4", "p": "L", "q": "Was bewirkt die Steuerkategorie V1 (statt «–») im Sachkonto?", "a": "Auf das Konto darf nur noch mit dem Steuerkennzeichen V1 gebucht werden (Trainer, Kurs 19.11.; Skript S. 48)", "o": [{"t": "Auf das Konto darf nur noch mit V1 gebucht werden", "r": true}, {"t": "Alle Steuerkennzeichen sind erlaubt", "r": false}, {"t": "Das Konto darf nur ohne Steuer bebucht werden", "r": false}, {"t": "Nur Ausgangssteuer ist erlaubt", "r": false}]}, {"id": "L5", "p": "L", "q": "Was steuert die Feldstatusgruppe eines Sachkontos?", "a": "Den Bildschirmaufbau bei der Belegerfassung: welche Felder Musseingabe, Kanneingabe oder ausgeblendet sind. Beispiel aus dem Kurs: G013 = Text obligatorisch (Skript S. 50; Trainer, Kurs 19.11.)", "o": [{"t": "Welche Felder beim Buchen Muss-, Kann- oder ausgeblendete Felder sind", "r": true}, {"t": "Die Sortierung der Einzelposten", "r": false}, {"t": "Welche Steuerkennzeichen erlaubt sind", "r": false}, {"t": "Die Kontowährung", "r": false}]}, {"id": "L6", "p": "L", "q": "Wofür ist der Sortierschlüssel im Sachkonto da?", "a": "Er gibt die Aufbauregel für das Feld Zuordnung in der Belegposition an; danach werden die Einzelposten sortiert. Im Kurs: Sortierschlüssel 8 = Kostenstelle (Skript S. 48; Trainer, Kurs 19.11.)", "o": [{"t": "Er legt fest, was ins Feld Zuordnung kommt, und damit die Sortierung der Einzelposten", "r": true}, {"t": "Er legt die Reihenfolge der Konten in der Bilanz fest", "r": false}, {"t": "Er bestimmt das Steuerkennzeichen", "r": false}, {"t": "Er sortiert die Kostenstellen in der Standardhierarchie", "r": false}]}, {"id": "L7", "p": "L", "q": "KS01 (Kostenstelle anlegen): Welche Felder sind laut Folie des Trainers Mussfelder? (mehrere richtig)", "a": "Bezeichnung, Verantwortlicher, Art der Kostenstelle, Hierarchiebereich, Währung (Folie zu Aufgabe 5; Skript S. 62: Verantwortlicher ist Mussfeld)", "o": [{"t": "Verantwortlicher", "r": true}, {"t": "Art der Kostenstelle", "r": true}, {"t": "Hierarchiebereich", "r": true}, {"t": "Verantwortlicher Benutzer", "r": false}], "sm": true}, {"id": "L8", "p": "L", "q": "Kostenstelle in Fiori: Was ist der Unterschied zwischen «Verantwortlicher» und «verantwortlicher Benutzer»?", "a": "Der Verantwortliche ist ein Freitextfeld und Mussfeld (im Kurs S##). Der verantwortliche Benutzer ist ein SAP-Benutzer und kein Mussfeld (Trainer, Kurs 19.11.; Skript S. 62 und 98)", "o": [{"t": "Verantwortlicher = Freitext und Pflicht; verantwortlicher Benutzer = SAP-Benutzer, keine Pflicht", "r": true}, {"t": "Beide sind Pflicht", "r": false}, {"t": "Verantwortlicher Benutzer ist Pflicht, Verantwortlicher nicht", "r": false}, {"t": "Es ist dasselbe Feld", "r": false}]}, {"id": "L9", "p": "L", "q": "Was bedeutet die Kostenstellenart G?", "a": "G = Logistik (Skript S. 84). Im Kurs bekommt der Einkauf EK## die Art G", "o": [{"t": "Logistik", "r": true}, {"t": "Geschäftsleitung", "r": false}, {"t": "Gemeinkosten", "r": false}, {"t": "Gebäude", "r": false}]}, {"id": "L10", "p": "L", "q": "Welche Zuordnungen von Kostenstellenart und Bedeutung sind richtig? (mehrere richtig)", "a": "W = Verwaltung, V = Verkauf, H = Hilfskostenstelle, G = Logistik, F = Produktion, L = Management (Skript S. 84)", "o": [{"t": "W = Verwaltung", "r": true}, {"t": "V = Verkauf", "r": true}, {"t": "H = Hilfskostenstelle", "r": true}, {"t": "F = Finanzen", "r": false}]}, {"id": "L11", "p": "L", "q": "Wozu dient die Art der Kostenstelle? (mehrere richtig)", "a": "Für die Leistungsverrechnung (eine Leistungsart darf nur von Kostenstellen bestimmter Arten erbracht werden) und für Auswertungen (Skript S. 83). Der Trainer ergänzte: Sie erleichtert Umlagen und kann den Funktionsbereich ableiten (Kurs 19.11.)", "o": [{"t": "Leistungsverrechnung: Leistungsarten nur für bestimmte Kostenstellenarten", "r": true}, {"t": "Auswertungen nach Art der Kostenstelle", "r": true}, {"t": "Sie bestimmt die Währung der Kostenstelle", "r": false}, {"t": "Sie ersetzt die Standardhierarchie", "r": false}]}, {"id": "L12", "p": "L", "q": "OKENN (Standardhierarchie bearbeiten): Was bedeutet es, wenn Kostenstellen rot angezeigt werden?", "a": "Es gibt Änderungen, die noch nicht gespeichert sind; rot bleibt, bis gespeichert oder verworfen wird (Folie des Trainers zu Aufgabe 6). Im Skript S. 68 bedeutet rot bei der Gruppenpflege «markiert»", "o": [{"t": "Es gibt noch nicht gespeicherte Änderungen", "r": true}, {"t": "Die Kostenstelle ist gesperrt", "r": false}, {"t": "Die Kostenstelle hat Istkosten", "r": false}, {"t": "Die Kostenstelle ist gelöscht", "r": false}], "sm": true}, {"id": "L13", "p": "L", "q": "Standardhierarchie: Was passiert, wenn jemand sie im SAP GUI bearbeitet?", "a": "Im GUI wird die ganze Standardhierarchie gesperrt, wenn mehrere gleichzeitig in OKEON arbeiten; deshalb zuerst mit OKENN nur die eigene Gruppe öffnen (Skript S. 105). In Fiori können mehrere Personen gleichzeitig daran arbeiten (Trainer, Kurs 19.11.)", "o": [{"t": "Im GUI ist sie für andere gesperrt, in Fiori nicht", "r": true}, {"t": "In Fiori ist sie gesperrt, im GUI nicht", "r": false}, {"t": "Sie ist nie gesperrt", "r": false}, {"t": "Nur die bearbeitete Kostenstelle ist gesperrt", "r": false}]}, {"id": "L14", "p": "L", "q": "FB50 (Sachkontenbeleg erfassen): Welche Eingaben machst du in den Positionen? (mehrere richtig)", "a": "Sachkonto, Soll/Haben, Betrag, Steuerkennzeichen, Kostenstelle (Folie des Trainers zu Aufgabe 7; Skript S. 176–178: Belegpositionen in FB50)", "o": [{"t": "Sachkonto", "r": true}, {"t": "Soll/Haben", "r": true}, {"t": "Steuerkennzeichen", "r": true}, {"t": "Buchungskreis", "r": false}], "sm": true}, {"id": "L15", "p": "L", "q": "«Steuer rechnen» ist gesetzt. Wie rechnet SAP die Steuer, und wo stellst du auf Netto um?", "a": "SAP rechnet die Steuer aus dem Bruttobetrag; wer vom Nettobetrag rechnen will, setzt das Kennzeichen in FB00 (Bearbeitungsoptionen Finanzbuchhaltung) (Trainer, Kurs 19.11.; FB00 im Skript S. 180)", "o": [{"t": "Aus dem Bruttobetrag; Umstellung auf Netto in FB00", "r": true}, {"t": "Aus dem Nettobetrag; Umstellung in SU3", "r": false}, {"t": "Aus dem Bruttobetrag; Umstellung in FS00", "r": false}, {"t": "Gar nicht, die Steuer wird immer manuell erfasst", "r": false}]}, {"id": "L16", "p": "L", "q": "Was bedeutet meist die letzte Ziffer eines SAP-GUI-Transaktionscodes wie KSH1, KSH2, KSH3?", "a": "1 = Anlegen, 2 = Ändern, 3 = Anzeigen (Trainer, Kurs 19.11.)", "o": [{"t": "1 Anlegen, 2 Ändern, 3 Anzeigen", "r": true}, {"t": "1 Anzeigen, 2 Ändern, 3 Löschen", "r": false}, {"t": "1 Plan, 2 Ist, 3 Obligo", "r": false}, {"t": "1 GUI, 2 Fiori, 3 Web", "r": false}]}, {"id": "L17", "p": "L", "q": "Aufgabe 8: Mit welchen Daten buchst du die Rechnung Nr. 864 der Putzteufel GmbH? (mehrere richtig)", "a": "FB60 (Eingangsrechnung), Rechnungsbetrag CHF 486.45 (CHF 450.00 + 8,1 % MwSt CHF 36.45), Aufwand 62022.## Reinigung, Steuerkennzeichen V1, Kostenstelle REIN## (Skript S. 17–18; Konto aus Aufgabe 3, Kostenstelle aus Aufgabe 9)", "o": [{"t": "Rechnungsbetrag CHF 486.45", "r": true}, {"t": "Konto 62022.## Reinigung", "r": true}, {"t": "Kostenstelle REIN##", "r": true}, {"t": "Rechnungsbetrag CHF 450.00 (ohne MwSt)", "r": false}]}, {"id": "L18", "p": "L", "q": "Aufgabe 9: Welche Berichte bzw. Transaktionen zeigt das Skript für die Kontrolle der Buchung auf REIN##? (mehrere richtig)", "a": "FB03, KSB5, FBL1N, KSB1 und S_ALR_87013611 (Skript S. 18)", "o": [{"t": "KSB1 (Kostenstellen Einzelposten Ist)", "r": true}, {"t": "FBL1N (Kreditoren Einzelposten)", "r": true}, {"t": "KSB5 (Kostenrechnungsbelege Istkosten)", "r": true}, {"t": "KSV5 (Verteilung ausführen)", "r": false}]}, {"id": "L19", "p": "L", "q": "Aufgabe 10: Welche Daten gehören zum Lieferanten S##-Atlas Training? (mehrere richtig)", "a": "Buchungskreis B200, Einkaufsorganisation E200, Abstimmkonto 20000, Zahlungsbedingung sofort zahlbar ohne Abzug, Zahlweg Überweisung; Fiori-App Lieferantenstammdaten verwalten (Skript S. 19)", "o": [{"t": "Abstimmkonto 20000", "r": true}, {"t": "Zahlweg Überweisung", "r": true}, {"t": "Einkaufsorganisation E200", "r": true}, {"t": "Zahlungsbedingung 2 % Skonto", "r": false}]}, {"id": "L20", "p": "L", "q": "Aufgabe 11: Wie buchst du die Rechnung Nr. 17071 von Atlas Training?", "a": "FB60, CHF 2'648.45 (CHF 2'450.00 + 8,1 % MwSt CHF 198.45) auf 58102.## Aus- und Fortbildung, Steuerkennzeichen V1, Kostenstelle BILD## (Skript S. 20; Konto aus Aufgabe 3; BILD## aus Aufgabe 12, S. 21)", "o": [{"t": "CHF 2'648.45 auf 58102.##, V1, Kostenstelle BILD##", "r": true}, {"t": "CHF 2'450.00 auf 58102.##, V2, Kostenstelle RW##", "r": false}, {"t": "CHF 2'648.45 auf 65032.##, V2, Kostenstelle LIT##", "r": false}, {"t": "CHF 2'648.45 auf 22154.##, ohne Steuer", "r": false}]}, {"id": "L21", "p": "L", "q": "Aufgabe 12: Wie kommen die Ausbildungskosten auf deine Stammkostenstelle?", "a": "Mit KB61 (Einzelpostenumbuchung) von BILD## auf RW## (Skript S. 21)", "o": [{"t": "KB61 von BILD## auf RW##", "r": true}, {"t": "KB11N von RW## auf BILD##", "r": false}, {"t": "KSW5 von BILD## auf HAUPT##", "r": false}, {"t": "FB50 von 58102.## auf 22154.##", "r": false}]}, {"id": "L22", "p": "L", "q": "Aufgabe 13, ME21N (Bestellung anlegen): Welche Eingaben sind richtig? (mehrere richtig)", "a": "Kontierungstyp K (Kostenstelle), Menge 35 (10+6+4+7+3+5), Nettopreis CHF 15, Warengruppe Sonstiges, Werk W210, Sachkonto 65032.##, Kostenstelle LIT##, Steuerkennzeichen V2 (Skript S. 21; Folie des Trainers zur Bestellung). Die Folie zeigt noch die alten Werte W110/E100; es gilt das Skript", "o": [{"t": "Kontierungstyp K", "r": true}, {"t": "Kostenstelle LIT## und Sachkonto 65032.##", "r": true}, {"t": "Werk W210", "r": true}, {"t": "Steuerkennzeichen V1", "r": false}], "sm": true}, {"id": "L23", "p": "L", "q": "Aufgabe 14: Mit wie viel wird LIT## beim Wareneingang belastet?", "a": "CHF 525.00 = 35 × CHF 15 netto; die Vorsteuer ist kein Aufwand (Skript S. 21–22; meine Rechnung)", "o": [{"t": "CHF 525.00", "r": true}, {"t": "CHF 538.65", "r": false}, {"t": "CHF 15.00", "r": false}, {"t": "CHF 0, erst die Rechnung belastet", "r": false}]}, {"id": "L24", "p": "L", "q": "Aufgabe 15: Welche Rechnung buchst du mit MIRO, und welcher Steuersatz gilt?", "a": "Rechnung Nr. 17212: CHF 525.00 + 2,6 % MwSt CHF 13.65 = CHF 538.65, Steuerkennzeichen V2 (2,6 %) (Skript S. 23)", "o": [{"t": "CHF 538.65 inkl. 2,6 % MwSt (V2)", "r": true}, {"t": "CHF 567.53 inkl. 8,1 % MwSt (V1)", "r": false}, {"t": "CHF 525.00 ohne Steuer", "r": false}, {"t": "CHF 538.65 inkl. 8,1 % MwSt (V1)", "r": false}]}, {"id": "L25", "p": "L", "q": "Aufgabe 16, KB11N (manuelle Umbuchung) von LIT##: Welche Beträge gehen an welche Hauptkostenstelle? (mehrere richtig)", "a": "EK## 120 (2 BT + 6 PT), VT## 90 (2 BT + 4 ST), RW## 210 (4 BT + 7 FT + 3 CT), PE## 105 (2 BT + 5 ET), Total 525 (Skript S. 24; Folie des Trainers; Beträge × CHF 15)", "o": [{"t": "EK## CHF 120", "r": true}, {"t": "RW## CHF 210", "r": true}, {"t": "PE## CHF 105", "r": true}, {"t": "VT## CHF 120", "r": false}], "sm": true}, {"id": "L26", "p": "L", "q": "KK01 (statistische Kennzahl anlegen) für KM##: Welche Angaben sind laut Folie des Trainers nötig? (mehrere richtig)", "a": "Bezeichnung, Einheit und Kennzahltyp Summenwerte (Folie zu Aufgabe 17; Skript S. 118: Festwerte oder Summenwerte wählen)", "o": [{"t": "Bezeichnung", "r": true}, {"t": "Einheit", "r": true}, {"t": "Kennzahltyp Summenwerte", "r": true}, {"t": "Kostenstelle", "r": false}], "sm": true}, {"id": "L27", "p": "L", "q": "Aufgabe 17: Welche Kilometer erfasst du laut Fahrtenbuch für KM##? (mehrere richtig)", "a": "VT## 2'027, EK## 423, PE## 230, RW## 57, Total 2'737 (Skript S. 25; Summen meine Rechnung, deckungsgleich mit der Folie des Trainers)", "o": [{"t": "VT## 2'027", "r": true}, {"t": "EK## 423", "r": true}, {"t": "RW## 57", "r": true}, {"t": "PE## 0, weil die Fahrt privat war", "r": false}]}, {"id": "L28", "p": "L", "q": "Aufgabe 18: Welche Quadratmeter erfasst du für RAUM##? (mehrere richtig)", "a": "EK## 40, PE## 23, RW## 98, VT## 19, Total 180 m² (Skript S. 26). Erfasst mit den Fiori-Apps Statistische Kennzahlen verwalten und Statistische Kennzahlwerte verwalten", "o": [{"t": "RW## 98", "r": true}, {"t": "EK## 40", "r": true}, {"t": "VT## 19", "r": true}, {"t": "PE## 32", "r": false}]}, {"id": "L29", "p": "L", "q": "Was ist der Unterschied zwischen KSW5 (periodische Umbuchung) und KSV5 (Verteilung) laut Folie des Trainers?", "a": "KSW5: Der Sender bekommt keinen Entlastungssatz, er wird mit umgekehrtem Vorzeichen auf derselben Belastung bebucht. KSV5: Der Sender bekommt einen eigenen Entlastungssatz (Folie zu Aufgabe 19). Bei beiden bleibt die Primärkostenart erhalten (Skript S. 273)", "o": [{"t": "KSW5 ohne eigenen Entlastungssatz, KSV5 mit eigenem Entlastungssatz", "r": true}, {"t": "KSW5 mit eigenem Entlastungssatz, KSV5 ohne", "r": false}, {"t": "KSW5 nutzt Sekundärkostenarten, KSV5 nicht", "r": false}, {"t": "Es gibt keinen Unterschied", "r": false}], "sm": true}, {"id": "L30", "p": "L", "q": "Aufgabe 19: Welche Hilfskostenstelle wird womit entlastet? (mehrere richtig)", "a": "PKW## mit periodischer Umbuchung (SAP GUI, KSW5) nach Kilometern KM##; REIN## mit Verteilung (Fiori, Verrechnungen verwalten/ausführen) nach Quadratmetern RAUM##; Empfänger EK##, VT##, PE##, RW## (Skript S. 27; Folie des Trainers)", "o": [{"t": "PKW## per periodischer Umbuchung nach KM##", "r": true}, {"t": "REIN## per Verteilung nach RAUM##", "r": true}, {"t": "LIT## per Verteilung nach RAUM##", "r": false}, {"t": "PKW## per Verteilung nach RAUM##", "r": false}], "sm": true}, {"id": "M1", "p": "M", "q": "Wie ist die Prüfung laut Trainer aufgebaut? (mehrere richtig)", "a": "Ganz einfache Fragen richtig/falsch, teilweise Screenshots mit freigeschalteten Feldern (z. B. Kontonummer oder Kostenstelle); alles Nötige steht im Fragetext; keine Simulation, Transaktionen muss man nicht auswendig lernen (Trainer, Mitschnitt 20.11.). Massgeblich sind die Testfragen des Trainers", "o": [{"t": "Richtig/Falsch-Fragen", "r": true}, {"t": "Screenshots mit Feldern, in die man z. B. Konto oder Kostenstelle einträgt", "r": true}, {"t": "Simulation im echten SAP-System", "r": false}, {"t": "Transaktionscodes müssen auswendig gewusst werden", "r": false}], "sm": true}, {"id": "M2", "p": "M", "q": "Welche Geschäftspartnerrolle braucht ein Lieferant, damit du für ihn eine Bestellung anlegen kannst?", "a": "FLVN01 «Lieferant» mit den Einkaufsdaten in der Einkaufsorganisation; Pflichtfeld dort ist die Bestellwährung (Trainer, Mitschnitt 20.11.)", "o": [{"t": "FLVN01 Lieferant (Einkaufsorganisation)", "r": true}, {"t": "Nur FLVN00 FI-Kreditor (Buchungskreis)", "r": false}, {"t": "Debitor", "r": false}, {"t": "Keine Rolle, der Geschäftspartner genügt", "r": false}]}, {"id": "M3", "p": "M", "q": "Welches Feld ist Pflicht in der Rolle FLVN00 «FI-Kreditor» (Buchungskreisdaten)?", "a": "Das Abstimmkonto im Hauptbuch. Die Rolle FLVN00 braucht man, um eine Rechnung auf den Lieferanten zu buchen (Trainer, Mitschnitt 20.11.)", "o": [{"t": "Abstimmkonto", "r": true}, {"t": "Bestellwährung", "r": false}, {"t": "Incoterms", "r": false}, {"t": "Einkaufsorganisation", "r": false}]}, {"id": "M4", "p": "M", "q": "Braucht man für den Wareneingang zu einer kontierten Bestellung schon die Buchungskreisdaten (FI-Kreditor) des Lieferanten?", "a": "Nein. Der Wareneingang hat noch keinen Bezug zum Lieferanten-Konto; die Buchungskreisdaten braucht man spätestens für die Rechnung (Trainer, Mitschnitt 20.11.)", "o": [{"t": "Nein, erst für die Rechnung", "r": true}, {"t": "Ja, sonst ist kein Wareneingang möglich", "r": false}, {"t": "Ja, aber nur bei Lagermaterial", "r": false}, {"t": "Nein, sie werden nie benötigt", "r": false}]}, {"id": "M5", "p": "M", "q": "In der Bestellposition ist «WE unbewertet» gesetzt. Wann entstehen Kosten auf Sachkonto und Kostenstelle, und wann wird das Obligo aufgelöst?", "a": "Erst mit der Rechnungsbuchung. Der Wareneingang wird dann nur mengenmässig gebucht, ohne Werte (Trainer, Mitschnitt 20.11.). Ohne den Haken (wie im Kurs) bucht der Wareneingang den Aufwand gegen das WE/RE-Verrechnungskonto und löst das Obligo auf", "o": [{"t": "Erst bei der Rechnungsbuchung", "r": true}, {"t": "Schon beim Wareneingang", "r": false}, {"t": "Schon beim Sichern der Bestellung", "r": false}, {"t": "Nie, es werden nur Mengen gebucht", "r": false}]}, {"id": "M6", "p": "M", "q": "Was passiert laut Trainer, wenn Bestellmenge und Rechnungsmenge voneinander abweichen?", "a": "Die Rechnung wird automatisch gesperrt; jemand muss sie manuell prüfen und freigeben (Trainer, Mitschnitt 20.11.)", "o": [{"t": "Die Rechnung wird automatisch gesperrt", "r": true}, {"t": "SAP passt die Bestellmenge automatisch an", "r": false}, {"t": "Die Differenz wird automatisch als Aufwand gebucht", "r": false}, {"t": "Nichts, Mengen werden nicht verglichen", "r": false}]}, {"id": "M7", "p": "M", "q": "Welche Kostenarten nutzen Umbuchung, Verteilung und Umlage? (mehrere richtig)", "a": "Umbuchung und Verteilung verrechnen auf der ursprünglichen Primärkostenart; die Umlage (KSU5) verwendet eine Sekundärkostenart (Trainer, Mitschnitt 20.11.; Skript S. 273)", "o": [{"t": "Umbuchung: ursprüngliche Primärkostenart", "r": true}, {"t": "Verteilung: ursprüngliche Primärkostenart", "r": true}, {"t": "Umlage: Sekundärkostenart", "r": true}, {"t": "Verteilung: Sekundärkostenart", "r": false}], "sm": true}, {"id": "M8", "p": "M", "q": "Was erzeugt eine manuelle Umbuchung mit KB11N (ohne Bezug zu einem FI-Beleg) laut Trainer? (mehrere richtig)", "a": "Einen echten Buchhaltungsbeleg im Universal Journal mit Belegart CO; die Buchung geht nur in ein Ledger (die Ledger-Gruppe des Controllings, meist 0L), nicht in alle (Trainer, Mitschnitt 20.11.)", "o": [{"t": "Einen Buchhaltungsbeleg mit Belegart CO", "r": true}, {"t": "Eine Buchung nur in einem Ledger", "r": true}, {"t": "Nur einen CO-Beleg ohne Buchhaltungsbeleg", "r": false}, {"t": "Eine Buchung automatisch in alle Ledger", "r": false}], "sm": true}, {"id": "M9", "p": "M", "q": "Kostenstellenbericht Ist/Plan/Abweichung: Was stimmt laut Trainer? (mehrere richtig)", "a": "Ohne Kostenstellengruppe im Selektionsbild gibt es nur eine Liste der Kostenstellen, keine Hierarchiestruktur. Angezeigt werden nur Kostenstellen und Knoten, die im Berichtszeitraum bebucht wurden (Trainer, Mitschnitt 20.11.)", "o": [{"t": "Für die Hierarchiestruktur muss man eine Kostenstellengruppe eingeben", "r": true}, {"t": "Es erscheinen nur Kostenstellen mit Buchungen im Berichtszeitraum", "r": true}, {"t": "Ohne Eingabe zeigt er automatisch die ganze Standardhierarchie", "r": false}, {"t": "Er zeigt immer alle angelegten Kostenstellen, auch ohne Buchung", "r": false}], "sm": true}, {"id": "M10", "p": "M", "q": "Stehen Kostenstellengruppen, die im SAP GUI angelegt wurden, automatisch in Fiori zur Verfügung?", "a": "Nein. In Fiori ist die Standardhierarchie auswählbar; die übrigen Kostenstellengruppen müssten in Fiori separat angelegt werden (Trainer, Mitschnitt 20.11.)", "o": [{"t": "Nein, nur die Standardhierarchie; andere Gruppen separat anlegen", "r": true}, {"t": "Ja, alle Gruppen automatisch", "r": false}, {"t": "Nein, auch die Standardhierarchie nicht", "r": false}, {"t": "Ja, aber nur nach Neustart des Launchpads", "r": false}]}, {"id": "M11", "p": "M", "q": "Was müssen Ergebnisbereich, Kostenrechnungskreis und Buchungskreis gemeinsam haben, damit man sie einander zuordnen kann?", "a": "Denselben Kontenplan (Trainer, Mitschnitt 20.11.)", "o": [{"t": "Denselben Kontenplan", "r": true}, {"t": "Dieselbe Währung", "r": false}, {"t": "Dasselbe Werk", "r": false}, {"t": "Dieselbe Einkaufsorganisation", "r": false}]}, {"id": "M12", "p": "M", "q": "Wann ist eine periodische Umbuchung (ohne Entlastungssatz) laut Trainer eher sinnvoll, wann eine Verteilung?", "a": "Die Umbuchung ist eher eine Korrektur der Ursprungsbuchung, ein Ausnahmefall; die Verteilung ist die systematische Verrechnung am Monatsende, bei der man sieht, wo ursprünglich gebucht wurde (Trainer, Mitschnitt 20.11.)", "o": [{"t": // Box 0 = neu, 1 = falsch, 2 = einmal richtig, 3 = sicher (zweimal hintereinander richtig)
function mark(store,id,ok){const r=S[store][id]||{b:0,r:0,f:0};if(ok){r.r++;r.b=r.b>=2?3:2;}else{r.f++;r.b=1;}r.t=Date.now();S[store][id]=r;save();}
function box(store,id){return (S[store][id]||{b:0}).b;}
function weight(store,id){return [3,6,2,1][box(store,id)];} // falsche Fragen kommen am häufigsten
function pick(list,store,idf){let tot=0;const w=list.map(x=>{const v=weight(store,idf(x));tot+=v;return v;});let r=Math.random()*tot;for(let i=0;i<list.length;i++){r-=w[i];if(r<0)return list[i];}return list[list.length-1];}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function score(text,ts){const n=norm(text);let s=0,c=0;ts.forEach(w=>{const st=stem(w);if(n.includes(st)){s++;c+=Math.min(5,n.split(st).length-1);}});return s*10+c;}

let PV={n:1,z:1};
async function openPage(n){
 let ov=$('#pv');if(!ov){ov=document.createElement('div');ov.id='pv';document.body.appendChild(ov);}
 if(!SK.pdf){ov.innerHTML=`<div class="pvbar"><b>Skript</b><span style="flex:1"></span><button class="btn sec" id="pvx">Schliessen</button></div><div class="card" style="margin:16px">Das Skript ist in diesem Browser noch nicht geladen. Öffne den Reiter <b>Suche</b> und lade dort einmal die Datei <b>SAP Skript_durchsuchbar.pdf</b>.</div>`;$('#pvx').onclick=()=>ov.remove();return;}
 PV.n=n;ov.innerHTML=`<div class="pvbar"><button class="btn sec" id="pvp">◀</button><input id="pvn" type="number" min="1" style="width:70px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)"><span id="pvt" class="muted"></span><button class="btn sec" id="pvnx">▶</button><button class="btn sec" id="pvzm">−</button><button class="btn sec" id="pvzp">+</button><span style="flex:1"></span><button class="btn" id="pvx">Schliessen</button></div><div id="pvc"><canvas id="pvcv"></canvas></div>`;
 $('#pvx').onclick=()=>ov.remove();$('#pvp').onclick=()=>showPage(PV.n-1);$('#pvnx').onclick=()=>showPage(PV.n+1);
 $('#pvzm').onclick=()=>{PV.z=Math.max(0.6,PV.z-0.25);showPage(PV.n);};$('#pvzp').onclick=()=>{PV.z=Math.min(3,PV.z+0.25);showPage(PV.n);};
 $('#pvn').onchange=e=>showPage(+e.target.value);
 showPage(n);}
async function showPage(n){
 const doc=await getDoc();if(!doc)return;n=Math.min(doc.numPages,Math.max(1,n||1));PV.n=n;
 $('#pvn').value=n;$('#pvt').textContent='von '+doc.numPages;
 const pg=await doc.getPage(n),wrap=$('#pvc'),cv=$('#pvcv');
 const base=pg.getViewport({scale:1}),w=Math.min(wrap.clientWidth-16,900)*PV.z,sc=w/base.width,dpr=window.devicePixelRatio||1;
 const vp=pg.getViewport({scale:sc*dpr});cv.width=vp.width;cv.height=vp.height;cv.style.width=(vp.width/dpr)+'px';cv.style.height=(vp.height/dpr)+'px';
 if(PV.task)try{PV.task.cancel();}catch(e){}
 PV.task=pg.render({canvasContext:cv.getContext('2d'),viewport:vp});try{await PV.task.promise;}catch(e){}
 wrap.scrollTop=0;}
document.addEventListener('keydown',e=>{if(!$('#pv'))return;if(e.key==='Escape')$('#pv').remove();if(e.key==='ArrowRight'&&e.target.tagName!=='INPUT')showPage(PV.n+1);if(e.key==='ArrowLeft'&&e.target.tagName!=='INPUT')showPage(PV.n-1);});

, "b": ["Symbol «Anlegen» → «Untergeordnete Gruppe» (S. 107).", [["Gruppe", "HAUPT05", "Name der neuen Gruppe"], ["Bezeichnung", "S05-Hauptkostenstellen", "Text"]]]}, {"h": "Schritt 4: Zweite Untergruppe", "b": ["Wieder S05-HG markieren → Anlegen → Untergeordnete Gruppe.", [["Gruppe", "HILF05", "Name"], ["Bezeichnung", "S05-Hilfskostenstellen", "Text"]]]}, {"h": "Schritt 5: Sichern", "b": ["Nicht gesicherte Änderungen sind rot (Folie).", "Alternative: KSH2 (Kostenstellengruppe ändern, S. 70) mit Gruppe S05-HG. KSH1 legt dagegen eine Gruppe ausserhalb der Standardhierarchie an (S. 64)."]}], "f": [{"h": "Schritt 1: App öffnen", "b": ["App «Kostenstellengruppen verwalten» (S. 74) → Standardhierarchie K200 öffnen (S. 112) → Bearbeiten."]}, {"h": "Schritt 2: Untergruppen anlegen", "b": ["S05-HG markieren → Neu → untergeordnete Gruppe.", [["Gruppe", "HAUPT05", "neue Gruppe"], ["Name", "S05-Hauptkostenstellen", "Text"]], "Gleich für HILF05 «S05-Hilfskostenstellen»."]}, {"h": "Schritt 3: Sichern", "b": []}], "kontrolle": "Im Baum stehen unter S05-HG die Gruppen HAUPT05 und HILF05.", "falle": "Eine Gruppe, die du über «Neu» separat anlegst (S. 77), gehört nicht automatisch zur Standardhierarchie.", "q": "Skript S. 14, 64–80, 103–113"}, {"nr": 5, "t": "Acht Kostenstellen anlegen", "sm": true, "worum": "Du legst vier Hauptkostenstellen und vier Hilfskostenstellen an und hängst sie in die passende Gruppe. Einen Teil im GUI, einen Teil in Fiori. Alle gültig ab 01.01.", "daten": ["Verantwortlicher S05, Währung CHF, Buchungskreis B200 (S. 15)", "Art der Kostenstelle laut Skript S. 84: G Logistik, H Hilfskostenstelle, V Verkauf, W Verwaltung"], "tabelle": [["Kostenstelle", "Bezeichnung", "Art", "Gruppe"], ["RW05", "S05-Rechnungswesen", "W (Verwaltung)", "HAUPT05"], ["EK05", "S05-Einkauf", "G (Logistik)", "HAUPT05"], ["VT05", "S05-Vertrieb", "V (Verkauf)", "HAUPT05"], ["PE05", "S05-Personal", "W (Verwaltung)", "HAUPT05"], ["PKW05", "S05-PKW", "H (Hilfskostenstelle)", "HILF05"], ["LIT05", "S05-Fachliteratur", "H", "HILF05"], ["REIN05", "S05-Reinigung", "H", "HILF05"], ["BILD05", "S05-Ausbildung", "H", "HILF05"]], "g": [{"h": "Schritt 1: Einstieg", "b": ["KS01 (Kostenstelle anlegen, S. 81).", [["Kostenrechnungskreis", "K200", "aus dem Parameter; ändern mit F6"], ["Kostenstelle", "RW05", "neue Nummer"], ["Gültig ab", "01.01.2026", "laut Aufgabe ab Jahresbeginn"], ["Gültig bis", "31.12.9999", "unbegrenzt"], ["Vorlage", "leer, oder eine fertige Kostenstelle", "mit Vorlage geht die nächste schneller"]]]}, {"h": "Schritt 2: Register «Grunddaten»", "b": [[["Bezeichnung", "S05-Rechnungswesen", "Pflichtfeld"], ["Beschreibung", "S05-Rechnungswesen", "Text"], ["Verantwortlicher", "S05", "Pflichtfeld, freier Text (S. 62)"], ["Verantwortlicher Benutzer", "leer", "kein Pflichtfeld (wäre ein SAP-Benutzer)"], ["Art der Kostenstelle", "W", "Pflichtfeld; siehe Tabelle"], ["Hierarchiebereich", "HAUPT05", "Pflichtfeld; Platz im Baum"], ["Buchungskreis", "B200", "deine Firma"], ["Währung", "CHF", "Pflichtfeld"]]]}, {"h": "Schritt 3: Register «Steuerung»", "b": ["Sperrkennzeichen Erlöse bleibt gesetzt (Kurs): Auf die Kostenstelle dürfen keine Erlöse gebucht werden."]}, {"h": "Schritt 4: Sichern", "b": ["Für die nächste Kostenstelle die fertige als Vorlage nehmen und Nummer, Texte, Art und Hierarchiebereich anpassen."]}], "f": [{"h": "Schritt 1: App öffnen", "b": ["App «Kostenstellen verwalten» (S. 93) → Anlegen (S. 97)."]}, {"h": "Schritt 2: Bereich «Allgemeine Informationen»", "b": [[["Kostenrechnungskreis", "K200", "Pflicht"], ["Kostenstelle", "PKW05", "neue Nummer"], ["Bezeichnung", "S05-PKW", "Pflicht (rot markiert)"], ["Beschreibung", "S05-PKW", "Pflicht (rot markiert)"], ["Verantwortlicher", "S05", "Pflicht"], ["Art der Kostenstelle", "H", "Hilfskostenstelle"], ["Gültig ab / bis", "01.01.2026 / 31.12.9999", "Gültigkeit"]]]}, {"h": "Schritt 3: Bereich «Organisationseinheit» (S. 99)", "b": [[["Standardhierarchieknoten", "HILF05", "Pflicht; Platz im Baum"], ["Buchungskreis", "B200", "deine Firma"], ["Währung", "CHF", "Währung"]]]}, {"h": "Schritt 4: Anlegen", "b": ["Mit Vorlage: fertige Kostenstelle markieren → Kopieren (S. 100) und anpassen."]}], "kontrolle": "Alle acht Kostenstellen erscheinen unter S05-HG (siehe Aufgabe 6).", "falle": "Mussfelder in KS01 laut Folie: Bezeichnung, Verantwortlicher, Art der Kostenstelle, Hierarchiebereich, Währung. «Verantwortlicher» (Text) ist Pflicht, «verantwortlicher Benutzer» nicht.", "q": "Skript S. 15, 62, 81–101; Kurs 19.11."}, {"nr": 6, "t": "Hierarchie S05-HG anzeigen", "sm": true, "worum": "Du kontrollierst, ob alle Gruppen und Kostenstellen an der richtigen Stelle im Baum hängen.", "daten": ["Erwartet: S05-HG → HAUPT05 (RW05, EK05, VT05, PE05) und HILF05 (PKW05, LIT05, REIN05, BILD05)"], "g": [{"h": "Variante A: OKENN", "b": ["OKENN (Standardhierarchie anzeigen, S. 103) → S05-HG wählen → Baum aufklappen."]}, {"h": "Variante B: KSH3", "b": ["KSH3 (Kostenstellengruppe anzeigen, S. 72).", [["Kostenrechnungskreis", "K200", "Controlling-Einheit"], ["Kostenstellengruppe", "S05-HG", "deine Obergruppe"]]]}], "f": [{"h": "App öffnen", "b": ["App «Kostenstellengruppen verwalten» → Standardhierarchie → Name K200 anklicken (nur anzeigen, S. 112) → S05-HG suchen und aufklappen."]}], "kontrolle": "Acht Kostenstellen sichtbar, je vier unter HAUPT05 und HILF05.", "falle": "Rot angezeigte Einträge sind noch nicht gesicherte Änderungen (Folie).", "q": "Skript S. 15, 72, 103, 112; Folie"}, {"nr": 7, "t": "Werkstattrechnung für das Pool-Auto buchen", "sm": true, "worum": "Die Werkstatt hat das Pool-Auto repariert, für CHF 556.29 inklusive MwSt (Mehrwertsteuer). Bezahlt wurde mit der Firmenkreditkarte. Du buchst den Aufwand auf die Kostenstelle des Autos.", "satz": "Reparaturaufwand 62002.05 (Soll, Kostenstelle PKW05, Steuerkennzeichen V1) an Verbindlichkeiten Kreditkarten 22154.05 (Haben)", "daten": ["Rechnung Nr. 8840, KFZ-Werkstatt Ing. Otto Motor (S. 16)", "Netto 514.61 + MwSt 8,1 % 41.68 = CHF 556.29"], "g": [{"h": "Schritt 1: Transaktion öffnen", "b": ["FB50 (Sachkontenbeleg erfassen, S. 174). Buchungskreis B200 kommt aus dem Parameter."]}, {"h": "Schritt 2: Register «Grunddaten»", "b": [[["Belegdatum", "Datum der Rechnung", "so steht es auf dem Papierbeleg"], ["Buchungsdatum", "heute", "bestimmt die Periode"], ["Referenz", "8840", "Rechnungsnummer, damit man den Beleg wiederfindet"], ["Währung", "CHF", "Rechnungswährung"], ["Belegkopftext", "z. B. Reparatur Pool-Auto", "freiwillig"]]]}, {"h": "Schritt 3: Register «Detail»", "b": ["Häkchen bei «Steuer rechnen» setzen (oder schon gesetzt über Parameter XTX, S. 176). Dann rechnet SAP die MwSt aus dem Bruttobetrag selbst heraus."]}, {"h": "Schritt 4: Erfassungsvariante wählen", "b": ["Arbeitsvorlagen → Erfassungsvarianten → STANDARD 3_0100. Grund: Diese Variante zeigt die Spalten Steuer und Kostenstelle (S. 178; Folie)."]}, {"h": "Schritt 5: Zeile 1, Aufwand", "b": [[["Sachkonto", "62002.05", "dein Reparaturkonto aus Aufgabe 3"], ["S/H (Soll/Haben)", "S (Soll)", "Aufwand steht im Soll"], ["Betrag Belegwährung", "556.29", "Bruttobetrag der Rechnung"], ["Steuerkennzeichen", "V1", "Vorsteuer 8,1 %; das Konto erlaubt nur V1"], ["Kostenstelle", "PKW05", "die Kosten gehören zum Pool-Auto"]]]}, {"h": "Schritt 6: Zeile 2, Gegenkonto", "b": [[["Sachkonto", "22154.05", "Schuld bei der Kreditkartenfirma"], ["S/H", "H (Haben)", "Gegenseite der Buchung"], ["Betrag", "556.29 (oder * für den Restbetrag, S. 177)", "gleicher Betrag, damit der Saldo 0 ist"], ["Steuerkennzeichen", "leer", "auf der Gegenseite steht nie ein Steuerkennzeichen (Folie 28)"], ["Kostenstelle", "leer", "Bilanzkonto, kein Controlling"]]]}, {"h": "Schritt 7: Prüfen und buchen", "b": ["«Simulieren»: Die Ampel muss grün sein (Saldo 0).", "Dann «Buchen». Belegnummer notieren."]}], "f": [{"h": "Schritt 1: App öffnen", "b": ["App «Hauptbuchbelege buchen» (S. 181). Die Skript-Aufgabe verlangt diese App."]}, {"h": "Schritt 2: Kopfdaten (S. 183)", "b": [[["Buchungskreis", "B200", "deine Firma"], ["Buchungsbelegdatum", "Datum der Rechnung", "Papierbeleg"], ["Buchungsdatum", "heute", "Periode"], ["Belegart", "SA", "Sachkontenbeleg"], ["Transaktionswährung", "CHF", "Rechnungswährung"], ["Referenz", "8840", "Rechnungsnummer"]]]}, {"h": "Schritt 3: Zeile 1, Aufwand", "b": ["In Fiori gibt es kein Feld S/H, sondern zwei Spalten «Soll» und «Haben» (S. 184).", [["Sachkonto", "62002.05", "Reparaturkonto"], ["Soll", "556.29", "Aufwand"], ["Steuerkennzeichen", "V1", "Vorsteuer 8,1 %"], ["Kostenstelle", "PKW05", "Pool-Auto"]]]}, {"h": "Schritt 4: Zeile 2, Gegenkonto", "b": [[["Sachkonto", "22154.05", "Kreditkartenschuld"], ["Haben", "556.29", "Gegenseite"], ["Steuerkennzeichen", "leer", "nie auf der Gegenseite"]]]}, {"h": "Schritt 5: Buchen", "b": ["«Steuer berechnen» aktivieren, Saldo 0 (grün) → Buchen. Falls 556.29 nicht angenommen wird: Dezimalpunkt in den Einstellungen setzen (Kurs)."]}], "kontrolle": "SAP teilt auf: 514.61 Aufwand auf PKW05 und 41.68 Vorsteuer.", "falle": "Frage «Welche Eingaben gehören in die Positionen?» → Sachkonto, Soll/Haben, Betrag, Steuerkennzeichen, Kostenstelle (Folie 28).", "q": "Skript S. 13, 16, 174–186; Folien 27–29; Kurs 19.11."}, {"nr": 8, "t": "Lieferant Putzteufel anlegen und Rechnung buchen", "sm": false, "worum": "Eine Reinigungsfirma hat 18 Stunden geputzt. Du legst die Firma als Lieferanten an und buchst ihre Rechnung als Reinigungsaufwand auf die Kostenstelle Reinigung.", "satz": "Reinigungsaufwand 62022.05 (Soll, Kostenstelle REIN05, V1) an Lieferant Putzteufel GmbH (Haben)", "daten": ["Putzteufel GmbH, Industriestrasse 14, 8952 Schlieren (S. 17)", "Rechnung Nr. 864: 18 Std. × CHF 25.00 = 450.00 + MwSt 8,1 % 36.45 = CHF 486.45, zahlbar ohne Abzug"], "g": [{"h": "Teil A, Schritt 1: Geschäftspartner öffnen", "b": ["Oben links ins Kommandofeld BP eintippen, Enter (aus einer anderen Transaktion: /nBP). Es öffnet sich «Geschäftspartner bearbeiten» (S. 142).", "Oben die drei Knöpfe Person, Organisation, Gruppe: auf «Organisation» klicken, weil der Lieferant eine Firma ist."]}, {"h": "Teil A, Schritt 2: Grunddaten", "b": [[["Anlegen in GP-Rolle (Geschäftspartnerrolle)", "ZVEND Kreditor/Lieferant zentral", "damit Einkaufs- und Buchhaltungsdaten möglich sind"], ["Gruppierung", "BPCH (interne Nummernvergabe CH)", "SAP vergibt die Nummer selbst"], ["Geschäftspartner (Nummer)", "leer", "wird automatisch vergeben"], ["Name", "Putzteufel GmbH", "laut Rechnung"], ["Strasse / PLZ / Ort", "Industriestrasse 14 / 8952 / Schlieren", "laut Rechnung"], ["Land / Sprache", "CH / DE", "Schweizer Firma"]]]}, {"h": "Teil A, Schritt 3: Buchungskreisdaten B200", "b": [[["Abstimmkonto", "20000", "Pflichtfeld; verbindet den Lieferanten mit dem Hauptbuch (S. 165)"], ["Zahlungsbedingung", "sofort ohne Abzug", "laut Rechnung"]], "Sichern und die neue Nummer notieren."]}, {"h": "Teil B, Schritt 1: Rechnung erfassen", "b": ["FB60 (Eingangsrechnung erfassen, S. 187). Vorgang: Rechnung."]}, {"h": "Teil B, Schritt 2: Register «Grunddaten»", "b": [[["Kreditor", "Nummer von Putzteufel", "wer die Rechnung stellt"], ["Rechnungsdatum", "Datum der Rechnung", "Papierbeleg"], ["Buchungsdatum", "heute", "Periode"], ["Referenz", "864", "Rechnungsnummer"], ["Betrag", "486.45", "Bruttobetrag"], ["Währung", "CHF", ""], ["Steuer rechnen", "Häkchen", "MwSt wird herausgerechnet"]]]}, {"h": "Teil B, Schritt 3: Position (Aufwand)", "b": [[["Sachkonto", "62022.05", "Reinigungskonto aus Aufgabe 3"], ["S/H", "S (Soll)", "Aufwand"], ["Betrag", "486.45", "brutto"], ["Steuerkennzeichen", "V1", "Vorsteuer 8,1 %"], ["Kostenstelle", "REIN05", "Kosten der Reinigung"]], "Die Lieferantenzeile (Haben) erzeugt SAP selbst aus dem Kopf; dort steht kein Steuerkennzeichen."]}, {"h": "Teil B, Schritt 4: Buchen", "b": ["Saldo 0 (grün) → Buchen."]}], "f": [{"h": "Lieferant anlegen", "b": ["App «Lieferantenstammdaten verwalten» → Anlegen (S. 164). Felder wie in Aufgabe 10."]}, {"h": "Rechnung buchen", "b": ["Das Skript beschreibt für diesen Schritt keine Fiori-App. Im Kurs und in der Prüfung gilt der Weg im SAP GUI (grafische Benutzeroberfläche).", "In SAP gibt es dafür z. B. die App «Lieferantenrechnungen erfassen» (allgemeines SAP-Wissen, nicht im Skript und nicht im Übungsheft; im Kurs prüfen)."]}], "kontrolle": "Siehe Aufgabe 9: REIN05 ist mit 450.00 belastet (netto, die Vorsteuer ist kein Aufwand).", "falle": "Auf der Folie heisst die alte Transaktion FK01 (Kreditor anlegen); im Skript wird der Lieferant mit BP angelegt.", "q": "Skript S. 17, 142–172, 187–190; Folie"}, {"nr": 9, "t": "Buchung auf REIN05 kontrollieren", "sm": true, "worum": "Du prüfst die Buchung aus Aufgabe 8 aus allen Blickwinkeln: Beleg der Finanzbuchhaltung, Beleg des Controllings, offene Posten beim Lieferanten, Einzelposten und Bericht der Kostenstelle.", "daten": ["Laut Skript S. 18: FB03, KSB5, FBL1N, KSB1, S_ALR_87013611"], "g": [{"h": "Schritt 1: FI-Beleg (Finanzbuchhaltung)", "b": ["FB03 (Beleg anzeigen, S. 196).", [["Belegnummer", "aus Aufgabe 8", "welcher Beleg"], ["Buchungskreis", "B200", ""], ["Geschäftsjahr", "2026", ""]], "Zum CO-Beleg (Controlling-Beleg): Umfeld → Belegumfeld → Rechnungswesenbelege (S. 198)."]}, {"h": "Schritt 2: CO-Beleg direkt", "b": ["KSB5 (Kostenrechnungsbelege Istkosten anzeigen, S. 199)."]}, {"h": "Schritt 3: Lieferant", "b": ["FBL1N (Lieferanten-Einzelposten, S. 195).", [["Lieferant", "Putzteufel", "wessen Posten"], ["Buchungskreis", "B200", ""], ["Status", "offene Posten", "Rechnung ist noch nicht bezahlt"]]]}, {"h": "Schritt 4: Kostenstelle, Einzelposten", "b": ["KSB1 (Kostenstellen-Einzelposten Ist).", [["Kostenstelle", "REIN05", "die belastete Kostenstelle"], ["Periode / Jahr", "aktuelle Periode, 2026", "Zeitraum"]]]}, {"h": "Schritt 5: Bericht", "b": ["S_ALR_87013611 (Kostenstellen Ist/Plan/Abweichung, S. 348).", [["Kostenrechnungskreis", "K200", ""], ["Geschäftsjahr / Periode", "2026 / aktuelle", ""], ["Kostenstelle oder -gruppe", "REIN05", "Folie: Gruppe statt einzeln eingeben ist eine Variante"]], "Ausführen → Doppelklick auf den Betrag → Einzelposten → Umfeld → Ursprungsbeleg."]}], "f": [{"h": "Beleg", "b": ["App «Buchungsbelege verwalten» (im Skript S. 344 als Sprungziel genannt)."]}, {"h": "Bericht Kostenstelle", "b": ["App «Kostenstellen – Istdaten» (S. 343–344); im Übungsheft F2121 heisst die Berichts-App «Cost Centers Review Booklet»."]}, {"h": "Einzelposten Kostenstelle", "b": ["App «Einzelposten anzeigen – Kostenrechnung» (Display Line Items – Cost Accounting; Übungsheft Übung 13)."]}, {"h": "Lieferanten-Einzelposten", "b": ["Das Skript beschreibt für diesen Schritt keine Fiori-App. Im Kurs und in der Prüfung gilt der Weg im SAP GUI (grafische Benutzeroberfläche). (Fiori-App dafür: allgemeines SAP-Wissen, nicht im Skript und nicht im Übungsheft; im Kurs prüfen)"]}], "kontrolle": "Überall dieselben Zahlen: FI-Beleg 486.45 brutto; REIN05 mit 450.00 belastet; beim Lieferanten 486.45 offen.", "falle": "FB03 zeigt den FI-Beleg (Finanzbuchhaltung), KSB5 den CO-Beleg (Controlling). Vom Bericht kommst du per Doppelklick bis zum Ursprungsbeleg.", "q": "Skript S. 18, 195–199, 343–344, 348–350; Folie; Übungsheft F2121 Übung 13"}, {"nr": 10, "t": "Lieferant S05-Atlas Training in Fiori anlegen", "sm": false, "worum": "Eine Schulungsfirma wird als neuer Lieferant angelegt, diesmal mit der Fiori-App. Später bestellst du bei ihr Skripten und buchst ihre Rechnungen.", "daten": ["Name S05-Atlas Training (ATLAS Training GmbH), Schulhausstrasse 14, 8002 Zürich (S. 19)", "Buchungskreis B200, Einkaufsorganisation E200, Abstimmkonto 20000, sofort zahlbar ohne Abzug, Zahlweg Überweisung"], "g": [{"h": "Gleicher Inhalt mit BP", "b": ["Kommandofeld: BP eintippen, Enter (Geschäftspartner bearbeiten, S. 142) → Knopf «Organisation», Rolle ZVEND, Gruppierung BPCH. Felder wie im Fiori-Teil unten; zusätzlich Einkaufsorganisation E200 mit Bestellwährung CHF. Die Skript-Aufgabe verlangt aber Fiori."]}], "f": [{"h": "Schritt 1: App öffnen", "b": ["App «Lieferantenstammdaten verwalten» → Anlegen (S. 164)."]}, {"h": "Schritt 2: Erstes Bild", "b": [[["Geschäftspartnerkategorie", "Organisation", "Firma, keine Person"], ["Gruppierung", "BPCH (interne Nummernvergabe CH)", "SAP vergibt die Nummer"], ["Geschäftspartner", "leer", "automatisch"], ["Geschäftspartnerrolle", "leer lassen", "ZVEND gibt es in Fiori nicht; die Rollen Lieferant und Kreditor kommen später im Register Rollen dazu (S. 165)"]]]}, {"h": "Schritt 3: Name und Adresse", "b": [[["Anrede", "Firma", ""], ["Name 1", "S05-Atlas Training", "mit Gruppennummer"], ["Strasse", "Schulhausstrasse 14", ""], ["PLZ / Ort", "8002 / Zürich", ""], ["Land / Sprache", "CH / DE", ""]]]}, {"h": "Schritt 4: Organisationsdaten (S. 165)", "b": [[["Einkaufsorganisation", "E200", "damit man bei ihm bestellen kann"], ["Auftragswährung", "CHF", "Bestellwährung"], ["Buchungskreis", "B200", "damit man Rechnungen buchen kann"], ["Abstimmkonto", "20000", "Pflicht; Verbindung zum Hauptbuch"]]]}, {"h": "Schritt 5: Zahlungsdaten", "b": [[["Zahlungsbedingung (Einkaufsorganisation E200)", "0001 sofort zahlbar ohne Abzug", "laut Aufgabe (S. 168)"], ["Zahlweg (Buchungskreis B200)", "Überweisung", "laut Aufgabe (S. 19)"]]]}, {"h": "Schritt 6: Sichern", "b": ["Lieferantennummer notieren."]}], "kontrolle": "Der Lieferant erscheint in der App-Liste mit B200 und E200.", "falle": "Ohne Abstimmkonto kann der Lieferant nicht gesichert werden. Ohne Einkaufsorganisation kann man bei ihm nicht bestellen.", "q": "Skript S. 19, 142–172"}, {"nr": 11, "t": "Rechnung von Atlas Training (SAP-Lehrgang) buchen", "sm": false, "worum": "Atlas Training stellt den SAP-Lehrgang in Rechnung. Du buchst ihn als Ausbildungsaufwand auf die Kostenstelle Ausbildung.", "satz": "Aus- und Fortbildung 58102.05 (Soll, Kostenstelle BILD05, V1) an Lieferant S05-Atlas Training (Haben)", "daten": ["Rechnung Nr. 17071: CHF 2'450.00 + MwSt 8,1 % 198.45 = CHF 2'648.45, zahlbar ohne Abzug (S. 20)"], "g": [{"h": "Schritt 1: Transaktion", "b": ["FB60 (Eingangsrechnung erfassen, S. 187). Vorgang: Rechnung."]}, {"h": "Schritt 2: Register «Grunddaten»", "b": [[["Kreditor", "S05-Atlas Training", "Rechnungssteller"], ["Rechnungsdatum", "laut Rechnung", ""], ["Buchungsdatum", "heute", ""], ["Referenz", "17071", "Rechnungsnummer"], ["Betrag", "2648.45", "brutto"], ["Währung", "CHF", ""], ["Steuer rechnen", "Häkchen", "MwSt wird herausgerechnet"], ["Text", "SAP Lehrgang", "freiwillig"]]]}, {"h": "Schritt 3: Position (Aufwand)", "b": [[["Sachkonto", "58102.05", "Aus- und Fortbildung"], ["S/H", "S (Soll)", "Aufwand"], ["Betrag", "2648.45", "brutto"], ["Steuerkennzeichen", "V1", "Vorsteuer 8,1 %"], ["Kostenstelle", "BILD05", "Ausbildungskosten"]]]}, {"h": "Schritt 4: Buchen", "b": ["Saldo 0 → Buchen. Belegnummer notieren, du brauchst sie in Aufgabe 12."]}], "f": [{"h": "Rechnung buchen", "b": ["Das Skript beschreibt für diesen Schritt keine Fiori-App. Im Kurs und in der Prüfung gilt der Weg im SAP GUI (grafische Benutzeroberfläche).", "Fiori-App für Rechnungen ohne Bestellung: z. B. «Lieferantenrechnungen erfassen» (allgemeines SAP-Wissen, nicht im Skript und nicht im Übungsheft; im Kurs prüfen)."]}], "kontrolle": "BILD05 ist mit 2'450.00 belastet (netto).", "falle": "Die Kosten landen zuerst auf BILD05 (Ausbildung) und werden erst in Aufgabe 12 auf RW05 umgebucht.", "q": "Skript S. 20–21, 187–190"}, {"nr": 12, "t": "Ausbildungskosten von BILD05 auf RW05 umbuchen", "sm": false, "worum": "Der Lehrgang war für das Rechnungswesen. Deshalb verschiebst du die Kosten aus Aufgabe 11 von der Kostenstelle Ausbildung auf die Kostenstelle Rechnungswesen, mit Bezug auf den ursprünglichen Beleg.", "satz": "Kostenstelle RW05 belastet, Kostenstelle BILD05 entlastet, je 2'450.00 auf Kostenart 58102.05", "daten": ["Sender BILD05, Empfänger RW05, Bezug: Beleg aus Aufgabe 11 (S. 21)"], "g": [{"h": "Schritt 1: Transaktion", "b": ["KB61 (Einzelpostenumbuchung, S. 264). «Einzelposten» heisst: Du nimmst eine bestimmte Buchung und hängst sie um."]}, {"h": "Schritt 2: Beleg auswählen", "b": [[["Belegnummer", "FI-Beleg aus Aufgabe 11", "welche Buchung umgehängt wird"], ["Buchungskreis", "B200", ""], ["Geschäftsjahr", "2026", ""], ["Kostenart / Kostenstelle (freiwillig)", "58102.05 / BILD05", "engt die Auswahl ein"]], "Ausführen."]}, {"h": "Schritt 3: Neue Kostenstelle eintragen", "b": [[["Kostenstelle (neu)", "RW05", "Rechnungswesen trägt die Kosten"], ["Betrag", "2450.00", "ganzer Nettobetrag"]]]}, {"h": "Schritt 4: Buchen", "b": ["Senderverprobung: SAP prüft, ob die Kosten wirklich auf BILD05 gebucht waren. Der FI-Beleg bleibt unverändert (dort steht weiter BILD05)."]}], "f": [{"h": "Umbuchen", "b": ["App «Kosten und Erlöse neu zuordnen» (Reassign Costs and Revenues; Übungsheft F2121 Übung 15).", [["Sachkonto", "58102.05", "Kostenart"], ["Sender-Kostenstelle", "BILD05", "gibt ab"], ["Empfänger-Kostenstelle", "RW05", "erhält"], ["Betrag", "2450.00", ""]], "Achtung, meine Zuordnung: So gebucht wirkt es wie KB11N, ohne Bezug zum Ursprungsbeleg. Das Skript zeigt hier nur KB61."]}], "kontrolle": "BILD05 steht auf 0, RW05 hat +2'450.00.", "falle": "KB61 = mit Bezug auf einen Beleg und mit Senderverprobung. KB11N = ohne Belegbezug, ohne Senderverprobung (S. 257, 263).", "q": "Skript S. 21, 257, 263–266; Übungsheft F2121 Übung 15"}, {"nr": 13, "t": "Skripten bei Atlas Training bestellen und Obligo prüfen", "sm": true, "worum": "Du bestellst 35 Skripten für die Kostenstelle Fachliteratur. Schon mit der Bestellung entsteht ein Obligo (Verpflichtung, Kosten sind «reserviert»), das du im Controlling sehen kannst.", "daten": ["10 BT + 6 PT + 4 ST + 7 FT + 3 CT + 5 ET = 35 Skripten à CHF 15.00 = 525.00 netto (S. 21)", "Lieferung in 14 Tagen, Warengruppe Sonstiges, Werk W210", "Sachkonto 65032.05, Kostenstelle LIT05, Steuerkennzeichen V2 (2,6 %, Bücher)"], "g": [{"h": "Schritt 1: Transaktion", "b": ["ME21N (Bestellung anlegen, S. 209)."]}, {"h": "Schritt 2: Kopf", "b": [[["Belegart", "NB Normalbestellung", "normale Bestellung"], ["Lieferant", "S05-Atlas Training", "bei wem bestellt wird"], ["Einkaufsorganisation", "E200", "aus Parameter"], ["Einkäufergruppe", "S05", "aus Parameter"], ["Buchungskreis", "B200", "aus Parameter"]]]}, {"h": "Schritt 3: Positionen (je Skriptum eine Zeile)", "b": [[["K (Kontierungstyp)", "K", "K = Kostenstelle; die Ware wird direkt verbraucht"], ["Material", "leer", "kein Lagermaterial"], ["Kurztext", "z. B. SAP CP BT Skriptum", "beschreibt die Ware"], ["Bestellmenge", "10 (bzw. 6, 4, 7, 3, 5)", "laut Aufgabe"], ["Bestellmengeneinheit", "ST (Stück)", ""], ["Lieferdatum", "in 14 Tagen", "laut Aufgabe"], ["Nettopreis", "15", "Preis pro Stück"], ["Warengruppe", "Sonstiges", "laut Aufgabe"], ["Werk", "W210", "Lieferort"]]]}, {"h": "Schritt 4: Positionsdetail, Register «Kontierung»", "b": [[["Sachkonto", "65032.05", "Fachliteratur"], ["Kostenstelle", "LIT05", "wer die Kosten trägt"]]]}, {"h": "Schritt 5: Positionsdetail, Steuer", "b": [[["Steuerkennzeichen", "V2", "2,6 % für Bücher (S. 215)"]]]}, {"h": "Schritt 6: Sichern", "b": ["Bestellnummer notieren."]}, {"h": "Schritt 7: Obligo prüfen", "b": ["ME23N (Bestellung anzeigen) → Umfeld → Belegposition → RW-Obligobelege (S. 219), oder Bericht S_ALR_87013620 (Kostenstellen Ist/Plan/Obligo, S. 220)."]}], "f": [{"h": "Schritt 1: App", "b": ["App «Bestellungen verwalten» → Anlegen (S. 227)."]}, {"h": "Schritt 2: Allgemeine Informationen", "b": [[["Bestellart", "Normalbestellung (NB)", ""], ["Lieferant", "S05-Atlas Training", ""], ["Einkaufsorganisation / Buchungskreis / Währung", "E200 / B200 / CHF", "kommen aus dem Lieferanten"], ["Einkäufergruppe", "S05", ""]]]}, {"h": "Schritt 3: Positionen → Anlegen (S. 229)", "b": [[["Kurztext", "z. B. SAP CP BT Skriptum", ""], ["Warengruppe", "Sonstiges", ""], ["Werk", "W210", "Pflicht"], ["Bestellmenge", "10 usw.", ""], ["Bestellnettopreis", "15", ""], ["Preiseinheit", "1", "Preis gilt pro 1 Stück"]]]}, {"h": "Schritt 4: Positionsdetails", "b": [[["Kontierungstyp", "K", "Kostenstelle"], ["Sachkonto", "65032.05", ""], ["Kostenstelle", "LIT05", ""], ["Steuerkennzeichen", "V2", "Bücher"]]]}, {"h": "Schritt 5: Bestellen und Obligo prüfen", "b": ["Bestellen. Danach in der Bestellung den Knopf «Obligos anzeigen» drücken (S. 226)."]}], "kontrolle": "Obligo auf LIT05: 525.00. Noch kein Ist (keine echten Kosten), weil die Ware noch nicht da ist.", "falle": "Die Folie zeigt alte Werte W110/E100. Massgebend ist das Skript: W210/E200.", "q": "Skript S. 21, 209–231; Folie"}, {"nr": 14, "t": "Wareneingang zur Bestellung buchen", "sm": false, "worum": "Die Skripten sind angekommen. Mit dem Wareneingang werden die Kosten auf LIT05 zu echten Istkosten, und das Obligo wird abgebaut.", "satz": "Fachliteratur 65032.05 (Kostenstelle LIT05) an WE/RE-Verrechnungskonto (Wareneingang/Rechnungseingang), 525.00 (Kontenlogik S. 240, 254)", "daten": ["Belastung LIT05: CHF 525.00 = 35 × 15 (meine Rechnung; Vorsteuer ist kein Aufwand) (S. 22)"], "g": [{"h": "Schritt 1: Transaktion", "b": ["MIGO (Warenbewegung, S. 232)."]}, {"h": "Schritt 2: Oben links auswählen", "b": [[["Vorgang", "A01 Wareneingang", "was du tust"], ["Referenz", "R01 Bestellung", "worauf du dich beziehst"], ["Bestellnummer", "aus Aufgabe 13", "welche Bestellung"]], "Enter. Die Bewegungsart wird aus dem Vorgang vorgeschlagen (S. 232)."]}, {"h": "Schritt 3: Positionen bestätigen", "b": ["Bei jeder Position das Kästchen «Position OK» anhaken (mindestens eine)."]}, {"h": "Schritt 4: Prüfen und buchen", "b": []}], "f": [{"h": "Schritt 1: App", "b": ["App «Wareneingang zu Einkaufsbeleg buchen» (S. 237).", [["Einkaufsbeleg", "Bestellnummer aus Aufgabe 13", "welche Bestellung"]]]}, {"h": "Schritt 2: Positionen prüfen und buchen", "b": [[["Menge", "35 (verteilt auf 6 Positionen)", "alles geliefert"], ["Lagerort", "LO05", "Kurs"]]]}], "kontrolle": "Materialbeleg → Rechnungswesenbelege: LIT05 ist mit 525.00 belastet, das Obligo ist weg.", "falle": "Bei einer kontierten Bestellung (Kontierung K) entstehen die Istkosten schon beim Wareneingang: Es gibt einen Buchhaltungsbeleg und einen Kostenrechnungsbeleg (S. 240).", "q": "Skript S. 22, 232–241"}, {"nr": 15, "t": "Rechnung zur Bestellung buchen", "sm": false, "worum": "Die Rechnung für die Skripten kommt. Du buchst sie mit Bezug auf die Bestellung; SAP prüft Menge und Preis automatisch.", "satz": "WE/RE-Verrechnungskonto 525.00 und Vorsteuer 13.65 an Lieferant S05-Atlas Training 538.65", "daten": ["Rechnung Nr. 17212: CHF 525.00 + MwSt 2,6 % 13.65 = CHF 538.65, Steuerkennzeichen V2 (S. 23)"], "g": [{"h": "Schritt 1: Transaktion", "b": ["MIRO (Eingangsrechnung hinzufügen, S. 242). Vorgang: Rechnung."]}, {"h": "Schritt 2: Register «Grunddaten»", "b": [[["Rechnungsdatum", "laut Rechnung", ""], ["Buchungsdatum", "heute", ""], ["Referenz", "17212", "Rechnungsnummer"], ["Betrag", "538.65", "brutto"], ["Steuer rechnen", "Häkchen", ""], ["Steuerkennzeichen", "V2", "2,6 % Bücher"]]]}, {"h": "Schritt 3: Bestellbezug", "b": [[["Bestellung", "Nummer aus Aufgabe 13", "SAP übernimmt alle Positionen"]]]}, {"h": "Schritt 4: Buchen", "b": ["Saldo 0 → Buchen."]}], "f": [{"h": "Schritt 1: App", "b": ["App «Lieferantenrechnung anlegen» (S. 248)."]}, {"h": "Schritt 2: Allgemeine Informationen", "b": [[["Vorgang", "Rechnung", ""], ["Buchungskreis", "B200", ""], ["Rechnungssteller", "S05-Atlas Training", ""], ["Rechnungsdatum / Buchungsdatum", "laut Rechnung / heute", ""], ["Bruttobetrag", "538.65", ""], ["Referenz", "17212", ""]]]}, {"h": "Schritt 3: Register «Einkaufsbelegreferenzen»", "b": ["Bestellung suchen, markieren, übernehmen (S. 251)."]}, {"h": "Schritt 4: Steuer V2 prüfen, Saldo 0, Buchen", "b": []}], "kontrolle": "LIT05 bleibt bei 525.00: Die Rechnung gleicht nur das WE/RE-Verrechnungskonto aus (S. 254) und erzeugt keine neuen Kosten.", "falle": "Bei Bestellung mit Kontierung K: Kosten beim Wareneingang (Aufgabe 14), nicht bei der Rechnung.", "q": "Skript S. 23, 242–256"}, {"nr": 16, "t": "LIT05 auf die Hauptkostenstellen umbuchen", "sm": true, "worum": "Die 525.00 für Skripten liegen auf LIT05. Jede Abteilung bekommt ihre Skripten belastet. Du verteilst die Kosten mit einer manuellen Umbuchung.", "satz": "EK05 120, VT05 90, RW05 210, PE05 105 belastet; LIT05 525 entlastet; Kostenart 65032.05", "daten": ["EK05: 2 BT + 6 PT = 8 × 15 = 120", "VT05: 2 BT + 4 ST = 6 × 15 = 90", "RW05: 4 BT + 7 FT + 3 CT = 14 × 15 = 210", "PE05: 2 BT + 5 ET = 7 × 15 = 105", "Total 525 (S. 24; Folie)"], "g": [{"h": "Schritt 1: Transaktion", "b": ["KB11N (Primärkosten manuell umbuchen, S. 258)."]}, {"h": "Schritt 2: Kopf", "b": [[["Kostenrechnungskreis", "K200", ""], ["Belegdatum / Buchungsdatum", "heute", ""], ["Belegtext", "z. B. Skripten verteilen", "freiwillig"], ["Erfassungsvariante", "01SAP Kostenstelle", "zeigt die Spalten für Kostenstellen"], ["Eingabetyp", "Listerfassung", "mehrere Zeilen untereinander"]]]}, {"h": "Schritt 3: Zeilen", "b": [[["Zeile 1", "Kostenstelle alt LIT05, Kostenart 65032.05, Betrag 120, Kostenstelle neu EK05", "Einkauf"], ["Zeile 2", "LIT05, 65032.05, 90, VT05", "Vertrieb"], ["Zeile 3", "LIT05, 65032.05, 210, RW05", "Rechnungswesen"], ["Zeile 4", "LIT05, 65032.05, 105, PE05", "Personal"]]]}, {"h": "Schritt 4: Buchen", "b": ["Keine Senderverprobung (S. 257)."]}], "f": [{"h": "Umbuchen", "b": ["App «Kosten und Erlöse neu zuordnen» (Reassign Costs and Revenues; Übungsheft F2121 Übung 15). Meine Zuordnung, das Skript zeigt nur KB11N.", [["Sachkonto", "65032.05", ""], ["Sender-Kostenstelle", "LIT05", "gibt ab"], ["Empfänger", "EK05 / VT05 / RW05 / PE05", "je eine Zeile"], ["Betrag", "120 / 90 / 210 / 105", ""]]]}], "kontrolle": "LIT05 = 0; EK05 +120, VT05 +90, RW05 +210, PE05 +105.", "falle": "Bei einer Umbuchung bleibt die ursprüngliche Kostenart (65032.05) erhalten; die Entlastung steht auf dem Sender mit Minus.", "q": "Skript S. 24, 257–262; Folie; Übungsheft F2121 Übung 15"}, {"nr": 17, "t": "Kennzahl KM05 anlegen und Kilometer erfassen", "sm": true, "worum": "Die Kosten des Pool-Autos sollen später nach gefahrenen Kilometern verteilt werden. Dazu legst du eine statistische Kennzahl (eine Mengenzahl, kein Geld) an und erfasst die Kilometer je Abteilung.", "daten": ["KM05, Einheit km, Typ Summenwerte (gilt nur für die erfasste Periode, S. 115)", "Fahrtenbuch: VT05 2'027, EK05 423, PE05 230, RW05 57 = 2'737 km (S. 25; Summe meine Rechnung)"], "g": [{"h": "Schritt 1: Kennzahl anlegen", "b": ["KK01 (Statistische Kennzahl anlegen, S. 117).", [["Kostenrechnungskreis", "K200", ""], ["Statistische Kennzahl", "KM05", "Name der Kennzahl"]]]}, {"h": "Schritt 2: Stammdaten (S. 118)", "b": [[["Bezeichnung", "S05-Kilometer", ""], ["Einheit", "km", ""], ["Kennzahltyp", "Summenwerte", "Kilometer gelten nur für den Monat, in dem sie gefahren wurden"]], "Sichern."]}, {"h": "Schritt 3: Werte erfassen", "b": ["KB31N (Statistische Kennzahlen erfassen, S. 131).", [["Kostenrechnungskreis", "K200", ""], ["Buchungsdatum", "heute", "bestimmt die Periode"], ["Erfassungsvariante", "01SAP Kostenstelle", ""], ["Eingabetyp", "Listerfassung", ""]]]}, {"h": "Schritt 4: Zeilen", "b": [[["VT05", "KM05, Menge 2027", ""], ["EK05", "KM05, Menge 423", ""], ["PE05", "KM05, Menge 230", ""], ["RW05", "KM05, Menge 57", ""]], "Buchen."]}], "f": [{"h": "Schritt 1: Kennzahl anlegen", "b": ["App «Statistische Kennzahlen verwalten» → Anlegen (S. 128).", [["Statistische Kennzahl", "KM05", ""], ["Name", "S05-Kilometer", ""], ["Kostenrechnungskreis", "K200", ""], ["Mengeneinheit", "km", ""], ["Typ", "2 (Summenwerte)", "1 = Festwerte, 2 = Summenwerte"]]]}, {"h": "Schritt 2: Werte erfassen", "b": ["App «Statistische Kennzahlwerte verwalten» → Anlegen (S. 135; Vollbild empfohlen).", [["Belegkopftext", "z. B. Kilometer", ""], ["Buchungsdatum", "heute", "Periode"], ["Kostenrechnungskreis", "K200", ""]]]}, {"h": "Schritt 3: Zeilen", "b": [[["Empfängerkostenstelle VT05", "KM05, 2027", ""], ["EK05", "KM05, 423", ""], ["PE05", "KM05, 230", ""], ["RW05", "KM05, 57", ""]], "Buchen."]}], "kontrolle":
