f": ["Open the Fiori Launchpad, click the magnifier (search) at the top, type «Manage Cost Centers» (in a German system: «Kostenstellen verwalten») and click the tile (p. 93; name per F2121).", "Button «Create».", "Section «General Information»: controlling area, cost center, name, person responsible, cost center category, valid from/to.", "Section «Organizational Unit»: standard hierarchy node, company code (B200), currency (CHF).", "Save (Create). Alternatively select an existing cost center and «Copy»."], "tip": "Test question 2: fill every field the task names, even without a red asterisk (e.g. person responsible, currency)."}}, {"c": "KS02", "b": "Stammdaten", "s": "S. 86–87", "auf": [], "de": {"t": "Kostenstelle ändern", "z": "Bestehende Kostenstelle ändern.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nKS02» eintippen und Enter drücken. Alternativ im SAP-Menü: Rechnungswesen → Controlling → Kostenstellenrechnung → Stammdaten → Kostenstelle → Einzelbearbeitung → Ändern.", "Feld «Kostenstelle»: Kennung eintragen oder mit F4 suchen.", "Enter oder «Stammdaten»: der Stammsatz öffnet im Änderungsmodus.", "Die Register sind dieselben wie beim Anlegen (KS01). Ändern, dann Sichern."], "f": ["Fiori Launchpad öffnen, oben auf die Lupe (Suche) klicken, «Kostenstellen verwalten» eintippen und die Kachel anklicken (S. 95).", "Kostenstelle suchen, am Zeilenende auf den Pfeil (Details) klicken.", "Daten werden angezeigt. Mit «Bearbeiten» in den Änderungsmodus, ändern, Sichern."], "tip": ""}, "en": {"t": "Change cost center", "z": "Change an existing cost center.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nKS02» and press Enter. Alternatively in the SAP menu: Accounting → Controlling → Cost Center Accounting → Master Data → Cost Center → Individual Processing → Change (menu names translated by me; the course system was German).", "Field «Cost Center»: enter the ID or search with F4.", "Enter or «Master Data»: the record opens in change mode.", "The tabs are the same as in KS01. Change, then Save."], "f": ["Open the Fiori Launchpad, click the magnifier (search) at the top, type «Manage Cost Centers» (in a German system: «Kostenstellen verwalten») and click the tile (p. 95).", "Search the cost center, click the arrow (details) at the end of the row.", "The data is displayed. Use «Edit» to switch to change mode, change, Save."], "tip": ""}}, {"c": "KS03", "b": "Stammdaten", "s": "S. 88–89", "auf": [], "de": {"t": "Kostenstelle anzeigen", "z": "Bestehende Kostenstelle anzeigen.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nKS03» eintippen und Enter drücken. Alternativ im SAP-Menü: Rechnungswesen → Controlling → Kostenstellenrechnung → Stammdaten → Kostenstelle → Einzelbearbeitung → Anzeigen.", "Feld «Kostenstelle»: Kennung eintragen oder mit F4 suchen.", "Enter oder «Stammdaten»: der Stammsatz öffnet im Anzeigemodus.", "Die Register sind dieselben wie beim Anlegen (KS01)."], "f": ["Fiori Launchpad öffnen, oben auf die Lupe (Suche) klicken, «Kostenstellen verwalten» eintippen und die Kachel anklicken (S. 95).", "Kostenstelle suchen, am Zeilenende auf den Pfeil (Details) klicken.", "Daten werden angezeigt."], "tip": ""}, "en": {"t": "Display cost center", "z": "Display an existing cost center.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nKS03» and press Enter. Alternatively in the SAP menu: Accounting → Controlling → Cost Center Accounting → Master Data → Cost Center → Individual Processing → Display (menu names translated by me; the course system was German).", "Field «Cost Center»: enter the ID or search with F4.", "Enter or «Master Data»: the record opens in display mode.", "The tabs are the same as in KS01."], "f": ["Open the Fiori Launchpad, click the magnifier (search) at the top, type «Manage Cost Centers» (in a German system: «Kostenstellen verwalten») and click the tile (p. 95).", "Search the cost center, click the arrow (details) at the end of the row.", "The data is displayed."], "tip": ""}}, {"c": "KS04", "b": "Stammdaten", "s": "S. 90–92", "auf": [], "de": {"t": "Kostenstelle löschen", "z": "Löscht eine Kostenstelle, aber nur wenn darauf nichts geplant, gebucht oder als Obligo vorhanden ist und keine Kennzahlen geplant sind.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nKS04» eintippen und Enter drücken. Alternativ im SAP-Menü: Rechnungswesen → Controlling → Kostenstellenrechnung → Stammdaten → Kostenstelle → Einzelbearbeitung → Löschen.", "Feld «Kostenstelle» ausfüllen.", "Häkchen «Testlauf» gesetzt lassen, Ausführen. Das Protokoll zeigt, ob Löschen möglich ist.", "Für das echte Löschen das Häkchen «Testlauf» entfernen, erneut Ausführen und die Rückfrage mit «Ja» bestätigen.", "Protokoll zeigt die erfolgreiche Löschung."], "f": ["Das Skript beschreibt dafür keine Fiori-App. Im Kurs und in der Prüfung gilt der Weg im SAP GUI. (Die App «Kostenstellen verwalten» hat zwar einen Knopf «Löschen», das Skript beschreibt ihn aber nicht im Detail.)"], "tip": "Immer zuerst Testlauf. Aus der Standardhierarchie kann man eine Kostenstelle nur entfernen, nicht löschen."}, "en": {"t": "Delete cost center", "z": "Deletes a cost center, but only if nothing is planned, posted or committed on it and no key figures are planned.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nKS04» and press Enter. Alternatively in the SAP menu: Accounting → Controlling → Cost Center Accounting → Master Data → Cost Center → Individual Processing → Delete (menu names translated by me; the course system was German).", "Fill in «Cost Center».", "Leave «Test Run» ticked, execute. The log shows whether deletion is possible.", "For the real deletion remove the «Test Run» tick, execute again and confirm the question with «Yes».", "The log shows the successful deletion."], "f": ["The course script describes no Fiori app for this. In the course and the exam the SAP GUI path applies. (The app «Manage Cost Centers» has a «Delete» button, but the script does not describe it in detail.)"], "tip": "Always do a test run first. In the standard hierarchy a cost center can only be removed, not deleted."}}, {"c": "OKENN", "b": "Stammdaten", "s": "S. 102–104", "auf": [6], "de": {"t": "Standardhierarchie anzeigen", "z": "Zeigt den Baum aller Kostenstellen eines Kostenrechnungskreises. Jede Kostenstelle muss darin hängen.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nOKENN» eintippen und Enter drücken. Alternativ im SAP-Menü: Rechnungswesen → Controlling → Kostenstellenrechnung → Stammdaten → Standardhierarchie → Anzeigen.", "Links im Objektmanager nach der Gruppe suchen (z. B. S##-HG) und mit Doppelklick in den Übersichtsbereich übernehmen.", "Im Strukturbaum aufklappen; Doppelklick auf ein Objekt zeigt unten die Stammdaten."], "f": ["Fiori Launchpad öffnen, oben auf die Lupe (Suche) klicken, «Kostenstellengruppen verwalten» eintippen und die Kachel anklicken (S. 112).", "Knopf «Standardhierarchie» → auf den Namen der Hierarchie klicken (Anzeigemodus)."], "tip": "Kurs-Tipp (S. 106): Erst mit OKENN nur die eigene Gruppe öffnen, dann OKEON. So sperrt ihr euch nicht gegenseitig."}, "en": {"t": "Display standard hierarchy", "z": "Shows the tree of all cost centers of a controlling area. Every cost center must be in it.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nOKENN» and press Enter. Alternatively in the SAP menu: Accounting → Controlling → Cost Center Accounting → Master Data → Standard Hierarchy → Display (menu names translated by me; the course system was German).", "In the object manager on the left search for the group (e.g. S##-HG) and double-click to move it into the overview area.", "Expand the tree; double-click an object to see its master data below."], "f": ["Open the Fiori Launchpad, click the magnifier (search) at the top, type «Manage Cost Center Groups» (in a German system: «Kostenstellengruppen verwalten») and click the tile (p. 112).", "Button «Standard Hierarchy» → click the hierarchy name (display mode)."], "tip": "Course tip (p. 106): open only your own group with OKENN first, then OKEON, so you don't lock each other out."}}, {"c": "OKEON", "b": "Stammdaten", "s": "S. 105–111", "auf": [5, 6], "de": {"t": "Standardhierarchie ändern", "z": "Im Baum Gruppen und Kostenstellen anlegen, verschieben oder kopieren.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nOKEON» eintippen und Enter drücken. Alternativ im SAP-Menü: Rechnungswesen → Controlling → Kostenstellenrechnung → Stammdaten → Standardhierarchie → Ändern.", "Eigene Gruppe im Objektmanager suchen und per Doppelklick öffnen (vorher mit OKENN, siehe Tipp).", "Gruppe markieren, Symbol «Anlegen»: untergeordnete Gruppe, Gruppe auf gleicher Stufe oder Kostenstelle wählen.", "Daten im Detailbereich unten eintragen (Gruppe: Name und Bezeichnung; Kostenstelle: wie in KS01, ohne Hierarchiebereich), Enter.", "Verschieben per Drag-and-drop oder Symbol «Zuordnen».", "Sichern. Neue Kostenstellen sind bis dahin «inaktiv» (rotes Symbol); erst das Sichern aktiviert sie."], "f": ["Fiori Launchpad öffnen, oben auf die Lupe (Suche) klicken, «Kostenstellengruppen verwalten» eintippen und die Kachel anklicken (S. 113).", "Knopf «Standardhierarchie», Zeile markieren, «Bearbeiten».", "Ändern, Sichern."], "tip": "Testfrage 8: Rotes Symbol = «Kostenstelle ist inaktiv» = Änderung noch nicht gesichert. Gebucht werden kann trotzdem."}, "en": {"t": "Change standard hierarchy", "z": "Create, move or copy groups and cost centers in the tree.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nOKEON» and press Enter. Alternatively in the SAP menu: Accounting → Controlling → Cost Center Accounting → Master Data → Standard Hierarchy → Change (menu names translated by me; the course system was German).", "Search your group in the object manager and open it by double-click (open it with OKENN first, see tip).", "Select a group, icon «Create»: choose subordinate group, group on same level or cost center.", "Enter the data in the detail area below (group: name and description; cost center: as in KS01, without hierarchy area), Enter.", "Move by drag-and-drop or the «Assign» icon.", "Save. New cost centers are «inactive» until then (red icon); saving activates them."], "f": ["Open the Fiori Launchpad, click the magnifier (search) at the top, type «Manage Cost Center Groups» (in a German system: «Kostenstellengruppen verwalten») and click the tile (p. 113).", "Button «Standard Hierarchy», select the row, «Edit».", "Change, Save."], "tip": "Test question 8: red icon = «cost center is inactive» = change not saved yet. Posting is still possible."}}, {"c": "KK01", "b": "Stammdaten", "s": "S. 114–119; Fiori S. 124–130", "auf": [17, 18], "de": {"t": "Statistische Kennzahl anlegen", "z": "Eine Messgrösse wie Kilometer oder Quadratmeter, nach der später Kosten verteilt werden.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nKK01» eintippen und Enter drücken. Alternativ im SAP-Menü: Rechnungswesen → Controlling → Kostenstellenrechnung → Stammdaten → Statistische Kennzahlen → Einzelbearbeitung → Anlegen.", "Feld «Statist. Kennzahl»: eindeutige Kennung (z. B. KM##). Kostenrechnungskreis aus den Benutzervorgaben.", "Optional Vorlage angeben. Enter oder «Stammdaten».", "Bezeichnung (genau wie in der Aufgabe), Einheit (z. B. KM, M2; F4-Werthilfe), Kennzahltyp wählen: Festwerte oder Summenwerte.", "Sichern."], "f": ["Fiori Launchpad öffnen, oben auf die Lupe (Suche) klicken, «Statistische Kennzahlen verwalten» eintippen und die Kachel anklicken (S. 124).", "Knopf «Anlegen».", "Bereich «Allgemeine Informationen»: Statist. Kennzahl, Name, Kostenrechnungskreis, Mengeneinheit, Typ (Festwerte/Summenwerte).", "Sichern."], "tip": "Festwert = bleibt gleich und wird in die Folgeperioden des Jahres übernommen (m², Mitarbeiter). Summenwert = ändert sich jede Periode (Kilometer). Testfrage 15: der Radioknopf hat kein Sternchen, wird aber erwartet."}, "en": {"t": "Create statistical key figure", "z": "A measure such as kilometres or square metres used later to distribute costs.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nKK01» and press Enter. Alternatively in the SAP menu: Accounting → Controlling → Cost Center Accounting → Master Data → Statistical Key Figures → Individual Processing → Create (menu names translated by me; the course system was German).", "Field «Stat. Key Figure»: unique ID (e.g. KM##). Controlling area from user defaults.", "Optional template. Enter or «Master Data».", "Name (exactly as in the task), unit (e.g. KM, M2; F4 help), key figure category: fixed values or totals values.", "Save."], "f": ["Open the Fiori Launchpad, click the magnifier (search) at the top, type «Manage Statistical Key Figures» (in a German system: «Statistische Kennzahlen verwalten») and click the tile (p. 124; name per F2121).", "Button «Create».", "Section «General Information»: stat. key figure, name, controlling area, unit, category (fixed/totals values).", "Save."], "tip": "Fixed value = stays the same and is carried into the following periods of the year (m², employees). Totals value = changes every period (kilometres). Test question 15: the radio button has no asterisk but is expected."}}, {"c": "KK02", "b": "Stammdaten", "s": "S. 120–121", "auf": [], "de": {"t": "Statistische Kennzahl ändern", "z": "Bestehende Kennzahl ändern.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nKK02» eintippen und Enter drücken. Alternativ im SAP-Menü: Rechnungswesen → Controlling → Kostenstellenrechnung → Stammdaten → Statistische Kennzahlen → Einzelbearbeitung → Ändern.", "Feld «Statist. Kennzahl»: Kennung eintragen oder mit F4 suchen.", "Enter oder «Stammdaten». Ändern, Sichern."], "f": ["Fiori Launchpad öffnen, oben auf die Lupe (Suche) klicken, «Statistische Kennzahlen verwalten» eintippen und die Kachel anklicken (S. 126).", "Kennzahl suchen, Pfeil (Details) am Zeilenende. «Bearbeiten», ändern, Sichern."], "tip": ""}, "en": {"t": "Change statistical key figure", "z": "Change an existing key figure.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nKK02» and press Enter. Alternatively in the SAP menu: Accounting → Controlling → Cost Center Accounting → Master Data → Statistical Key Figures → Individual Processing → Change (menu names translated by me; the course system was German).", "Field «Stat. Key Figure»: enter the ID or search with F4.", "Enter or «Master Data». Change, Save."], "f": ["Open the Fiori Launchpad, click the magnifier (search) at the top, type «Manage Statistical Key Figures» (in a German system: «Statistische Kennzahlen verwalten») and click the tile (p. 126).", "Search the key figure, arrow (details) at the end of the row. «Edit», change, Save."], "tip": ""}}, {"c": "KK03", "b": "Stammdaten", "s": "S. 122–123", "auf": [], "de": {"t": "Statistische Kennzahl anzeigen", "z": "Bestehende Kennzahl anzeigen.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nKK03» eintippen und Enter drücken. Alternativ im SAP-Menü: Rechnungswesen → Controlling → Kostenstellenrechnung → Stammdaten → Statistische Kennzahlen → Einzelbearbeitung → Anzeigen.", "Feld «Statist. Kennzahl»: Kennung eintragen oder mit F4 suchen.", "Enter oder «Stammdaten»."], "f": ["Fiori Launchpad öffnen, oben auf die Lupe (Suche) klicken, «Statistische Kennzahlen verwalten» eintippen und die Kachel anklicken (S. 126).", "Kennzahl suchen, Pfeil (Details) am Zeilenende."], "tip": ""}, "en": {"t": "Display statistical key figure", "z": "Display an existing key figure.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nKK03» and press Enter. Alternatively in the SAP menu: Accounting → Controlling → Cost Center Accounting → Master Data → Statistical Key Figures → Individual Processing → Display (menu names translated by me; the course system was German).", "Field «Stat. Key Figure»: enter the ID or search with F4.", "Enter or «Master Data»."], "f": ["Open the Fiori Launchpad, click the magnifier (search) at the top, type «Manage Statistical Key Figures» (in a German system: «Statistische Kennzahlen verwalten») and click the tile (p. 126).", "Search the key figure, arrow (details) at the end of the row."], "tip": ""}}, {"c": "BP", "b": "Stammdaten", "s": "S. 140–155; Fiori S. 156–166", "auf": [8, 10], "de": {"t": "Geschäftspartner (Lieferant) anlegen und bearbeiten", "z": "In S/4HANA wird jeder Lieferant als Geschäftspartner angelegt. BP ist dafür Pflicht.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nBP» eintippen und Enter drücken. Alternativ im SAP-Menü: Logistik → Materialwirtschaft → Einkauf → Stammdaten → Lieferant → Zentral → Anlegen (führt zu BP; besser direkt über das Kommandofeld).", "Knopf «Organisation» (für eine Firma) klicken. Personen und Gruppen haben eigene Knöpfe.", "Feld «Anlegen in GP-Rolle»: ZVEND Kreditor/Lieferant zentral. Feld «Gruppierung»: BPCH Interne Nummernvergabe CH. Rollenwechsel mit «Anlegen» bestätigen.", "Bild «Anschrift»: Name, Strasse, PLZ, Ort, Land, Sprache.", "Knopf «Buchungskreis»: Buchungskreis B200 → Bild «Lieferant: Kontoführung»: Abstimmkonto (Pflicht, z. B. 20000); Zahlungsverkehr: Zahlungsbedingung.", "Knopf «Einkaufsorganisation»: E200 → Register «Einkaufsdaten»: Bestellwährung (Pflicht), Zahlungsbedingung.", "Sichern. Merke dir die Lieferantennummer (nicht die GP-Nummer)."], "f": ["Fiori Launchpad öffnen, oben auf die Lupe (Suche) klicken, «Lieferantenstammdaten verwalten» eintippen und die Kachel anklicken (S. 156).", "Knopf «Anlegen», Kategorie Organisation.", "Name, Adresse, Sprache; Organisationsdaten: Einkaufsorganisation, Auftragswährung, Buchungskreis, Abstimmkonto.", "Im Stammsatz Register «Rollen»: die Einzelrollen FI-Kreditor (FLVN00) und Lieferant (FLVN01) zuordnen (ZVEND gibt es in Fiori nicht, S. 165).", "Sichern."], "tip": "FLVN00 FI-Kreditor = Buchungskreis, Pflicht Abstimmkonto, nötig für die Rechnung. FLVN01 Lieferant = Einkaufsorganisation, Pflicht Bestellwährung, nötig für die Bestellung (Trainer 20.11.)."}, "en": {"t": "Create and edit business partner (supplier)", "z": "In S/4HANA every supplier is created as a business partner. BP is mandatory for this.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nBP» and press Enter. Alternatively in the SAP menu: Logistics → Materials Management → Purchasing → Master Data → Supplier → Central → Create (redirects to BP; better use the command field) (menu names translated by me; the course system was German).", "Click the «Organization» button (for a company). Persons and groups have their own buttons.", "Field «Create in BP role»: ZVEND supplier central. Field «Grouping»: BPCH internal numbering CH. Confirm the role change with «Create».", "Screen «Address»: name, street, postcode, city, country, language.", "Button «Company Code»: B200 → screen «Vendor: Account Management»: reconciliation account (mandatory, e.g. 20000); payment transactions: terms of payment.", "Button «Purchasing Organization»: E200 → tab «Purchasing Data»: order currency (mandatory), terms of payment.", "Save. Note the supplier number (not the BP number)."], "f": ["Open the Fiori Launchpad, click the magnifier (search) at the top, type «Manage Supplier Master Data» (in a German system: «Lieferantenstammdaten verwalten») and click the tile (p. 156; name per F2121).", "Button «Create», category Organization.", "Name, address, language; organisational data: purchasing org., order currency, company code, reconciliation account.", "In the record, tab «Roles»: assign the single roles FI vendor (FLVN00) and supplier (FLVN01) (ZVEND is not available in Fiori, p. 165).", "Save."], "tip": "FLVN00 FI vendor = company code, mandatory reconciliation account, needed for the invoice. FLVN01 supplier = purchasing org., mandatory order currency, needed for the purchase order (trainer, 20 Nov)."}}, {"c": "XK01", "b": "Stammdaten", "s": "S. 144", "auf": [], "de": {"t": "Lieferant anlegen (alte Transaktion)", "z": "Alte Transaktion aus ECC (Vorgänger von S/4HANA). Sie leitet automatisch zu BP um.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nXK01» eintippen und Enter drücken. Alternativ im SAP-Menü: Logistik → Materialwirtschaft → Einkauf → Stammdaten → Lieferant → Zentral → Anlegen.", "SAP meldet «Umleitung zur Transaktion BP» und fragt sofort den GP-Typ ab (Person, Organisation, Gruppe).", "Weiter wie bei BP."], "f": ["Siehe BP: App «Lieferantenstammdaten verwalten»."], "tip": "Gleich mit XK02/XK03 (ändern/anzeigen): alle leiten zu BP um (S. 153)."}, "en": {"t": "Create supplier (old transaction)", "z": "Old ECC transaction (predecessor of S/4HANA). It redirects to BP automatically.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nXK01» and press Enter. Alternatively in the SAP menu: Logistics → Materials Management → Purchasing → Master Data → Supplier → Central → Create (menu names translated by me; the course system was German).", "SAP reports «redirect to transaction BP» and immediately asks for the BP type (person, organization, group).", "Continue as in BP."], "f": ["See BP: app «Manage Supplier Master Data»."], "tip": "The same applies to XK02/XK03 (change/display): all redirect to BP (p. 153)."}}, {"c": "FB50", "b": "Buchen", "s": "S. 174–181; Fiori S. 181–186", "auf": [7], "de": {"t": "Sachkontenbeleg erfassen (Hauptbuchbuchung)", "z": "Eine Buchung direkt im Hauptbuch, z. B. Aufwand bar aus der Kasse. Gebucht werden kann erst, wenn Soll gleich Haben ist.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nFB50» eintippen und Enter drücken. Alternativ im SAP-Menü: Rechnungswesen → Finanzwesen → Hauptbuch → Buchung → Sachkontenbeleg erfassen.", "Beim ersten Aufruf den Buchungskreis (B200) eingeben.", "Register «Grunddaten»: Belegdatum (Datum der Rechnung, Pflicht). Buchungsdatum NICHT ändern, SAP schlägt heute vor (Testfrage 1). Optional Belegkopftext.", "Register «Detail»: Häkchen «Steuer rechnen», wenn du brutto erfasst.", "Zeile 1 (Aufwand): Sachkonto, S (Soll), Betrag brutto, Steuerkennzeichen (z. B. V1 = 8,1 %), Kostenstelle.", "Zeile 2 (Gegenkonto, z. B. Kasse): Sachkonto, H (Haben), gleicher Betrag, kein Steuerkennzeichen, keine Kostenstelle.", "Ampel prüfen: grün = Saldo null. Dann «Buchen». SAP zeigt die Belegnummer."], "f": ["Fiori Launchpad öffnen, oben auf die Lupe (Suche) klicken, «Hauptbuchbelege buchen» eintippen und die Kachel anklicken (S. 181).", "Kopfdaten: Buchungskreis, Belegdatum, Buchungsdatum (vorbelegt), Belegart.", "Positionen wie im GUI: Sachkonto, Soll/Haben, Betrag, Steuerkennzeichen, Kostenstelle.", "Saldo 0.00 → «Buchen»."], "tip": "Mit der Buchung entsteht zusätzlich ein CO-Beleg (Controlling), aber nur für die Aufwandszeile. Steuerkennzeichen vergessen = ganze Prüfungsfrage falsch."}, "en": {"t": "Enter G/L account document", "z": "A posting directly in the general ledger, e.g. an expense paid in cash. It can only be posted when debit equals credit.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nFB50» and press Enter. Alternatively in the SAP menu: Accounting → Financial Accounting → General Ledger → Posting → Enter G/L Account Document (menu names translated by me; the course system was German).", "On first use enter the company code (B200).", "Tab «Basic Data»: document date (invoice date, mandatory). Do NOT change the posting date, SAP proposes today (test question 1). Header text optional.", "Tab «Details»: tick «Calculate tax» if you enter gross amounts.", "Line 1 (expense): G/L account, D (debit), gross amount, tax code (e.g. V1 = 8.1 %), cost center.", "Line 2 (offset, e.g. cash): G/L account, C (credit), same amount, no tax code, no cost center.", "Check the traffic light: green = balance zero. Then «Post». SAP shows the document number."], "f": ["Open the Fiori Launchpad, click the magnifier (search) at the top, type «Post General Journal Entries» (in a German system: «Hauptbuchbelege buchen») and click the tile (p. 181; name per F2121).", "Header: company code, document date, posting date (pre-filled), document type.", "Lines as in GUI: G/L account, debit/credit, amount, tax code, cost center.", "Balance 0.00 → «Post»."], "tip": "Posting also creates a CO (Controlling) document, but only for the expense line. Forgetting the tax code = the whole exam question is wrong."}}, {"c": "FB60", "b": "Buchen", "s": "S. 187–195", "auf": [8, 11], "de": {"t": "Eingangsrechnung ohne Bestellung erfassen", "z": "Eine Lieferantenrechnung direkt in der Buchhaltung buchen, ohne Bestellung davor.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nFB60» eintippen und Enter drücken. Alternativ im SAP-Menü: Rechnungswesen → Finanzwesen → Kreditoren → Buchung → Rechnung.", "Beim ersten Aufruf Buchungskreis B200 eingeben, «Weiter».", "Register «Grunddaten»: Kreditor (Lieferantennummer), Rechnungsdatum, Referenz (Rechnungsnummer), Betrag brutto, Häkchen «Steuer rechnen», Steuerkennzeichen.", "Unten Positionszeile (Aufwand): Sachkonto, Betrag, Steuerkennzeichen, Kostenstelle.", "Ampel grün (Saldo null) → «Buchen»."], "f": ["Keine eigene Fiori-App (Stand Juli 2024, S. 195). Die Kachel «Eingangsrechnungen anlegen» öffnet die GUI-Transaktion FB60 im Browser; die Schritte sind dieselben."], "tip": "Neben dem Feld Kreditor gibt es ein Symbol zu den offenen Posten (FBL1N)."}, "en": {"t": "Enter incoming invoice without purchase order", "z": "Post a supplier invoice directly in accounting, without a purchase order before it.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nFB60» and press Enter. Alternatively in the SAP menu: Accounting → Financial Accounting → Accounts Payable → Document Entry → Invoice (menu names translated by me; the course system was German).", "On first use enter company code B200, «Continue».", "Tab «Basic Data»: vendor (supplier number), invoice date, reference (invoice number), gross amount, tick «Calculate tax», tax code.", "Item line below (expense): G/L account, amount, tax code, cost center.", "Green light (balance zero) → «Post»."], "f": ["No separate Fiori app (as of July 2024, p. 195). The tile «Create Incoming Invoices» (my translation) opens GUI transaction FB60 in the browser; the steps are the same."], "tip": "Next to the vendor field there is an icon for the open items (FBL1N)."}}, {"c": "FB00", "b": "Buchen", "s": "S. 180", "auf": [], "de": {"t": "Bearbeitungsoptionen Finanzbuchhaltung", "z": "Persönliche Voreinstellungen für das Erfassen von Belegen (z. B. Erfassungsvariante).", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nFB00» eintippen und Enter drücken. Alternativ im SAP-Menü: Aus FB50/FB60 über den Knopf «Bearbeitungsoptionen».", "Häkchen und Vorschläge nach Bedarf setzen (z. B. «Belege nur vollständig vorerfassbar», «Buchungskreisvorschlag unterdrücken»).", "Sichern."], "f": ["Das Skript beschreibt dafür keine Fiori-App. Im Kurs und in der Prüfung gilt der Weg im SAP GUI."], "tip": ""}, "en": {"t": "Accounting editing options", "z": "Personal defaults for entering documents (e.g. entry variant).", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nFB00» and press Enter. Alternatively in the SAP menu: From FB50/FB60 via the button «Editing Options» (menu names translated by me; the course system was German).", "Set ticks and proposals as needed (e.g. «Documents can only be parked completely», «Suppress company code proposal»).", "Save."], "f": ["The course script describes no Fiori app for this. In the course and the exam the SAP GUI path applies."], "tip": ""}}, {"c": "FB01L", "b": "Buchen", "s": "Trainer 20.11. (nicht im Skript)", "auf": [], "de": {"t": "Buchung in eine bestimmte Ledger-Gruppe", "z": "Bucht nur in eine Ledger-Gruppe (z. B. nur das lokale Ledger) statt in alle. Vom Trainer erwähnt, im Skript nicht beschrieben.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nFB01L» eintippen und Enter drücken.", "Die einzelnen Felder beschreibt weder das Skript noch der Trainer; ich führe sie deshalb nicht auf.", "Merke für Richtig/Falsch-Fragen: Controlling hängt an genau einem Ledger, meist 0L."], "f": ["Das Skript beschreibt dafür keine Fiori-App. Im Kurs und in der Prüfung gilt der Weg im SAP GUI."], "tip": ""}, "en": {"t": "Posting to a specific ledger group", "z": "Posts only to one ledger group (e.g. only the local ledger) instead of all. Mentioned by the trainer, not described in the script.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nFB01L» and press Enter.", "Neither the script nor the trainer describes the fields, so I do not list them.", "Remember for true/false questions: Controlling is linked to exactly one ledger, usually 0L."], "f": ["The course script describes no Fiori app for this. In the course and the exam the SAP GUI path applies."], "tip": ""}}, {"c": "ME21N", "b": "Buchen", "s": "S. 209–216; Fiori S. 222–229", "auf": [13], "de": {"t": "Bestellung anlegen", "z": "Du bestellst etwas beim Lieferanten. Bei einer kontierten Bestellung (z. B. auf eine Kostenstelle) entsteht sofort ein Obligo (bereits verplante Kosten).", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nME21N» eintippen und Enter drücken. Alternativ im SAP-Menü: Logistik → Materialwirtschaft → Einkauf → Bestellung → Anlegen → Lieferant/Lieferwerk bekannt.", "Oben Bestellart «NB Normalbestellung», Lieferant eintragen.", "Kopfdaten (Register Org.-Daten): Einkaufsorganisation, Einkäufergruppe, Buchungskreis (kommen oft aus den Benutzervorgaben).", "Positionsübersicht je Zeile: Kontierungstyp K (Kostenstelle), Kurztext (ohne Materialnummer), Bestellmenge, Bestellmengeneinheit, Lieferdatum, Nettopreis, Warengruppe, Werk.", "Positionsdetail Register «Kontierung»: Sachkonto und Kostenstelle. Register «Rechnung»: Steuerkennzeichen.", "Prüfen, dann Sichern. SAP zeigt die Bestellnummer."], "f": ["Fiori Launchpad öffnen, oben auf die Lupe (Suche) klicken, «Bestellungen verwalten» eintippen und die Kachel anklicken (S. 222).", "Knopf «Anlegen». Allgemeine Informationen: Lieferant, Einkaufsorganisation, Einkäufergruppe, Buchungskreis.", "Positionen → «Anlegen»: wie im GUI (Kontierungstyp K, Kurztext, Menge, Preis, Warengruppe, Werk, Lieferdatum).", "Positionsdetails: Kontierung (Sachkonto, Kostenstelle), Steuerkennzeichen.", "«Bestellen». Das Obligo siehst du mit dem Knopf «Obligos anzeigen» (S. 226)."], "tip": "Testfrage 7: Bestellnummer, Positionsnummer und Material leer lassen; Text in den Kurztext. Lieferdatum = heute + 7 Kalendertage selbst rechnen."}, "en": {"t": "Create purchase order", "z": "You order something from a supplier. An account-assigned order (e.g. to a cost center) immediately creates a commitment (costs already planned).", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nME21N» and press Enter. Alternatively in the SAP menu: Logistics → Materials Management → Purchasing → Purchase Order → Create → Vendor/Supplying Plant Known (menu names translated by me; the course system was German).", "At the top order type «NB Standard PO», enter the supplier.", "Header (tab Org. Data): purchasing org., purchasing group, company code (often from user defaults).", "Item overview per row: account assignment category K (cost center), short text (no material number), order quantity, order unit, delivery date, net price, material group, plant.", "Item detail tab «Account Assignment»: G/L account and cost center. Tab «Invoice»: tax code.", "Check, then Save. SAP shows the purchase order number."], "f": ["Open the Fiori Launchpad, click the magnifier (search) at the top, type «Manage Purchase Orders» (in a German system: «Bestellungen verwalten») and click the tile (p. 222; name per F2121).", "Button «Create». General information: supplier, purchasing org., purchasing group, company code.", "Items → «Create»: as in GUI (account assignment K, short text, quantity, price, material group, plant, delivery date).", "Item details: account assignment (G/L account, cost center), tax code.", "«Order». The commitment is shown with the button «Display Commitments» (my translation; p. 226)."], "tip": "Test question 7: leave PO number, item number and material empty; text goes into the short text. Delivery date = today + 7 calendar days, calculate it yourself."}}, {"c": "ME22N", "b": "Buchen", "s": "S. 217", "auf": [], "de": {"t": "Bestellung ändern", "z": "Daten einer bestehenden Bestellung ändern.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nME22N» eintippen und Enter drücken. Alternativ im SAP-Menü: Logistik → Materialwirtschaft → Einkauf → Bestellung → Ändern.", "Ist eine andere Bestellung offen: Knopf «Andere Bestellung» und Nummer eingeben.", "Felder ändern wie bei ME21N.", "Sichern."], "f": ["Fiori Launchpad öffnen, oben auf die Lupe (Suche) klicken, «Bestellungen verwalten» eintippen und die Kachel anklicken (S. 222).", "Bestellung suchen, öffnen, «Bearbeiten», ändern, Sichern."], "tip": ""}, "en": {"t": "Change purchase order", "z": "Change data of an existing purchase order.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nME22N» and press Enter. Alternatively in the SAP menu: Logistics → Materials Management → Purchasing → Purchase Order → Change (menu names translated by me; the course system was German).", "If another PO is open: button «Other Purchase Order» and enter the number.", "Change fields as in ME21N.", "Save."], "f": ["Open the Fiori Launchpad, click the magnifier (search) at the top, type «Manage Purchase Orders» (in a German system: «Bestellungen verwalten») and click the tile (p. 222).", "Search the PO, open it, «Edit», change, Save."], "tip": ""}}, {"c": "ME23N", "b": "Buchen", "s": "S. 218–219", "auf": [13], "de": {"t": "Bestellung anzeigen und Obligo prüfen", "z": "Bestellung ansehen, Bestellhistorie und Obligo prüfen.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nME23N» eintippen und Enter drücken. Alternativ im SAP-Menü: Logistik → Materialwirtschaft → Einkauf → Bestellung → Anzeigen.", "Knopf «Andere Bestellung», Nummer eingeben.", "Position markieren. Obligo: Umfeld → Belegposition → RW-Obligobelege (Rechnungswesen).", "Register «Bestellhistorie» (erscheint erst nach Wareneingang oder Rechnung): Folgebelege."], "f": ["Fiori Launchpad öffnen, oben auf die Lupe (Suche) klicken, «Bestellungen verwalten» eintippen und die Kachel anklicken (S. 222).", "Bestellung öffnen; Knopf «Obligos anzeigen» (S. 226)."], "tip": "Bewerteter Wareneingang löst das Obligo auf. Bei «WE unbewertet» passiert das erst mit der Rechnung (S. 219)."}, "en": {"t": "Display purchase order and check commitment", "z": "View a PO, its history and commitment.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nME23N» and press Enter. Alternatively in the SAP menu: Logistics → Materials Management → Purchasing → Purchase Order → Display (menu names translated by me; the course system was German).", "Button «Other Purchase Order», enter the number.", "Select the item. Commitment: Environment → Item → Commitment documents (accounting).", "Tab «Purchase Order History» (appears only after goods receipt or invoice): follow-on documents."], "f": ["Open the Fiori Launchpad, click the magnifier (search) at the top, type «Manage Purchase Orders» (in a German system: «Bestellungen verwalten») and click the tile (p. 222).", "Open the PO; button «Display Commitments» (my translation; p. 226)."], "tip": "A valuated goods receipt reduces the commitment. With «GR non-valuated» this only happens with the invoice (p. 219)."}}, {"c": "MIGO", "b": "Buchen", "s": "S. 232–241; Fiori S. 237", "auf": [14], "de": {"t": "Wareneingang zur Bestellung buchen", "z": "Du bestätigst, dass die bestellte Ware angekommen ist. Bei einer kontierten Bestellung bucht SAP den Aufwand gegen das WE/RE-Verrechnungskonto.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nMIGO» eintippen und Enter drücken. Alternativ im SAP-Menü: Logistik → Materialwirtschaft → Bestandsführung → Warenbewegung → Warenbewegung.", "Oben links: Aktion «Wareneingang», Referenz «Bestellung», Bestellnummer eintippen, Enter.", "Belegdatum und Buchungsdatum prüfen.", "Je Position: Menge prüfen und das Häkchen «Position OK» setzen (nur markierte Positionen werden gebucht).", "«Prüfen», dann «Buchen». SAP zeigt die Materialbelegnummer."], "f": ["Fiori Launchpad öffnen, oben auf die Lupe (Suche) klicken, «Wareneingang zu Einkaufsbeleg buchen» eintippen und die Kachel anklicken (S. 237).", "Bestellnummer (Einkaufsbeleg) eingeben.", "Positionen und Mengen prüfen, Buchen."], "tip": "Den Materialbeleg zeigst du ebenfalls in MIGO an (Aktion «Anzeigen», S. 239). Für den Wareneingang braucht der Lieferant keine Buchungskreisdaten (Trainer 20.11.)."}, "en": {"t": "Post goods receipt for purchase order", "z": "You confirm that the ordered goods arrived. For an account-assigned PO SAP posts the expense against the GR/IR clearing account.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nMIGO» and press Enter. Alternatively in the SAP menu: Logistics → Materials Management → Inventory Management → Goods Movement → Goods Movement (menu names translated by me; the course system was German).", "Top left: action «Goods Receipt», reference «Purchase Order», enter the PO number, Enter.", "Check document date and posting date.", "Per item: check the quantity and tick «Item OK» (only ticked items are posted).", "«Check», then «Post». SAP shows the material document number."], "f": ["Open the Fiori Launchpad, click the magnifier (search) at the top, type «Post Goods Receipt for Purchasing Document» (in a German system: «Wareneingang zu Einkaufsbeleg buchen») and click the tile (p. 237; name per F2121).", "Enter the purchase order (purchasing document).", "Check items and quantities, Post."], "tip": "You also display the material document in MIGO (action «Display», p. 239). For the goods receipt the supplier needs no company-code data (trainer, 20 Nov)."}}, {"c": "MIRO", "b": "Buchen", "s": "S. 242–256; Fiori S. 248", "auf": [15], "de": {"t": "Eingangsrechnung zur Bestellung erfassen", "z": "Die Lieferantenrechnung zu einer Bestellung buchen. SAP holt Mengen und Preise aus der Bestellung.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nMIRO» eintippen und Enter drücken. Alternativ im SAP-Menü: Logistik → Materialwirtschaft → Logistik-Rechnungsprüfung → Belegerfassung → Eingangsrechnung hinzufügen.", "Beim ersten Aufruf Buchungskreis B200.", "Register «Grunddaten»: Rechnungsdatum, Referenz (Rechnungsnummer), Betrag brutto, Häkchen «Steuer rechnen», Steuerkennzeichen.", "Feld Bestellbezug: Bestellnummer eintragen, Enter. Die Positionen erscheinen.", "Ampel bzw. Saldo prüfen: Saldo null → «Buchen»."], "f": ["Fiori Launchpad öffnen, oben auf die Lupe (Suche) klicken, «Lieferantenrechnung anlegen» eintippen und die Kachel anklicken (S. 248).", "Allgemeine Informationen: Vorgang Rechnung, Buchungskreis, Rechnungssteller, Rechnungsdatum, Bruttobetrag, Referenz.", "Register «Einkaufsbelegreferenzen»: Bestellung suchen und übernehmen.", "Steuer prüfen, Saldo 0 → Buchen."], "tip": "Weichen Bestell- bzw. WE-Menge und Rechnungsmenge ab, wird die Rechnung gesperrt (Trainer 20.11.). Rechnungsbeleg anzeigen: ebenfalls über MIRO-Menü (S. 253)."}, "en": {"t": "Enter incoming invoice for purchase order", "z": "Post the supplier invoice for a purchase order. SAP takes quantities and prices from the PO.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nMIRO» and press Enter. Alternatively in the SAP menu: Logistics → Materials Management → Logistics Invoice Verification → Document Entry → Enter Invoice (menu names translated by me; the course system was German).", "On first use company code B200.", "Tab «Basic Data»: invoice date, reference (invoice number), gross amount, tick «Calculate tax», tax code.", "PO reference field: enter the PO number, Enter. The items appear.", "Check the balance: zero → «Post»."], "f": ["Open the Fiori Launchpad, click the magnifier (search) at the top, type «Create Supplier Invoice» (in a German system: «Lieferantenrechnung anlegen») and click the tile (p. 248; my translation).", "General information: transaction invoice, company code, invoicing party, invoice date, gross amount, reference.", "Tab «Purchasing Document References»: search and add the PO.", "Check tax, balance 0 → Post."], "tip": "If PO/GR quantity and invoice quantity differ, the invoice is blocked (trainer, 20 Nov). Display the invoice document also via the MIRO menu (p. 253)."}}, {"c": "KB11N", "b": "Buchen", "s": "S. 258–263", "auf": [16], "de": {"t": "Manuelle Umbuchung von Kosten (ohne Belegbezug)", "z": "Kosten von einer Kostenstelle auf andere verschieben, ohne Bezug zum ursprünglichen Buchhaltungsbeleg. Die Kostenart bleibt die primäre.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nKB11N» eintippen und Enter drücken. Alternativ im SAP-Menü: Rechnungswesen → Controlling → Kostenstellenrechnung → Istbuchung → Manuelle Umbuchung Kosten → Erfassen.", "Kopf: Belegdatum, Buchungsdatum (vorbelegt), Erfassungsvariante «01SAP Kostenstelle», Eingabetyp Liste oder Einzel.", "Je Zeile: Kostenstelle alt (Sender), Kostenart, Betrag, Kostenstelle neu (Empfänger).", "Buchen."], "f": ["Das Skript beschreibt keine Fiori-App. Im Übungsheft F2121 (Übung 15) gibt es «Kosten und Erlöse neu zuordnen» (Reassign Costs and Revenues); das ist meine Zuordnung."], "tip": "KB11N erzeugt einen Buchhaltungsbeleg mit Belegart CO, nur in einem Ledger. SAP prüft nicht, ob der Sender genug Kosten hat; ein Minus-Saldo ist möglich (Trainer 20.11.). Testfrage 4: 200 zu gleichen Teilen = zwei Zeilen à 100."}, "en": {"t": "Manual reposting of costs (no document reference)", "z": "Move costs from one cost center to others without reference to the original accounting document. The primary cost element stays.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nKB11N» and press Enter. Alternatively in the SAP menu: Accounting → Controlling → Cost Center Accounting → Actual Postings → Manual Reposting of Costs → Enter (menu names translated by me; the course system was German).", "Header: document date, posting date (pre-filled), entry variant «01SAP Cost Center», input type list or single.", "Per line: old cost center (sender), cost element, amount, new cost center (receiver).", "Post."], "f": ["The script describes no Fiori app. Exercise book F2121 (exercise 15) uses «Reassign Costs and Revenues»; that is my mapping."], "tip": "KB11N creates an accounting document with document type CO, in one ledger only. SAP does not check whether the sender has enough costs; a negative balance is possible (trainer, 20 Nov). Test question 4: 200 in equal parts = two lines of 100."}}, {"c": "KB61", "b": "Buchen", "s": "S. 264–267", "auf": [12], "de": {"t": "Einzelpostenumbuchung (mit Belegbezug)", "z": "Eine bestimmte Buchung (Einzelposten) auf eine andere Kostenstelle umbuchen, mit Bezug zum Ursprungsbeleg.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nKB61» eintippen und Enter drücken. Alternativ im SAP-Menü: Rechnungswesen → Controlling → Kostenstellenrechnung → Istbuchung → Umbuchung Einzelposten → Erfassen.", "Feld «Belegnummer»: die FI-Belegnummer (Buchhaltungsbeleg) und das Geschäftsjahr eingeben, nicht die CO-Nummer.", "Ausführen: die Positionen des Belegs erscheinen.", "In der Position die neue Kostenstelle eintragen (Spalte neu).", "Buchen."], "f": ["Das Skript beschreibt keine Fiori-App (siehe KB11N: «Kosten und Erlöse neu zuordnen», meine Zuordnung)."], "tip": "Ein Beleg lässt sich nur einmal umbuchen; nochmal geht nur nach Storno (Trainer 20.11.). SAP prüft beim Sender (Senderverprobung)."}, "en": {"t": "Line item reposting (with document reference)", "z": "Repost a specific posting (line item) to another cost center, with reference to the original document.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nKB61» and press Enter. Alternatively in the SAP menu: Accounting → Controlling → Cost Center Accounting → Actual Postings → Repost Line Items → Enter (menu names translated by me; the course system was German).", "Field «Document number»: enter the FI (accounting) document number and fiscal year, not the CO number.", "Execute: the document's items appear.", "Enter the new cost center in the item (new column).", "Post."], "f": ["The script describes no Fiori app (see KB11N: «Reassign Costs and Revenues», my mapping)."], "tip": "A document can only be reposted once; again only after reversal (trainer, 20 Nov). SAP checks the sender."}}, {"c": "KB15N", "b": "Buchen", "s": "S. 268–271", "auf": [], "de": {"t": "Manuelle Kostenverrechnung", "z": "Primär- oder Sekundärkosten manuell von einer Kostenstelle auf eine andere verrechnen (S. 268). Auf dem Sender entsteht ein Entlastungssatz.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nKB15N» eintippen und Enter drücken. Alternativ im SAP-Menü: Rechnungswesen → Controlling → Kostenstellenrechnung → Istbuchung → Manuelle Kostenverrechnung → Erfassen.", "Kopf: Belegdatum, Buchungsdatum, Erfassungsvariante «01SAP Kostenstelle», Eingabetyp Einzel- oder Listerfassung.", "Je Position: Sender-Kostenstelle, Kostenart, Betrag (Währung vorbelegt), Empfänger-Kostenstelle; bei Einzelerfassung mit «Übernehmen».", "Buchen."], "f": ["Das Skript beschreibt dafür keine Fiori-App. Im Kurs und in der Prüfung gilt der Weg im SAP GUI."], "tip": "Unterschied: KB15N entlastet ohne Senderverprobung und schreibt einen Entlastungssatz; vom Einzelposten kommst du nicht zum FI-Beleg zurück (S. 271)."}, "en": {"t": "Manual cost allocation", "z": "Manually allocate primary or secondary costs from one cost center to another (p. 268). A credit line appears on the sender.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nKB15N» and press Enter. Alternatively in the SAP menu: Accounting → Controlling → Cost Center Accounting → Actual Postings → Manual Cost Allocation → Enter (menu names translated by me; the course system was German).", "Header: document date, posting date, entry variant «01SAP Cost Center», input type single or list entry.", "Per item: sender cost center, cost element, amount (currency pre-filled), receiver cost center; with single entry press «Adopt».", "Post."], "f": ["The course script describes no Fiori app for this. In the course and the exam the SAP GUI path applies."], "tip": "Difference: KB15N credits the sender without sender check and writes a credit line; from the line item you cannot go back to the FI document (p. 271)."}}, {"c": "KB31N", "b": "Buchen", "s": "S. 131–135; Fiori S. 135–139", "auf": [17, 18], "de": {"t": "Werte statistischer Kennzahlen erfassen", "z": "Du buchst z. B. die gefahrenen Kilometer oder Quadratmeter je Kostenstelle.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nKB31N» eintippen und Enter drücken. Alternativ im SAP-Menü: Rechnungswesen → Controlling → Kostenstellenrechnung → Istbuchungen → Statistische Kennzahlen → Erfassen.", "Kopf: Belegdatum, Buchungsdatum (bestimmt die Periode), Erfassungsvariante «01SAP Kostenstelle», Eingabetyp L Listerfassung.", "Je Zeile: Empfänger-Kostenstelle, Statistische Kennzahl, Menge. Kennzahltyp und Einheit kommen aus dem Stammsatz.", "Tipp: gleichen Wert in alle Zeilen mit «Spalte vorbelegen».", "Buchen."], "f": ["Fiori Launchpad öffnen, oben auf die Lupe (Suche) klicken, «Statistische Kennzahlwerte verwalten» eintippen und die Kachel anklicken (S. 135).", "Knopf «Anlegen». Kopfzeileninformationen: Belegdatum, Buchungsdatum, Belegkopftext.", "Kennzahlwerte: «Mehr je Zeile anzeigen», dann je Zeile Empfängerkostenstelle, Kennzahl, Menge; weitere Zeilen mit «Hinzufügen».", "Buchen."], "tip": "Festwerte werden in die Folgeperioden übertragen, Summenwerte nicht."}, "en": {"t": "Enter statistical key figure values", "z": "You post e.g. kilometres driven or square metres per cost center.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nKB31N» and press Enter. Alternatively in the SAP menu: Accounting → Controlling → Cost Center Accounting → Actual Postings → Statistical Key Figures → Enter (menu names translated by me; the course system was German).", "Header: document date, posting date (determines the period), entry variant «01SAP Cost Center», input type L list entry.", "Per row: receiver cost center, statistical key figure, quantity. Category and unit come from the master record.", "Tip: put the same value in every row with «Prefill column».", "Post."], "f": ["Open the Fiori Launchpad, click the magnifier (search) at the top, type «Manage Statistical Key Figure Values» (in a German system: «Statistische Kennzahlwerte verwalten») and click the tile (p. 135; name per F2121).", "Button «Create». Header: document date, posting date, header text.", "Key figure values: «Show more per row», then per row receiver cost center, key figure, quantity; more rows with «Add».", "Post."], "tip": "Fixed values are carried into later periods, totals values are not."}}, {"c": "KSW1", "b": "Periodenabschluss", "s": "S. 275–288", "auf": [19], "de": {"t": "Umbuchungszyklus anlegen (periodische Umbuchung)", "z": "Ein Zyklus ist ein Regelwerk für die monatliche Umbuchung: wer gibt ab (Sender), wer bekommt (Empfänger), nach welchem Schlüssel. Ein Zyklus hat ein oder mehrere Segmente.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nKSW1» eintippen und Enter drücken. Alternativ im SAP-Menü: Nicht im SAP-Menü; Kommandofeld oder aus KSW5 über Mehr → Zyklus → Anlegen.", "Zyklus (eindeutige Kennung) und Anfangsdatum eingeben, optional Vorlagezyklus. Enter.", "Kopfdaten: Text, Kennzeichen nach Vorgabe (S. 276).", "Knopf «Anhängen Segment». Register «Segmentkopf»: Segmentname, Text, Senderregel (z. B. Gebuchte Beträge, 100 %), Empfängerregel (z. B. Variable Anteile).", "Register «Sender/Empfänger»: Sender-Kostenstelle, Kostenart; Empfänger-Kostenstelle oder -Gruppe (Spalte Gruppe).", "Register «Empfängerbezugsbasis»: z. B. statistische Kennzahl (KM##).", "«Prüfen» (formale Prüfung), dann Sichern."], "f": ["Keine App: Zyklen für periodische Umbuchungen kann die App «Verrechnungen verwalten» nicht (S. 325). Nur im GUI."], "tip": "Testfrage 3: In der Prüfung ist oft nur der Reiter Sender/Empfänger eingabebereit (Sender, Kostenart, Empfängergruppe), die Bezugsbasis nicht."}, "en": {"t": "Create reposting cycle (periodic reposting)", "z": "A cycle is a rule set for the monthly reposting: who gives (sender), who receives (receiver), by which key. A cycle has one or more segments.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nKSW1» and press Enter. Alternatively in the SAP menu: Not in the SAP menu; command field or from KSW5 via More → Cycle → Create (menu names translated by me; the course system was German).", "Enter the cycle (unique ID) and start date, optional template cycle. Enter.", "Header data: text, indicators as specified (p. 276).", "Button «Attach Segment». Tab «Segment Header»: segment name, text, sender rule (e.g. posted amounts, 100 %), receiver rule (e.g. variable portions).", "Tab «Senders/Receivers»: sender cost center, cost element; receiver cost center or group (group column).", "Tab «Receiver Tracing Factor»: e.g. statistical key figure (KM##).", "«Check» (formal check), then Save."], "f": ["No app: the app «Manage Allocations» cannot handle periodic reposting cycles (p. 325). GUI only."], "tip": "Test question 3: in the exam often only the Senders/Receivers tab is editable (sender, cost element, receiver group), not the tracing factor."}}, {"c": "KSW2", "b": "Periodenabschluss", "s": "S. 275", "auf": [], "de": {"t": "Umbuchungszyklus ändern", "z": "Bestehenden Umbuchungszyklus ändern.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nKSW2» eintippen und Enter drücken. Alternativ im SAP-Menü: Nicht im SAP-Menü; Kommandofeld oder aus KSW5 über Mehr → Zyklus.", "Zyklus und Anfangsdatum eingeben, Enter.", "Segmente aufrufen wie bei KSW1. Ändern, Prüfen, Sichern."], "f": ["Keine App (S. 325), nur GUI."], "tip": ""}, "en": {"t": "Change reposting cycle", "z": "Change an existing reposting cycle.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nKSW2» and press Enter. Alternatively in the SAP menu: Not in the SAP menu; command field or from KSW5 via More → Cycle (menu names translated by me; the course system was German).", "Enter cycle and start date, Enter.", "Open the segments as in KSW1. Change, Check, Save."], "f": ["No app (p. 325), GUI only."], "tip": ""}}, {"c": "KSW3", "b": "Periodenabschluss", "s": "S. 275", "auf": [], "de": {"t": "Umbuchungszyklus anzeigen", "z": "Bestehenden Umbuchungszyklus anzeigen.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nKSW3» eintippen und Enter drücken. Alternativ im SAP-Menü: Nicht im SAP-Menü; Kommandofeld oder aus KSW5 über Mehr → Zyklus.", "Zyklus und Anfangsdatum eingeben, Enter.", "Segmente aufrufen wie bei KSW1."], "f": ["Keine App (S. 325), nur GUI."], "tip": ""}, "en": {"t": "Display reposting cycle", "z": "Display an existing reposting cycle.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nKSW3» and press Enter. Alternatively in the SAP menu: Not in the SAP menu; command field or from KSW5 via More → Cycle (menu names translated by me; the course system was German).", "Enter cycle and start date, Enter.", "Open the segments as in KSW1."], "f": ["No app (p. 325), GUI only."], "tip": ""}}, {"c": "KSW5", "b": "Periodenabschluss", "s": "S. 274, 288–292", "auf": [19], "de": {"t": "Periodische Umbuchung ausführen", "z": "Führt den Umbuchungszyklus für eine Periode aus. Die Kostenart bleibt die ursprüngliche; beim Sender gibt es keinen eigenen Entlastungssatz.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nKSW5» eintippen und Enter drücken. Alternativ im SAP-Menü: Rechnungswesen → Controlling → Kostenstellenrechnung → Periodenabschluss → Einzelfunktionen → Periodische Umbuchung.", "Periode (von/bis) und Geschäftsjahr eintragen.", "Zyklus und Anfangsdatum in die Tabelle eintragen.", "Häkchen «Testlauf» gesetzt lassen, Ausführen. Protokoll und Sender/Empfänger prüfen.", "Testlauf-Häkchen entfernen, nochmals Ausführen (Echtlauf)."], "f": ["Keine App (S. 325), nur GUI."], "tip": "Testfrage 9: «Bei der periodischen Umbuchung sieht man auf dem Sender einen Entlastungssatz» ist falsch. Einen Entlastungssatz gibt es nur bei der Verteilung."}, "en": {"t": "Execute periodic reposting", "z": "Runs the reposting cycle for a period. The original cost element stays; the sender gets no separate credit line.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nKSW5» and press Enter. Alternatively in the SAP menu: Accounting → Controlling → Cost Center Accounting → Period-End Closing → Single Functions → Periodic Reposting (menu names translated by me; the course system was German).", "Enter period (from/to) and fiscal year.", "Enter cycle and start date in the table.", "Leave «Test Run» ticked, execute. Check the log and senders/receivers.", "Remove the test-run tick, execute again (update run)."], "f": ["No app (p. 325), GUI only."], "tip": "Test question 9: «With periodic reposting a credit line is visible on the sender» is false. Only distribution has a credit line."}}, {"c": "KSV1", "b": "Periodenabschluss", "s": "S. 300–314; Fiori S. 325–337", "auf": [19], "de": {"t": "Verteilungszyklus anlegen", "z": "Wie KSW1, aber für die Verteilung: Der Sender wird mit eigener Entlastungszeile entlastet, die Kostenart bleibt die ursprüngliche.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nKSV1» eintippen und Enter drücken. Alternativ im SAP-Menü: Nicht im SAP-Menü; Kommandofeld oder aus KSV5 über Mehr → Zyklus → Anlegen.", "Zyklus und Anfangsdatum, Enter.", "Kopfdaten ausfüllen.", "«Anhängen Segment»: Segmentkopf mit Sender- und Empfängerregel.", "Register «Sender/Empfänger»: Sender-Kostenstelle, Kostenart, Empfänger (Kostenstelle oder Gruppe).", "Register «Empfängerbezugsbasis»: z. B. statistische Kennzahl.", "Prüfen, Sichern."], "f": ["Fiori Launchpad öffnen, oben auf die Lupe (Suche) klicken, «Verrechnungen verwalten» eintippen und die Kachel anklicken (S. 325).", "Anlegen: Verrechnungszyklus, Verrechnungskontext Kostenstellen, Verrechnungsart Verteilung, Kostenrechnungskreis, Ledger 0L, Buchungskreis, Gültig von, Ist.", "Segment anlegen: Register Regeln (Senderregel, Empfängerregel), Sender (Kostenstelle, Kostenart), Empfänger, Empfängerbasis (Kennzahl).", "Zyklus prüfen, Sichern."], "tip": ""}, "en": {"t": "Create distribution cycle", "z": "Like KSW1 but for distribution: the sender is credited with its own credit line; the original cost element stays.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nKSV1» and press Enter. Alternatively in the SAP menu: Not in the SAP menu; command field or from KSV5 via More → Cycle → Create (menu names translated by me; the course system was German).", "Cycle and start date, Enter.", "Fill in header data.", "«Attach Segment»: segment header with sender and receiver rule.", "Tab «Senders/Receivers»: sender cost center, cost element, receivers (cost center or group).", "Tab «Receiver Tracing Factor»: e.g. statistical key figure.", "Check, Save."], "f": ["Open the Fiori Launchpad, click the magnifier (search) at the top, type «Manage Allocations» (in a German system: «Verrechnungen verwalten») and click the tile (p. 325; name per F2121).", "Create: allocation cycle, allocation context cost centers, allocation type distribution, controlling area, ledger 0L, company code, valid from, actual.", "Create segment: tab Rules (sender rule, receiver rule), Senders (cost center, cost element), Receivers, Receiver Basis (key figure).", "Check the cycle, Save."], "tip": ""}}, {"c": "KSV2", "b": "Periodenabschluss", "s": "S. 301", "auf": [], "de": {"t": "Verteilungszyklus ändern", "z": "Bestehenden Verteilungszyklus ändern.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nKSV2» eintippen und Enter drücken. Alternativ im SAP-Menü: Nicht im SAP-Menü; Kommandofeld oder aus KSV5 über Mehr → Zyklus.", "Zyklus und Anfangsdatum eingeben, Enter.", "Segmente aufrufen wie bei KSV1. Ändern, Prüfen, Sichern."], "f": ["Fiori Launchpad öffnen, oben auf die Lupe (Suche) klicken, «Verrechnungen verwalten» eintippen und die Kachel anklicken (S. 325).", "Zyklus in der Liste suchen und öffnen. Bearbeiten, Sichern."], "tip": ""}, "en": {"t": "Change distribution cycle", "z": "Change an existing distribution cycle.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nKSV2» and press Enter. Alternatively in the SAP menu: Not in the SAP menu; command field or from KSV5 via More → Cycle (menu names translated by me; the course system was German).", "Enter cycle and start date, Enter.", "Open the segments as in KSV1. Change, Check, Save."], "f": ["Open the Fiori Launchpad, click the magnifier (search) at the top, type «Manage Allocations» (in a German system: «Verrechnungen verwalten») and click the tile (p. 325).", "Search the cycle in the list and open it. Edit, Save."], "tip": ""}}, {"c": "KSV3", "b": "Periodenabschluss", "s": "S. 301", "auf": [], "de": {"t": "Verteilungszyklus anzeigen", "z": "Bestehenden Verteilungszyklus anzeigen.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nKSV3» eintippen und Enter drücken. Alternativ im SAP-Menü: Nicht im SAP-Menü; Kommandofeld oder aus KSV5 über Mehr → Zyklus.", "Zyklus und Anfangsdatum eingeben, Enter.", "Segmente aufrufen wie bei KSV1."], "f": ["Fiori Launchpad öffnen, oben auf die Lupe (Suche) klicken, «Verrechnungen verwalten» eintippen und die Kachel anklicken (S. 325).", "Zyklus in der Liste suchen und öffnen."], "tip": ""}, "en": {"t": "Display distribution cycle", "z": "Display an existing distribution cycle.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nKSV3» and press Enter. Alternatively in the SAP menu: Not in the SAP menu; command field or from KSV5 via More → Cycle (menu names translated by me; the course system was German).", "Enter cycle and start date, Enter.", "Open the segments as in KSV1."], "f": ["Open the Fiori Launchpad, click the magnifier (search) at the top, type «Manage Allocations» (in a German system: «Verrechnungen verwalten») and click the tile (p. 325).", "Search the cycle in the list and open it."], "tip": ""}}, {"c": "KSV5", "b": "Periodenabschluss", "s": "S. 300, 314–318; Fiori S. 338–346", "auf": [19], "de": {"t": "Verteilung ausführen", "z": "Führt den Verteilungszyklus für eine Periode aus.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nKSV5» eintippen und Enter drücken. Alternativ im SAP-Menü: Rechnungswesen → Controlling → Kostenstellenrechnung → Periodenabschluss → Einzelfunktionen → Verrechnungen → Verteilung.", "Periode und Geschäftsjahr eintragen.", "Zyklus und Anfangsdatum in die Tabelle.", "Testlauf, Protokoll prüfen.", "Häkchen Testlauf weg, Echtlauf."], "f": ["Fiori Launchpad öffnen, oben auf die Lupe (Suche) klicken, «Verrechnungen ausführen» eintippen und die Kachel anklicken (S. 338).", "Zyklus mit «Hinzufügen» in die Übersicht holen.", "Testlauf, Ergebnis prüfen (Register Sender, Empfänger, Buchungsbelege, Nachrichten).", "Echtlauf."], "tip": "Danach im Bericht S_ALR_87013611 kontrollieren: Sender entlastet, Empfänger belastet."}, "en": {"t": "Execute distribution", "z": "Runs the distribution cycle for a period.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nKSV5» and press Enter. Alternatively in the SAP menu: Accounting → Controlling → Cost Center Accounting → Period-End Closing → Single Functions → Allocations → Distribution (menu names translated by me; the course system was German).", "Enter period and fiscal year.", "Cycle and start date in the table.", "Test run, check the log.", "Remove the test-run tick, update run."], "f": ["Open the Fiori Launchpad, click the magnifier (search) at the top, type «Run Allocations» (in a German system: «Verrechnungen ausführen») and click the tile (p. 338; name per F2121).", "Add the cycle to the overview with «Add».", "Test run, check the result (tabs senders, receivers, journal entries, messages).", "Update run."], "tip": "Then check report S_ALR_87013611: sender credited, receivers debited."}}, {"c": "KSU5", "b": "Periodenabschluss", "s": "Trainer 20.11. (Skript beschreibt die Umlage nicht)", "auf": [], "de": {"t": "Umlage ausführen", "z": "Verrechnet Kosten mit einer Sekundärkostenart (Umlagekostenart). Umbuchung und Verteilung behalten die Primärkostenart.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nKSU5» eintippen und Enter drücken.", "Ablauf wie KSV5 (Periode, Geschäftsjahr, Zyklus, Testlauf, Echtlauf). Felder im Detail beschreibt das Skript nicht."], "f": ["In Fiori über «Verrechnungen verwalten» mit Verrechnungsart Umlage (S. 325 nennt Verteilungen und Umlagen) und «Verrechnungen ausführen»."], "tip": "Für Richtig/Falsch: Umlage = Sekundärkostenart."}, "en": {"t": "Execute assessment", "z": "Allocates costs with a secondary cost element (assessment cost element). Reposting and distribution keep the primary cost element.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nKSU5» and press Enter.", "Same flow as KSV5 (period, fiscal year, cycle, test run, update run). The script does not describe the fields in detail."], "f": ["In Fiori via «Manage Allocations» with allocation type assessment (p. 325 names distributions and assessments) and «Run Allocations»."], "tip": "For true/false: assessment = secondary cost element."}}, {"c": "FB03", "b": "Berichte", "s": "S. 196–199", "auf": [9], "de": {"t": "Buchhaltungsbeleg anzeigen", "z": "Einen gebuchten FI-Beleg ansehen und von dort zum CO-Beleg springen.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nFB03» eintippen und Enter drücken. Alternativ im SAP-Menü: Rechnungswesen → Finanzwesen → Hauptbuch → Beleg → Anzeigen.", "Belegnummer, Buchungskreis (B200), Geschäftsjahr eintragen (Nummer unbekannt: Knopf «Belegliste»). Enter.", "Positionen mit Konto, Betrag, Steuerkennzeichen und Buchungsschlüssel erscheinen; Doppelklick zeigt Details.", "Zum Kostenrechnungsbeleg: Umfeld → Belegumfeld → Rechnungswesenbelege → «Kostenrechnungsbeleg» doppelklicken."], "f": ["App «Buchungsbelege verwalten» (im Skript S. 344 als Sprungziel genannt): Beleg suchen und öffnen."], "tip": "Testfrage 5: Der Weg zum CO-Beleg ist «Belegumfeld». Nur Erfolgskonten gehen ins CO."}, "en": {"t": "Display accounting document", "z": "View a posted FI document and jump from there to the CO document.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nFB03» and press Enter. Alternatively in the SAP menu: Accounting → Financial Accounting → General Ledger → Document → Display (menu names translated by me; the course system was German).", "Enter document number, company code (B200), fiscal year (unknown number: button «Document List»). Enter.", "Items with account, amount, tax code and posting key appear; double-click for details.", "To the controlling document: Environment → Document Environment → Accounting Documents → double-click «Controlling document»."], "f": ["App «Manage Journal Entries» (named in the script p. 344 as jump target; name per F2121): search and open the document."], "tip": "Test question 5: the way to the CO document is «Document Environment». Only P&L accounts flow into CO."}}, {"c": "KSB5", "b": "Berichte", "s": "S. 199", "auf": [9], "de": {"t": "Kostenrechnungsbelege (Istkosten) anzeigen", "z": "CO-Belege direkt anzeigen, ohne Umweg über FB03.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nKSB5» eintippen und Enter drücken.", "Selektion ausfüllen (z. B. Belegnummer oder Zeitraum), Ausführen (F8).", "Beleg doppelklicken: Kostenart, Kostenstelle und Betrag."], "f": ["Das Skript beschreibt dafür keine Fiori-App. Im Kurs und in der Prüfung gilt der Weg im SAP GUI."], "tip": "Im CO-Beleg steht nur die Aufwandszeile (einseitiger Beleg)."}, "en": {"t": "Display controlling documents (actual costs)", "z": "Show CO documents directly, without going via FB03.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nKSB5» and press Enter.", "Fill in the selection (e.g. document number or period), execute (F8).", "Double-click a document: cost element, cost center and amount."], "f": ["The course script describes no Fiori app for this. In the course and the exam the SAP GUI path applies."], "tip": "The CO document only contains the expense line (one-sided document)."}}, {"c": "FBL1N", "b": "Berichte", "s": "S. 195", "auf": [9], "de": {"t": "Einzelposten eines Lieferanten anzeigen", "z": "Liste der offenen (und auf Wunsch ausgeglichenen) Posten eines Lieferanten.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nFBL1N» eintippen und Enter drücken.", "Lieferant und Buchungskreis (B200) eintragen, Auswahl «Offene Posten».", "Ausführen (F8).", "Alternativ aus FB60 über das Symbol neben dem Feld Kreditor."], "f": ["Das Skript beschreibt dafür keine Fiori-App. Im Kurs und in der Prüfung gilt der Weg im SAP GUI."], "tip": ""}, "en": {"t": "Display supplier line items", "z": "List of open (and if wanted cleared) items of a supplier.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nFBL1N» and press Enter.", "Enter supplier and company code (B200), selection «Open items».", "Execute (F8).", "Alternatively from FB60 via the icon next to the vendor field."], "f": ["The course script describes no Fiori app for this. In the course and the exam the SAP GUI path applies."], "tip": ""}}, {"c": "S_ALR_87013611", "b": "Berichte", "s": "S. 293, 348–358", "auf": [9, 20], "de": {"t": "Bericht Kostenstellen Ist/Plan/Abweichung", "z": "Der wichtigste Kostenstellenbericht: Ist, Plan und Abweichung je Kostenstelle und Kostenart.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nS_ALR_87013611» eintippen und Enter drücken. Alternativ im SAP-Menü: Rechnungswesen → Controlling → Kostenstellenrechnung → Infosystem → Berichte zur Kostenstellenrechnung → Plan-/Ist-Vergleiche → Kostenstellen: Ist/Plan/Abweichung.", "Selektionsbild: Kostenrechnungskreis, Geschäftsjahr, Periode von/bis, Planversion, Kostenstellengruppe ODER Kostenstelle, optional Kostenarten.", "Ausführen (F8).", "Für die Baumstruktur eine Kostenstellengruppe eingeben. Gruppen-Ebene ansehen: links in der Navigation auf den Knoten (z. B. HAK) klicken.", "Drilldown: Summenzeile doppelklicken → «Kostenstellen Einzelposten Ist» (KSB1). Von dort Umfeld → Ursprungsbeleg (FB03)."], "f": ["App «Kostenstellen – Istdaten» (S. 343–344; im Übungsheft F2121 «Cost Centers Review Booklet»)."], "tip": "Angezeigt werden nur bebuchte Kostenstellen. Ohne Gruppe gibt es keine Hierarchiestruktur (Trainer 20.11.). Testfrage 14: Klick auf den Knoten HAK."}, "en": {"t": "Report cost centers actual/plan/variance", "z": "The main cost center report: actual, plan and variance per cost center and cost element.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nS_ALR_87013611» and press Enter. Alternatively in the SAP menu: Accounting → Controlling → Cost Center Accounting → Information System → Reports for Cost Center Accounting → Plan/Actual Comparisons → Cost Centers: Actual/Plan/Variance (menu names translated by me; the course system was German).", "Selection screen: controlling area, fiscal year, period from/to, plan version, cost center group OR cost center, optional cost elements.", "Execute (F8).", "For the tree structure enter a cost center group. To see the group level click the node (e.g. HAK) in the navigation on the left.", "Drill-down: double-click a total line → «Cost Centers Line Items Actual» (KSB1). From there Environment → Original Document (FB03)."], "f": ["App «Cost Centers – Actuals» (my translation of «Kostenstellen – Istdaten», p. 343–344; exercise book F2121: «Cost Centers Review Booklet»)."], "tip": "Only cost centers with postings are shown. Without a group there is no hierarchy structure (trainer, 20 Nov). Test question 14: click the node HAK."}}, {"c": "KSB1", "b": "Berichte", "s": "S. 350–352", "auf": [9], "de": {"t": "Einzelposten Ist einer Kostenstelle", "z": "Zeigt, aus welchen Buchungen sich eine Summe im Bericht zusammensetzt, mit Gegenkonto.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nKSB1» eintippen und Enter drücken.", "Direkt: Kostenstelle(n), Kostenart(en), Buchungszeitraum eingeben, Ausführen (F8). Oder aus S_ALR_87013611 per Doppelklick.", "Layout ändern (Spalten, Sortierung, Filter) über den Layout-Knopf.", "Einzelposten markieren → Mehr → Umfeld → Ursprungsbeleg: öffnet den Originalbeleg (FB03)."], "f": ["App «Einzelposten anzeigen – Kostenrechnung» (Übungsheft F2121 Übung 13, nicht im Skript)."], "tip": ""}, "en": {"t": "Cost center line items actual", "z": "Shows which postings make up a total in the report, with offset account.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nKSB1» and press Enter.", "Directly: enter cost center(s), cost element(s), posting period, execute (F8). Or from S_ALR_87013611 by double-click.", "Change the layout (columns, sorting, filter) via the layout button.", "Select a line item → More → Environment → Original Document: opens the original document (FB03)."], "f": ["App «Display Line Items – Cost Accounting» (exercise book F2121 exercise 13, not in the script)."], "tip": ""}}, {"c": "S_ALR_87013620", "b": "Berichte", "s": "S. 220", "auf": [13], "de": {"t": "Bericht Kostenstellen Ist/Plan/Obligo", "z": "Zeigt neben Ist und Plan auch das Obligo (Kosten aus offenen Bestellungen).", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nS_ALR_87013620» eintippen und Enter drücken. Alternativ im SAP-Menü: Rechnungswesen → Controlling → Kostenstellenrechnung → Infosystem → Berichte zur Kostenstellenrechnung → Plan/Ist-Vergleiche → Zusätzliche Kennzahlen → Kostenstellen: Ist/Plan/Obligo.", "Kostenrechnungskreis, Geschäftsjahr, Perioden, Kostenstelle oder Gruppe eintragen.", "Ausführen (F8). Spalte Obligo ablesen."], "f": ["Obligo in Fiori: App «Bestellungen verwalten», Knopf «Obligos anzeigen» (S. 226)."], "tip": ""}, "en": {"t": "Report cost centers actual/plan/commitment", "z": "Shows, besides actual and plan, the commitment (costs from open purchase orders).", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nS_ALR_87013620» and press Enter. Alternatively in the SAP menu: Accounting → Controlling → Cost Center Accounting → Information System → Reports for Cost Center Accounting → Plan/Actual Comparisons → Additional Key Figures → Cost Centers: Actual/Plan/Commitment (menu names translated by me; the course system was German).", "Enter controlling area, fiscal year, periods, cost center or group.", "Execute (F8). Read the commitment column."], "f": ["Commitment in Fiori: app «Manage Purchase Orders», button «Display Commitments» (my translation; p. 226)."], "tip": ""}}, {"c": "RPC0", "b": "Berichte", "s": "S. 359–361", "auf": [], "de": {"t": "Benutzereinstellungen für Berichte", "z": "Vorschlagswerte für das Selektionsbild der Berichte, damit du sie nicht jedes Mal eintippen musst.", "g": ["Im SAP GUI oben links ins Kommandofeld klicken (weisses Eingabefeld), «/nRPC0» eintippen und Enter drücken. Alternativ im SAP-Menü: Rechnungswesen → Controlling → Kostenstellenrechnung → Infosystem → Benutzereinstellungen.", "Register «Grunddaten»: Kostenrechnungskreis, Kostenstelle, Kostenstellengruppe, Kostenart usw.", "Register «Planungszeitraum» und «Berichtszeitraum»: Vorschlagszeiträume.", "Register «Berichtswährung» und weitere: z. B. Planversion.", "Sichern (benutzerbezogen)."], "f": ["Das Skript beschreibt dafür keine Fiori-App. Im Kurs und in der Prüfung gilt der Weg im SAP GUI."], "tip": ""}, "en": {"t": "User settings for reports", "z": "Default values for the reports' selection screen so you don't have to type them each time.", "g": ["In SAP GUI, click into the command field (white input box, top left), type «/nRPC0» and press Enter. Alternatively in the SAP menu: Accounting → Controlling → Cost Center Accounting → Information System → User Settings (menu names translated by me; the course system was German).", "Tab «Basic Data»: controlling area, cost center, cost center group, cost element
