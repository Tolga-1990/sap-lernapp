 B 3'000, C 1'000. CHF 1'000 bleiben auf dem Sender, weil die Summe nur 90 % ist (9.4.2.2)", "o": [{"t": "A 5'000, B 3'000, C 1'000; CHF 1'000 bleiben auf dem Sender", "r": true}, {"t": "A 5'556, B 3'333, C 1'111; der Sender ist voll entlastet", "r": false}, {"t": "A 5'000, B 3'000, C 2'000", "r": false}, {"t": "Die Buchung wird abgelehnt, weil die Summe nicht 100 % ist", "r": false}]}, {"id": "D27", "p": "D", "q": "<b>Rechnen:</b> CHF 8'000 mit festen Anteilen 2 : 1 : 1.", "a": "A 4'000, B 2'000, C 2'000. Der Sender ist voll entlastet (9.4.2.2)", "o": [{"t": "A 4'000, B 2'000, C 2'000; der Sender ist voll entlastet", "r": true}, {"t": "A 4'000, B 2'000, C 2'000; ein Rest bleibt auf dem Sender", "r": false}, {"t": "Je 2'666.67", "r": false}, {"t": "A 2'000, B 1'000, C 1'000; 4'000 bleiben auf dem Sender", "r": false}]}, {"id": "E1", "p": "E", "q": "Aus welchen Berichtsarten bestehen die Standardberichte?", "a": "Auftragsberichte, Kostenartenberichte, Verdichtungsberichte (10)", "o": [{"t": "Auftragsberichte", "r": true}, {"t": "Kostenartenberichte", "r": true}, {"t": "Verdichtungsberichte", "r": true}, {"t": "Lieferantenberichte", "r": false}]}, {"id": "E2", "p": "E", "q": "Wo liegen Ist-Einzelposten, wo die übrigen Werte?", "a": "Ist (Werttyp 04) und statistisches Ist (11) in ACDOCA (Universal Journal, zentrale Buchungstabelle), alle anderen Werte noch in COEP (ältere Tabelle der CO-Einzelposten) (10.1)", "o": [{"t": "Ist (Werttyp 04) und statistisches Ist (11) liegen in ACDOCA", "r": true}, {"t": "Alle anderen Werte liegen noch in COEP", "r": true}, {"t": "Planwerte liegen in ACDOCA", "r": false}, {"t": "Alle Werte liegen nur noch in COEP", "r": false}]}, {"id": "E3", "p": "E", "q": "Warum gibt es Summensätze?", "a": "Damit Berichte schneller laufen, ohne jedes Mal alle Einzelposten zu aggregieren. Dargestellt werden sie mit Report-Painter-Berichten (10.1)", "o": [{"t": "Damit Berichte schneller laufen, ohne jedes Mal alle Einzelposten zu aggregieren", "r": true}, {"t": "Dargestellt werden sie mit Report-Painter-Berichten", "r": true}, {"t": "Weil Einzelposten nach einem Jahr gelöscht werden", "r": false}, {"t": "Damit Planwerte gespeichert werden können", "r": false}]}, {"id": "E4", "p": "E", "q": "Welche Selektionskriterien hat S_ALR_87013611 (Bericht Kostenstellen Ist/Plan/Abweichung)?", "a": "Kostenrechnungskreis, Geschäftsjahr, Periode, Planversion, Kostenstelle(ngruppe), Kostenart(engruppe) (10.2)", "o": [{"t": "Kostenrechnungskreis", "r": true}, {"t": "Geschäftsjahr und Periode", "r": true}, {"t": "Planversion", "r": true}, {"t": "Lieferant", "r": false}]}, {"id": "E5", "p": "E", "q": "Wie kommst du vom Summenbericht zum Ursprungsbeleg?", "a": "Doppelklick auf die Zeile, „Kostenstellen Einzelposten Ist“ (KSB1), dann Umfeld → Ursprungsbeleg (FB03) (10.2)", "o": [{"t": "Doppelklick auf die Zeile, „Kostenstellen Einzelposten Ist“ (KSB1), dann Umfeld → Ursprungsbeleg (FB03)", "r": true}, {"t": "Doppelklick auf die Zeile öffnet direkt FB60", "r": false}, {"t": "Über RPC0 zum Ursprungsbeleg", "r": false}, {"t": "Über OKENN zur Kostenstelle und dann zu FB03", "r": false}]}, {"id": "E6", "p": "E", "q": "Was zeigt der Einzelpostenbericht zusätzlich zum Betrag?", "a": "Das Gegenkonto der Buchung (10.2)", "o": [{"t": "Das Gegenkonto der Buchung", "r": true}, {"t": "Den Verantwortlichen der Kostenstelle", "r": false}, {"t": "Die Planversion", "r": false}, {"t": "Die Bewegungsart", "r": false}]}, {"id": "E7", "p": "E", "q": "Wann erscheint die Variation, und wozu dient sie?", "a": "Wenn statt einer Kostenstelle eine Kostenstellengruppe selektiert wird. Man wechselt per Klick zwischen den Hierarchieebenen (10.3)", "o": [{"t": "Wenn statt einer Kostenstelle eine Kostenstellengruppe selektiert wird", "r": true}, {"t": "Man wechselt per Klick zwischen den Hierarchieebenen", "r": true}, {"t": "Wenn der Expertenmodus aus ist", "r": false}, {"t": "Sie dient zum Wechsel zwischen Plan und Ist", "r": false}]}, {"id": "E8", "p": "E", "q": "Was bietet der Expertenmodus?", "a": "Erweitertes Selektionsbild sowie Bericht speichern, Layout, Schwellwerte, Export, Präsentationsgrafik, Währungsumrechnung und Extrakte (10.4)", "o": [{"t": "Erweitertes Selektionsbild", "r": true}, {"t": "Bericht speichern und exportieren", "r": true}, {"t": "Schwellwerte und Präsentationsgrafik", "r": true}, {"t": "Buchungen direkt aus dem Bericht erfassen", "r": false}]}, {"id": "E9", "p": "E", "q": "Wozu dient RPC0 (Benutzereinstellungen für Berichte), und welche Register hat es?", "a": "Benutzerbezogene Vorschlagswerte für Berichte. Register: Grunddaten, Planungszeitraum, Berichtszeitraum, Berichtswährung, Weitere Angaben (10.5)", "o": [{"t": "Benutzerbezogene Vorschlagswerte für Berichte", "r": true}, {"t": "Register u. a. Grunddaten, Berichtszeitraum, Berichtswährung", "r": true}, {"t": "Parameter-IDs für alle Transaktionen", "r": false}, {"t": "Anlegen neuer Berichte mit Report Painter", "r": false}]}, {"id": "E10", "p": "E", "q": "Welcher Bericht zeigt Ist, Plan und Obligo für Kostenstellen?", "a": "S_ALR_87013620 (Bericht Kostenstellen Ist/Plan/Obligo) (8.6.6.2). Für eine ganze Kostenstellengruppe gibt es S_ALR_87013621 (Bereich: Ist/Plan/Obligo) (10.6)", "o": [{"t": "S_ALR_87013620 (Kostenstellen Ist/Plan/Obligo)", "r": true}, {"t": "S_ALR_87013611 (Kostenstellen Ist/Plan/Abweichung)", "r": false}, {"t": "S_ALR_87013645 (Statistische Kennzahlen: Periodenaufriss)", "r": false}, {"t": "S_ALR_87013615 (Kostenstellen: Aufriss nach Partner)", "r": false}]}, {"id": "F1", "p": "F", "q": "SAP GUI (Programmoberfläche): Die Werte der Organisationseinheiten sollen nicht bei jeder Transaktion neu eingegeben werden.", "a": "System → Benutzervorgaben → Benutzerdaten, Werte mit Parameter-ID (ID = Identifikation) hinterlegen; in Fiori als Standardwerte (Fallstudie, Aufgabe 2)", "o": [{"t": "System → Benutzervorgaben → Benutzerdaten, Werte mit Parameter-ID hinterlegen", "r": true}, {"t": "In Fiori die Werte als Standardwerte eintragen", "r": true}, {"t": "In jeder Transaktion mit F6 neu setzen", "r": false}, {"t": "Über RPC0 für alle Transaktionen speichern", "r": false}]}, {"id": "F2", "p": "F", "q": "KS01 (Kostenstelle anlegen) läuft, aber der falsche Kostenrechnungskreis ist gesetzt.", "a": "Mit F6 oder Zusätze → Kostenrechnungskreis setzen ändern (7.2.6)", "o": [{"t": "Mit F6", "r": true}, {"t": "Über Zusätze → Kostenrechnungskreis setzen", "r": true}, {"t": "Mit F4 im Feld Kostenstelle", "r": false}, {"t": "Transaktion abbrechen und KS02 starten", "r": false}]}, {"id": "F3", "p": "F", "q": "KS01 (Kostenstelle anlegen): Eine neue Kostenstelle soll wie eine bestehende aussehen.", "a": "Im Einstiegsbild die bestehende Kostenstelle als Vorlage angeben (7.2.6)", "o": [{"t": "Im Einstiegsbild die bestehende Kostenstelle als Vorlage angeben", "r": true}, {"t": "Die bestehende Kostenstelle in KS02 umbenennen", "r": false}, {"t": "In OKEON die Kostenstelle kopieren", "r": false}, {"t": "Das geht nicht, jede Kostenstelle wird leer angelegt", "r": false}]}, {"id": "F4", "p": "F", "q": "KSH1 (Kostenstellengruppe anlegen): Die neue Gruppe soll in die Standardhierarchie. Was ist zu beachten?", "a": "Zuordnen geht nur, solange der Gruppe noch keine Kostenstellen zugeordnet sind; sonst direkt in OKEON (Standardhierarchie ändern) anlegen (7.2.2, 7.3)", "o": [{"t": "Zuordnen geht nur, solange der Gruppe keine Kostenstellen zugeordnet sind", "r": true}, {"t": "Sonst die Gruppe direkt in OKEON anlegen", "r": true}, {"t": "Mit KSH1 angelegte Gruppen gehören automatisch zur Standardhierarchie", "r": false}, {"t": "Das geht nur mit KS04", "r": false}]}, {"id": "F5", "p": "F", "q": "OKEON (Standardhierarchie ändern): Eine Kostenstelle soll in einen anderen Knoten.", "a": "Im Strukturbaum per Drag-and-drop verschieben oder im Stammsatz den Hierarchiebereich ändern (7.3)", "o": [{"t": "Im Strukturbaum per Drag-and-drop verschieben", "r": true}, {"t": "Oder im Stammsatz den Hierarchiebereich ändern", "r": true}, {"t": "In OKENN per Drag-and-drop verschieben", "r": false}, {"t": "Kostenstelle löschen und neu anlegen", "r": false}]}, {"id": "F6", "p": "F", "q": "BP (Geschäftspartner): Lieferant zentral anlegen. Welche Rolle und Gruppierung wählst du?", "a": "Rolle „ZVEND – Kreditor/Lieferant zentr.“ (ZVEND = Rolle Lieferant zentral), Gruppierung „BPCH Interne Nummernvergabe CH“; Feld Geschäftspartner leer lassen (7.5.2.1)", "o": [{"t": "Rolle „ZVEND – Kreditor/Lieferant zentr.“", "r": true}, {"t": "Gruppierung „BPCH Interne Nummernvergabe CH“", "r": true}, {"t": "Feld Geschäftspartner leer lassen", "r": true}, {"t": "Feld Geschäftspartner mit einer eigenen Nummer füllen", "r": false}]}, {"id": "F7", "p": "F", "q": "BP (Geschäftspartner), Lieferant: Kontoführung. Welches Feld ist Pflicht?", "a": "Abstimmkonto (7.5.2.1)", "o": [{"t": "Abstimmkonto", "r": true}, {"t": "Kostenstelle", "r": false}, {"t": "Einkäufergruppe", "r": false}, {"t": "Steuerkategorie", "r": false}]}, {"id": "F8", "p": "F", "q": "Fiori „Hauptbuchbelege buchen“: Reparatur am Pool-Auto, bezahlt mit Bankomatkarte. Was ist auf der Aufwandsposition Pflicht?", "a": "Ein Kontierungsobjekt, hier die Hilfskostenstelle des Pool-Autos (PKW##) (Fallstudie, Aufgabe 7; 8.3)", "o": [{"t": "Ein Kontierungsobjekt, hier die Hilfskostenstelle des Pool-Autos (PKW##)", "r": true}, {"t": "Eine Bestellnummer", "r": false}, {"t": "Ein Umbuchungszyklus", "r": false}, {"t": "Nichts, Hauptbuchbelege brauchen keine Kontierung", "r": false}]}, {"id": "F9", "p": "F", "q": "ME21N (Bestellung anlegen): Lieferdatum „in 14 Tagen“, die Woche genügt. Welcher Lieferdatumstyp?", "a": "W wochengenau (8.6.2.4)", "o": [{"t": "W wochengenau", "r": true}, {"t": "D taggenau", "r": false}, {"t": "M monatsgenau", "r": false}, {"t": "T wochengenau", "r": false}]}, {"id": "F10", "p": "F", "q": "ME23N (Bestellung anzeigen): Du willst das Obligo der Position sehen.", "a": "Umfeld → Belegposition → RW-Obligobelege (RW = Rechnungswesen) (8.6.6.1)", "o": [{"t": "Umfeld → Belegposition → RW-Obligobelege", "r": true}, {"t": "Springen → Varianten", "r": false}, {"t": "Zusätze → Kostenrechnungskreis setzen", "r": false}, {"t": "Umfeld → Ursprungsbeleg", "r": false}]}, {"id": "F11", "p": "F", "q": "MIRO (Rechnung zur Bestellung erfassen): Der Saldo ist nicht null. Was tust du?", "a": "Betrag, Steuer und Bestellpositionen prüfen, bis der Saldo null ist; erst dann buchen (8.6.11)", "o": [{"t": "Betrag, Steuer und Bestellpositionen prüfen, bis der Saldo null ist; erst dann buchen", "r": true}, {"t": "Trotzdem buchen, die Differenz wird automatisch ausgebucht", "r": false}, {"t": "Die Rechnung mit FB60 statt MIRO buchen", "r": false}, {"t": "Den Wareneingang stornieren", "r": false}]}, {"id": "F12", "p": "F", "q": "KB31N (Kennzahlwerte erfassen): Kilometer laut Fahrtenbuch für Juli erfassen. Was beachtest du?", "a": "Kennzahl KM## ist ein Summenwert, sie gilt nur für die erfasste Periode (7.4.6)", "o": [{"t": "KM## ist ein Summenwert, er gilt nur für die erfasste Periode", "r": true}, {"t": "KM## ist ein Festwert, er gilt bis Jahresende", "r": false}, {"t": "Kilometer erfasst man in KK01", "r": false}, {"t": "Kilometer erfasst man in KB11N", "r": false}], "sm": true}, {"id": "F13", "p": "F", "q": "KSV5 (Verteilung ausführen): Der Zyklus soll nur geprüft werden.", "a": "Kennzeichen Testlauf gesetzt lassen und ausführen, Protokoll prüfen (9.4.3.3)", "o": [{"t": "Kennzeichen Testlauf gesetzt lassen und ausführen", "r": true}, {"t": "Danach das Protokoll prüfen", "r": true}, {"t": "Testlauf entfernen und ausführen", "r": false}, {"t": "Den Zyklus in KSV2 öffnen und sichern", "r": false}]}, {"id": "F14", "p": "F", "q": "„Verrechnungen verwalten“: Ein Segment soll im nächsten Lauf nicht mitlaufen.", "a": "Das Segment sperren (9.4.4)", "o": [{"t": "Das Segment sperren", "r": true}, {"t": "Das Segment löschen und später neu anlegen", "r": false}, {"t": "Den ganzen Zyklus löschen", "r": false}, {"t": "Das geht in der App nicht", "r": false}]}, {"id": "F15", "p": "F", "q": "S_ALR_87013611 (Bericht Kostenstellen Ist/Plan/Abweichung): Die Geschäftsleitung will nur Gruppen sehen, die Kostenstellenleitung die Details.", "a": "Kostenstellengruppe selektieren und mit der Variation zwischen den Ebenen wechseln (10.3)", "o": [{"t": "Kostenstellengruppe selektieren und mit der Variation zwischen den Ebenen wechseln", "r": true}, {"t": "Für jede Kostenstelle einen eigenen Bericht starten", "r": false}, {"t": "Den Expertenmodus ausschalten", "r": false}, {"t": "RPC0 für die Geschäftsleitung sperren", "r": false}]}, {"id": "F16", "p": "F", "q": "Bericht: Du rufst ihn täglich mit denselben Werten auf.", "a": "Vorschlagswerte in RPC0 (Benutzereinstellungen für Berichte) speichern (10.5)", "o": [{"t": "Vorschlagswerte in RPC0 speichern", "r": true}, {"t": "Werte in den Benutzervorgaben unter Parameter-ID XTX speichern", "r": false}, {"t": "Den Bericht in KS02 hinterlegen", "r": false}, {"t": "Bei jedem Aufruf F6 drücken", "r": false}]}, {"id": "K1", "p": "K", "q": "Mit welcher Transaktion hat der Trainer die eigenen Benutzerparameter (Aufgabe 2) gepflegt?", "a": "SU3 (Pflege eigener Benutzervorgaben), Reiter Parameter (Kurs 19.11.). Das Skript zeigt denselben Bildschirm über System → Benutzervorgaben → Benutzerdaten bzw. Eigene Daten (Skript S. 12 und 176); den Code SU3 nennt es nicht", "o": [{"t": "SU3, Reiter Parameter", "r": true}, {"t": "KS01, Register Grunddaten", "r": false}, {"t": "FS00, Register Steuerungsdaten", "r": false}, {"t": "OKEON, Änderungsmodus", "r": false}]}, {"id": "K2", "p": "K", "q": "Welche Werte gehören in Aufgabe 2 zu welchem Parameter? (mehrere richtig)", "a": "BUK = B200, CAC = K200, EKO = E200, WRK = W210, EKG = S##, XTX = X (Skript S. 12: Parameter-IDs; S. 42: Werte; S. 176: XTX = X) und LAG = LO## (nur Kurs 19.11.)", "o": [{"t": "BUK = B200", "r": true}, {"t": "CAC = K200", "r": true}, {"t": "WRK = W210", "r": true}, {"t": "EKO = S##", "r": false}]}, {"id": "K3", "p": "K", "q": "Wofür steht die Parameter-ID LAG, und welcher Wert wurde im Kurs eingetragen?", "a": "LAG = Lagerort, Wert LO## (je Benutzer eigener Lagerort) (Kurs 19.11.)", "o": [{"t": "Lagerort, Wert LO##", "r": true}, {"t": "Ledger, Wert 0L", "r": false}, {"t": "Lieferant, Wert S##", "r": false}, {"t": "Lager-Werk, Wert W210", "r": false}]}, {"id": "K4", "p": "K", "q": "Welcher Mandant wurde im Kurssystem verwendet?", "a": "Mandant 400 (Kurs 19.11., Skript S. 11)", "o": [{"t": "400", "r": true}, {"t": "100", "r": false}, {"t": "200", "r": false}, {"t": "K200", "r": false}], "sm": true}, {"id": "K5", "p": "K", "q": "Aufgabe 3: Welches Konto wird OHNE Kostenartentyp angelegt? ", "a": "22154.## S##-Vblk. Kreditkarten ist ein Bilanzkonto (Verbindlichkeit) und keine Kostenart; in der Liste steht weder Steuerkategorie noch Kostenartentyp (Skript S. 13; Kurs 19.11.)", "o": [{"t": "22154.## S##-Vblk. Kreditkarten", "r": true}, {"t": "58102.## S##-Aus- und Fortbildung", "r": false}, {"t": "62002.## S##-Reparaturen", "r": false}, {"t": "65032.## S##-Fachliteratur", "r": false}], "sm": true}, {"id": "K6", "p": "K", "q": "Aufgabe 3: Welche Steuerkategorie bekommt 65032.## S##-Fachliteratur?", "a": "V2 (Vorsteuer 2,6 %), Vorlage 65030, Kostenartentyp 1 (Skript S. 13; 2,6 % laut Rechnung S. 23)", "o": [{"t": "V2", "r": true}, {"t": "V1", "r": false}, {"t": "A2", "r": false}, {"t": "keine", "r": false}], "sm": true}, {"id": "K7", "p": "K", "q": "In FS00 (Sachkonto anlegen): In welchem Register steht der Kostenartentyp?", "a": "Register Steuerungsdaten, Feldgruppe Kontoeinstellungen am Kostenrechnungskreis K200 (Kurs 19.11., Skript S. 49)", "o": [{"t": "Steuerungsdaten, unter Kontoeinstellungen am Kostenrechnungskreis", "r": true}, {"t": "Typ/Bezeichnung, neben der Sachkontoart", "r": false}, {"t": "Erfassung/Bank/Zins", "r": false}, {"t": "Schlagw./Übersetzung", "r": false}], "sm": true}, {"id": "K8", "p": "K", "q": "Aufgabe 4: Welche Transaktion zeigt die Standardhierarchie an, welche ändert sie? (mehrere richtig)", "a": "OKENN = anzeigen (Skript S. 103), OKEON = ändern (S. 105), KSH2 = Kostenstellengruppen ändern (S. 70); im Kurs 19.11. so gezeigt", "o": [{"t": "OKENN = Standardhierarchie anzeigen", "r": true}, {"t": "OKEON = Standardhierarchie ändern", "r": true}, {"t": "KSH2 = Kostenstellengruppen ändern und anlegen", "r": true}, {"t": "KS03 = Standardhierarchie ändern", "r": false}], "sm": true}, {"id": "K9", "p": "K", "q": "Aufgabe 4/5: Unter welchen Gruppen hängen die Kostenstellen in der Hierarchie?", "a": "S##-HG (Hauptgruppe), darunter HAUPT## (Hauptkostenstellen) und HILF## (Hilfskostenstellen) (Skript S. 14)", "o": [{"t": "S##-HG → HAUPT## und HILF##", "r": true}, {"t": "K200 → B200 und W210", "r": false}, {"t": "S##-HG → RW## und PKW##", "r": false}, {"t": "HAUPT## → S##-HG und HILF##", "r": false}]}, {"id": "K10", "p": "K", "q": "Aufgabe 5: Welche Kostenstellen sind Hilfskostenstellen (Art H, Bereich HILF##)? (mehrere richtig)", "a": "PKW##, LIT##, REIN##, BILD## (Skript S. 14–15: Art H, Hierarchiebereich HILF##)", "o": [{"t": "PKW##", "r": true}, {"t": "LIT##", "r": true}, {"t": "BILD##", "r": true}, {"t": "RW##", "r": false}], "sm": true}, {"id": "K11", "p": "K", "q": "Aufgabe 7: Wie lautet der Buchungssatz für die Werkstattrechnung, bezahlt mit Firmenkreditkarte?", "a": "62002.## Reparaturen (Soll, Kostenstelle PKW##) an 22154.## Vblk. Kreditkarten (Haben), Steuerkennzeichen V1 (Konten und V1: Skript S. 13; Rechnung und «passende Hilfskostenstelle» für das Pool-Auto: S. 16; so im Kurs 19.11. gebucht)", "o": [{"t": "62002.## Reparaturen an 22154.## Vblk. Kreditkarten, V1", "r": true}, {"t": "22154.## an 62002.##, V2", "r": false}, {"t": "62002.## an Kasse, V0", "r": false}, {"t": "58102.## an 22154.##, V1", "r": false}], "sm": true}, {"id": "K12", "p": "K", "q": "Aufgabe 7 in FB50: Was musst du einstellen bzw. prüfen, damit Steuer und Kostenstelle erfasst werden? (mehrere richtig)", "a": "Erfassungsvariante STANDARD 3_0100 einschalten (Steuer, Kostenstelle, Auftrag) und Steuer rechnen auf Reiter Detail aktivieren (Skript S. 176: Steuer rechnen im Register Detail; S. 178: Erfassungsvarianten; die Wahl 3_0100 im Kurs 19.11.)", "o": [{"t": "Arbeitsvorlagen → Erfassungsvariante STANDARD 3_0100", "r": true}, {"t": "«Steuer rechnen» auf Reiter Detail aktiv", "r": true}, {"t": "Parameter-ID LAG setzen", "r": false}, {"t": "Belegart auf AB stellen", "r": false}], "sm": true}, {"id": "L1", "p": "L", "q": "Wie viele Buchungskreise können einem Kostenrechnungskreis zugeordnet sein?", "a": "Einem Kostenrechnungskreis können mehrere Buchungskreise zugeordnet sein (1 : N). Im Kurs: K200 mit B200 (Folie des Trainers zu Aufgabe 1; Skript 6.3)", "o": [{"t": "Einer oder mehrere (1 : N)", "r": true}, {"t": "Genau einer (1 : 1)", "r": false}, {"t": "Keiner, der Buchungskreis steht über dem Kostenrechnungskreis", "r": false}, {"t": "Höchstens zwei", "r": false}], "sm": true}, {"id": "L2", "p": "L", "q": "Welche Felder sind laut Folie des Trainers Mussfelder beim Anlegen einer Kostenart? (mehrere richtig)", "a": "Bezeichnung und Kostenartentyp (Folie zu Aufgabe 3; Skript S. 49: Kostenartentyp ist Mussfeld). Achtung: Der Trainer sagte, die Folie stamme aus alten GUI-Unterlagen; die Frage kann in der Prüfung anders gestellt sein", "o": [{"t": "Bezeichnung", "r": true}, {"t": "Kostenartentyp", "r": true}, {"t": "Kostenstelle", "r": false}, {"t": "Steuerkennzeichen", "r": false}], "sm": true}, {"id": "L3", "p": "L", "q": "Sachkonto in Fiori, Buchungskreisebene: Welche zwei Felder zeigte der Trainer als Mussfelder (rotes Sternchen)? (mehrere richtig)", "a": "Kontowährung und Feldstatusgruppe (Trainer, Kurs 19.11.; Feldstatusgruppe Skript S. 50)", "o": [{"t": "Kontowährung", "r": true}, {"t": "Feldstatusgruppe", "r": true}, {"t": "Sortierschlüssel", "r": false}, {"t": "Steuerkategorie", "r": false}]}, {"id": "L4", "p": "L", "q": "Was bewirkt die Steuerkategorie V1 (statt «–») im Sachkonto?", "a": "Auf das Konto darf nur noch mit dem Steuerkennzeichen V1 gebucht werden (Trainer, Kurs 19.11.; Skript S. 48)", "o": [{"t": "Auf das Konto darf nur noch mit V1 gebucht werden", "r": true}, {"t": "Alle Steuerkennzeichen sind erlaubt", "r": false}, {"t": "Das Konto darf nur ohne Steuer bebucht werden", "r": false}, {"t": "Nur Ausgangssteuer ist erlaubt", "r": false}]}, {"id": "L5", "p": "L", "q": "Was steuert die Feldstatusgruppe eines Sachkontos?", "a": "Den Bildschirmaufbau bei der Belegerfassung: welche Felder Musseingabe, Kanneingabe oder ausgeblendet sind. Beispiel aus dem Kurs: G013 = Text obligatorisch (Skript S. 50; Trainer, Kurs 19.11.)", "o": [{"t": "Welche Felder beim Buchen Muss-, Kann- oder ausgeblendete Felder sind", "r": true}, {"t": "Die Sortierung der Einzelposten", "r": false}, {"t": "Welche Steuerkennzeichen erlaubt sind", "r": false}, {"t": "Die Kontowährung", "r": false}]}, {"id": "L6", "p": "L", "q": "Wofür ist der Sortierschlüssel im Sachkonto da?", "a": "Er gibt die Aufbauregel für das Feld Zuordnung in der Belegposition an; danach werden die Einzelposten sortiert. Im Kurs: Sortierschlüssel 8 = Kostenstelle (Skript S. 48; Trainer, Kurs 19.11.)", "o": [{"t": "Er legt fest, was ins Feld Zuordnung kommt, und damit die Sortierung der Einzelposten", "r": true}, {"t": "Er legt die Reihenfolge der Konten in der Bilanz fest", "r": false}, {"t": "Er bestimmt das Steuerkennzeichen", "r": false}, {"t": "Er sortiert die Kostenstellen in der Standardhierarchie", "r": false}]}, {"id": "L7", "p": "L", "q": "KS01 (Kostenstelle anlegen): Welche Felder sind laut Folie des Trainers Mussfelder? (mehrere richtig)", "a": "Bezeichnung, Verantwortlicher, Art der Kostenstelle, Hierarchiebereich, Währung (Folie zu Aufgabe 5; Skript S. 62: Verantwortlicher ist Mussfeld)", "o": [{"t": "Verantwortlicher", "r": true}, {"t": "Art der Kostenstelle", "r": true}, {"t": "Hierarchiebereich", "r": true}, {"t": "Verantwortlicher Benutzer", "r": false}], "sm": true}, {"id": "L8", "p": "L", "q": "Kostenstelle in Fiori: Was ist der Unterschied zwischen «Verantwortlicher» und «verantwortlicher Benutzer»?", "a": "Der Verantwortliche ist ein Freitextfeld und Mussfeld (im Kurs S##). Der verantwortliche Benutzer ist ein SAP-Benutzer und kein Mussfeld (Trainer, Kurs 19.11.; Skript S. 62 und 98)", "o": [{"t": "Verantwortlicher = Freitext und Pflicht; verantwortlicher Benutzer = SAP-Benutzer, keine Pflicht", "r": true}, {"t": "Beide sind Pflicht", "r": false}, {"t": "Verantwortlicher Benutzer ist Pflicht, Verantwortlicher nicht", "r": false}, {"t": "Es ist dasselbe Feld", "r": false}]}, {"id": "L9", "p": "L", "q": "Was bedeutet die Kostenstellenart G?", "a": "G = Logistik (Skript S. 84). Im Kurs bekommt der Einkauf EK## die Art G", "o": [{"t": "Logistik", "r": true}, {"t": "Geschäftsleitung", "r": false}, {"t": "Gemeinkosten", "r": false}, {"t": "Gebäude", "r": false}]}, {"id": "L10", "p": "L", "q": "Welche Zuordnungen von Kostenstellenart und Bedeutung sind richtig? (mehrere richtig)", "a": "W = Verwaltung, V = Verkauf, H = Hilfskostenstelle, G = Logistik, F = Produktion, L = Management (Skript S. 84)", "o": [{"t": "W = Verwaltung", "r": true}, {"t": "V = Verkauf", "r": true}, {"t": "H = Hilfskostenstelle", "r": true}, {"t": "F = Finanzen", "r": false}]}, {"id": "L11", "p": "L", "q": "Wozu dient die Art der Kostenstelle? (mehrere richtig)", "a": "Für die Leistungsverrechnung (eine Leistungsart darf nur von Kostenstellen bestimmter Arten erbracht werden) und für Auswertungen (Skript S. 83). Der Trainer ergänzte: Sie erleichtert Umlagen und kann den Funktionsbereich ableiten (Kurs 19.11.)", "o": [{"t": "Leistungsverrechnung: Leistungsarten nur für bestimmte Kostenstellenarten", "r": true}, {"t": "Auswertungen nach Art der Kostenstelle", "r": true}, {"t": "Sie bestimmt die Währung der Kostenstelle", "r": false}, {"t": "Sie ersetzt die Standardhierarchie", "r": false}]}, {"id": "L12", "p": "L", "q": "OKENN (Standardhierarchie bearbeiten): Was bedeutet es, wenn Kostenstellen rot angezeigt werden?", "a": "Es gibt Änderungen, die noch nicht gespeichert sind; rot bleibt, bis gespeichert oder verworfen wird (Folie des Trainers zu Aufgabe 6). Im Skript S. 68 bedeutet rot bei der Gruppenpflege «markiert»", "o": [{"t": "Es gibt noch nicht gespeicherte Änderungen", "r": true}, {"t": "Die Kostenstelle ist gesperrt", "r": false}, {"t": "Die Kostenstelle hat Istkosten", "r": false}, {"t": "Die Kostenstelle ist gelöscht", "r": false}], "sm": true}, {"id": "L13", "p": "L", "q": "Standardhierarchie: Was passiert, wenn jemand sie im SAP GUI bearbeitet?", "a": "Im GUI wird die ganze Standardhierarchie gesperrt, wenn mehrere gleichzeitig in OKEON arbeiten; deshalb zuerst mit OKENN nur die eigene Gruppe öffnen (Skript S. 105). In Fiori können mehrere Personen gleichzeitig daran arbeiten (Trainer, Kurs 19.11.)", "o": [{"t": "Im GUI ist sie für andere gesperrt, in Fiori nicht", "r": true}, {"t": "In Fiori ist sie gesperrt, im GUI nicht", "r": false}, {"t": "Sie ist nie gesperrt", "r": false}, {"t": "Nur die bearbeitete Kostenstelle ist gesperrt", "r": false}]}, {"id": "L14", "p": "L", "q": "FB50 (Sachkontenbeleg erfassen): Welche Eingaben machst du in den Positionen? (mehrere richtig)", "a": "Sachkonto, Soll/Haben, Betrag, Steuerkennzeichen, Kostenstelle (Folie des Trainers zu Aufgabe 7; Skript S. 176–178: Belegpositionen in FB50)", "o": [{"t": "Sachkonto", "r": true}, {"t": "Soll/Haben", "r": true}, {"t": "Steuerkennzeichen", "r": true}, {"t": "Buchungskreis", "r": false}], "sm": true}, {"id": "L15", "p": "L", "q": "«Steuer rechnen» ist gesetzt. Wie rechnet SAP die Steuer, und wo stellst du auf Netto um?", "a": "SAP rechnet die Steuer aus dem Bruttobetrag; wer vom Nettobetrag rechnen will, setzt das Kennzeichen in FB00 (Bearbeitungsoptionen Finanzbuchhaltung) (Trainer, Kurs 19.11.; FB00 im Skript S. 180)", "o": [{"t": "Aus dem Bruttobetrag; Umstellung auf Netto in FB00", "r": true}, {"t": "Aus dem Nettobetrag; Umstellung in SU3", "r": false}, {"t": "Aus dem Bruttobetrag; Umstellung in FS00", "r": false}, {"t": "Gar nicht, die Steuer wird immer manuell erfasst", "r": false}]}, {"id": "L16", "p": "L", "q": "Was bedeutet meist die letzte Ziffer eines SAP-GUI-Transaktionscodes wie KSH1, KSH2, KSH3?", "a": "1 = Anlegen, 2 = Ändern, 3 = Anzeigen (Trainer, Kurs 19.11.)", "o": [{"t": "1 Anlegen, 2 Ändern, 3 Anzeigen", "r": true}, {"t": "1 Anzeigen, 2 Ändern, 3 Löschen", "r": false}, {"t": "1 Plan, 2 Ist, 3 Obligo", "r": false}, {"t": "1 GUI, 2 Fiori, 3 Web", "r": false}]}, {"id": "L17", "p": "L", "q": "Aufgabe 8: Mit welchen Daten buchst du die Rechnung Nr. 864 der Putzteufel GmbH? (mehrere richtig)", "a": "FB60 (Eingangsrechnung), Rechnungsbetrag CHF 486.45 (CHF 450.00 + 8,1 % MwSt CHF 36.45), Aufwand 62022.## Reinigung, Steuerkennzeichen V1, Kostenstelle REIN## (Skript S. 17–18; Konto aus Aufgabe 3, Kostenstelle aus Aufgabe 9)", "o": [{"t": "Rechnungsbetrag CHF 486.45", "r": true}, {"t": "Konto 62022.## Reinigung", "r": true}, {"t": "Kostenstelle REIN##", "r": true}, {"t": "Rechnungsbetrag CHF 450.00 (ohne MwSt)", "r": false}]}, {"id": "L18", "p": "L", "q": "Aufgabe 9: Welche Berichte bzw. Transaktionen zeigt das Skript für die Kontrolle der Buchung auf REIN##? (mehrere richtig)", "a": "FB03, KSB5, FBL1N, KSB1 und S_ALR_87013611 (Skript S. 18)", "o": [{"t": "KSB1 (Kostenstellen Einzelposten Ist)", "r": true}, {"t": "FBL1N (Kreditoren Einzelposten)", "r": true}, {"t": "KSB5 (Kostenrechnungsbelege Istkosten)", "r": true}, {"t": "KSV5 (Verteilung ausführen)", "r": false}]}, {"id": "L19", "p": "L", "q": "Aufgabe 10: Welche Daten gehören zum Lieferanten S##-Atlas Training? (mehrere richtig)", "a": "Buchungskreis B200, Einkaufsorganisation E200, Abstimmkonto 20000, Zahlungsbedingung sofort zahlbar ohne Abzug, Zahlweg Überweisung; Fiori-App Lieferantenstammdaten verwalten (Skript S. 19)", "o": [{"t": "Abstimmkonto 20000", "r": true}, {"t": "Zahlweg Überweisung", "r": true}, {"t": "Einkaufsorganisation E200", "r": true}, {"t": "Zahlungsbedingung 2 % Skonto", "r": false}]}, {"id": "L20", "p": "L", "q": "Aufgabe 11: Wie buchst du die Rechnung Nr. 17071 von Atlas Training?", "a": "FB60, CHF 2'648.45 (CHF 2'450.00 + 8,1 % MwSt CHF 198.45) auf 58102.## Aus- und Fortbildung, Steuerkennzeichen V1, Kostenstelle BILD## (Skript S. 20; Konto aus Aufgabe 3; BILD## aus Aufgabe 12, S. 21)", "o": [{"t": "CHF 2'648.45 auf 58102.##, V1, Kostenstelle BILD##", "r": true}, {"t": "CHF 2'450.00 auf 58102.##, V2, Kostenstelle RW##", "r": false}, {"t": "CHF 2'648.45 auf 65032.##, V2, Kostenstelle LIT##", "r": false}, {"t": "CHF 2'648.45 auf 22154.##, ohne Steuer", "r": false}]}, {"id": "L21", "p": "L", "q": "Aufgabe 12: Wie kommen die Ausbildungskosten auf deine Stammkostenstelle?", "a": "Mit KB61 (Einzelpostenumbuchung) von BILD## auf RW## (Skript S. 21)", "o": [{"t": "KB61 von BILD## auf RW##", "r": true}, {"t": "KB11N von RW## auf BILD##", "r": false}, {"t": "KSW5 von BILD## auf HAUPT##", "r": false}, {"t": "FB50 von 58102.## auf 22154.##", "r": false}]}, {"id": "L22", "p": "L", "q": "Aufgabe 13, ME21N (Bestellung anlegen): Welche Eingaben sind richtig? (mehrere richtig)", "a": "Kontierungstyp K (Kostenstelle), Menge 35 (10+6+4+7+3+5), Nettopreis CHF 15, Warengruppe Sonstiges, Werk W210, Sachkonto 65032.##, Kostenstelle LIT##, Steuerkennzeichen V2 (Skript S. 21; Folie des Trainers zur Bestellung). Die Folie zeigt noch die alten Werte W110/E100; es gilt das Skript", "o": [{"t": "Kontierungstyp K", "r": true}, {"t": "Kostenstelle LIT## und Sachkonto 65032.##", "r": true}, {"t": "Werk W210", "r": true}, {"t": "Steuerkennzeichen V1", "r": false}], "sm": true}, {"id": "L23", "p": "L", "q": "Aufgabe 14: Mit wie viel wird LIT## beim Wareneingang belastet?", "a": "CHF 525.00 = 35 × CHF 15 netto; die Vorsteuer ist kein Aufwand (Skript S. 21–22; meine Rechnung)", "o": [{"t": "CHF 525.00", "r": true}, {"t": "CHF 538.65", "r": false}, {"t": "CHF 15.00", "r": false}, {"t": "CHF 0, erst die Rechnung belastet", "r": false}]}, {"id": "L24", "p": "L", "q": "Aufgabe 15: Welche Rechnung buchst du mit MIRO, und welcher Steuersatz gilt?", "a": "Rechnung Nr. 17212: CHF 525.00 + 2,6 % MwSt CHF 13.65 = CHF 538.65, Steuerkennzeichen V2 (2,6 %) (Skript S. 23)", "o": [{"t": "CHF 538.65 inkl. 2,6 % MwSt (V2)", "r": true}, {"t": "CHF 567.53 inkl. 8,1 % MwSt (V1)", "r": false}, {"t": "CHF 525.00 ohne Steuer", "r": false}, {"t": "CHF 538.65 inkl. 8,1 % MwSt (V1)", "r": false}]}, {"id": "L25", "p": "L", "q": "Aufgabe 16, KB11N (manuelle Umbuchung) von LIT##: Welche Beträge gehen an welche Hauptkostenstelle? (mehrere richtig)", "a": "EK## 120 (2 BT + 6 PT), VT## 90 (2 BT + 4 ST), RW## 210 (4 BT + 7 FT + 3 CT), PE## 105 (2 BT + 5 ET), Total 525 (Skript S. 24; Folie des Trainers; Beträge × CHF 15)", "o": [{"t": "EK## CHF 120", "r": true}, {"t": "RW## CHF 210", "r": true}, {"t": "PE## CHF 105", "r": true}, {"t": "VT## CHF 120", "r": false}], "sm": true}, {"id": "L26", "p": "L", "q": "KK01 (statistische Kennzahl anlegen) für KM##: Welche Angaben sind laut Folie des Trainers nötig? (mehrere richtig)", "a": "Bezeichnung, Einheit und Kennzahltyp Summenwerte (Folie zu Aufgabe 17; Skript S. 118: Festwerte oder Summenwerte wählen)", "o": [{"t": "Bezeichnung", "r": true}, {"t": "Einheit", "r": true}, {"t": "Kennzahltyp Summenwerte", "r": true}, {"t": "Kostenstelle", "r": false}], "sm": true}, {"id": "L27", "p": "L", "q": "Aufgabe 17: Welche Kilometer erfasst du laut Fahrtenbuch für KM##? (mehrere richtig)", "a": "VT## 2'027, EK## 423, PE## 230, RW## 57, Total 2'737 (Skript S. 25; Summen meine Rechnung, deckungsgleich mit der Folie des Trainers)", "o": [{"t": "VT## 2'027", "r": true}, {"t": "EK## 423", "r": true}, {"t": "RW## 57", "r": true}, {"t": "PE## 0, weil die Fahrt privat war", "r": false}]}, {"id": "L28", "p": "L", "q": "Aufgabe 18: Welche Quadratmeter erfasst du für RAUM##? (mehrere richtig)", "a": "EK## 40, PE## 23, RW## 98, VT## 19, Total 180 m² (Skript S. 26). Erfasst mit den Fiori-Apps Statistische Kennzahlen verwalten und Statistische Kennzahlwerte verwalten", "o": [{"t": "RW## 98", "r": true}, {"t": "EK## 40", "r": true}, {"t": "VT## 19", "r": true}, {"t": "PE## 32", "r": false}]}, {"id": "L29", "p": "L", "q": "Was ist der Unterschied zwischen KSW5 (periodische Umbuchung) und KSV5 (Verteilung) laut Folie des Trainers?", "a": "KSW5: Der Sender bekommt keinen Entlastungssatz, er wird mit umgekehrtem Vorzeichen auf derselben Belastung bebucht. KSV5: Der Sender bekommt einen eigenen Entlastungssatz (Folie zu Aufgabe 19). Bei beiden bleibt die Primärkostenart erhalten (Skript S. 273)", "o": [{"t": "KSW5 ohne eigenen Entlastungssatz, KSV5 mit eigenem Entlastungssatz", "r": true}, {"t": "KSW5 mit eigenem Entlastungssatz, KSV5 ohne", "r": false}, {"t": "KSW5 nutzt Sekundärkostenarten, KSV5 nicht", "r": false}, {"t": "Es gibt keinen Unterschied", "r": false}], "sm": true}, {"id": "L30", "p": "L", "q": "Aufgabe 19: Welche Hilfskostenstelle wird womit entlastet? (mehrere richtig)", "a": "PKW## mit periodischer Umbuchung (SAP GUI, KSW5) nach Kilometern KM##; REIN## mit Verteilung (Fiori, Verrechnungen verwalten/ausführen) nach Quadratmetern RAUM##; Empfänger EK##, VT##, PE##, RW## (Skript S. 27; Folie des Trainers)", "o": [{"t": "PKW## per periodischer Umbuchung nach KM##", "r": true}, {"t": "REIN## per Verteilung nach RAUM##", "r": true}, {"t": "LIT## per Verteilung nach RAUM##", "r": false}, {"t": "PKW## per Verteilung nach RAUM##", "r": false}], "sm": true}]};

let S={q:{},c:{},exams:[]};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
// Box 0 = neu, 1 = falsch, 2 = einmal richtig, 3 = sicher (zweimal hintereinander richtig)
function mark(store,id,ok){const r=S[store][id]||{b:0,r:0,f:0};if(ok){r.r++;r.b=r.b>=2?3:2;}else{r.f++;r.b=1;}r.t=Date.now();S[store][id]=r;save();}
function box(store,id){return (S[store][id]||{b:0}).b;}
function weight(store,id){return [3,6,2,1][box(store,id)];} // falsche Fragen kommen am häufigsten
function pick(list,store,idf){let tot=0;const w=list.map(x=>{const v=weight(store,idf(x));tot+=v;return v;});let r=Math.random()*tot;for(let i=0;i<list.length;i++){r-=w[i];if(r<0)return list[i];}return list[list.length-1];}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

 ({start:renderStart,quiz:renderQuiz,cards:renderCards,exam:renderExam,search:renderSearch,loes:renderLoes,stats:renderStats})[v]();}

 nextQ(pool);}
function optsHtml(x,name){const multi=x.o.filter(o=>o.r).length>1;x._order=x._order||shuffle(x.o.map((o,i)=>i));
 return `<div class="hint">${multi?'Mehrere Antworten sind richtig: wähle alle richtigen ('+x.o.filter(o=>o.r).length+')':'Eine Antwort ist richtig'}</div>`+
 x._order.map(i=>`<label class="opt" data-i="${i}"><input type="${multi?'checkbox':'radio'}" name="${name}" value="${i}"><span>${x.o[i].t}</span></label>`).join('');}
function smTag(x){return x.sm?'<span class="tag sm">🙂 laut Trainer prüfungsrelevant</span>':'';}

 wireSel();
 $('#chk').onclick=()=>{const sel=chosen();if(!sel.length)return;const ok=correctSel(x,sel);
  document.querySelectorAll('.opt').forEach(l=>{const i=+l.dataset.i;l.querySelector('input').disabled=true;if(x.o[i].r)l.classList.add('right');else if(sel.includes(i))l.classList.add('wrong');});
  $('#res').textContent=ok?'Richtig':'Falsch – grün markiert sind die richtigen Antworten';$('#res').style.color=ok?'var(--ok)':'var(--bad)';

async function idbSet(k,v){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}

function stem(w){return w.length>=7?w.slice(0,w.length-2):w.length>=5?w.slice(0,w.length-1):w;}
function score(text,ts){const n=norm(text);let s=0,c=0;ts.forEach(w=>{const st=stem(w);if(n.includes(st)){s++;c+=Math.min(5,n.split(st).length-1);}});return s*10+c;}
function need(ts){return ts.length<=2?ts.length:Math.ceil(ts.length*0.6);}
function hits(text,ts){const n=norm(text);return ts.filter(w=>n.includes(stem(w))).length;}
function hl(text,ts){let h=esc(text);ts.forEach(w=>{const st=stem(w);if(st.length<2)return;const re=new RegExp('('+st.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[\\wäöüÄÖÜß]*)','gi');h=h.replace(re,'<mark>$1</mark>');});return h;}
function snippet(page,ts){const n=norm(page);let i=-1;for(const w of ts){i=n.indexOf(stem(w));if(i>=0)break;}if(i<0)i=0;const a=Math.max(0,i-160),b=Math.min(page.length,i+260);return (a>0?'… ':'')+page.slice(a,b).replace(/\s+/g,' ')+(b<page.length?' …':'');}

function runSearch(){
 const ts=terms(),box=$('#sres');if(!box)return;

 let h=`<div class="muted" style="margin:0 0 8px">Gesucht nach: ${ts.map(esc).join(', ')}${ts.length>2?` (mindestens ${nd} davon müssen vorkommen)`:''}</div>`;

 h+=`<div class="card"><b>Karteikarten (${cs.length})</b>`+(cs.length?cs.slice(0,30).map(r=>`<div class="hit"><b>${hl(r.x.c,ts)}</b>: ${hl(r.x.f,ts)} <span class="muted">(${r.x.s==='allgemein'?'nicht im Skript':'Skript '+pageLinks(esc(r.x.s))})</span>${ob('openC',r.x.c,'Karte öffnen')}</div>`).join(''):'<div class="muted">kein Treffer</div>')+`</div>`;
 if(pages)h+=`<div class="card"><b>Skript: ${sp.length} Seite(n)</b>`+(sp.length?sp.slice(0,30).map(r=>`<div class="hit"><b>S. ${r.n}</b>${btn(r.n)}<br>${hl(snippet(pages[r.n-1],ts),ts)}</div>`).join('')+(sp.length>30?'<div class="muted">… weitere Seiten: '+sp.slice(30).map(r=>r.n).sort((a,b)=>a-b).join(', ')+'</div>':''):'<div class="muted">kein Treffer</div>')+`</div>`;
 h+=`<div class="card"><b>Skript-Inhaltsverzeichnis (${tc.length})</b>`+(tc.length?tc.slice(0,20).map(r=>`<div class="hit">Kap. ${esc(r.x[0])} ${hl(r.x[1],ts)} · <b>S. ${esc(r.x[2])}</b>${btn(+r.x[2])}</div>`).join(''):'<div class="muted">kein Treffer</div>')+`</div>`;

S. 12; an anderer Stelle heisst der Menüpunkt «Eigene Daten», S. 176).", "Im Kurs schneller: Transaktion SU3 (eigene Benutzerdaten pflegen) ins Kommandofeld eingeben."]}, {"h": "Schritt 2: Register «Parameter» ausfüllen", "b": ["Je Zeile die Parameter-ID (Kennung des Feldes) und den Wert eintragen:", [["BUK", "B200", "Buchungskreis wird vorbelegt"], ["CAC", "K200", "Kostenrechnungskreis wird vorbelegt"], ["EKG", "S05", "Einkäufergruppe für Bestellungen"], ["EKO", "E200", "Einkaufsorganisation für Bestellungen"], ["LAG", "LO05", "Lagerort für den Wareneingang (nur im Kurs, nicht im Skript)"], ["WRK", "W210", "Werk für Bestellungen"], ["XTX", "X", "Häkchen «Steuer rechnen» ist beim Buchen schon gesetzt (S. 176)"]]]}, {"h": "Schritt 3: Sichern", "b": ["Sichern (Diskettensymbol oder Ctrl+S).", "Zeilen, die schon da waren (z. B. IVFIDISPLAY, SCL, WLC), nicht ändern."]}], "f": [{"h": "Schritt 1: Standardwerte öffnen", "b": ["Oben rechts auf dein Profil → Einstellungen → Standardwerte (im Kurs gezeigt; Skript S. 12 «als Standardwerte im Fiori Launchpad»)."]}, {"h": "Schritt 2: Werte eintragen", "b": [[["Kostenrechnungskreis", "K200", "wird in Controlling-Apps vorbelegt"], ["Buchungskreis", "B200", "wird in Buchungs-Apps vorbelegt"], ["Werk", "W210", "für Bestellungen"], ["Einkaufsorganisation", "E200", "für Bestellungen"], ["Einkäufergruppe", "S05", "für Bestellungen"]]]}, {"h": "Schritt 3: Sichern und Zahlenformat prüfen", "b": ["Sichern.", "Unter Sprache und Region das Dezimaltrennzeichen auf Punkt stellen, sonst nimmt Fiori Beträge wie 556.29 nicht an (Kurs)."]}], "kontrolle": "Öffne z. B. KS01 (Kostenstelle anlegen): Das Feld Kostenrechnungskreis zeigt schon K200. Im Bild der Benutzerdaten zeigt das Feld «Änderer» deinen Benutzer mit Datum und Uhrzeit.", "falle": "Die Parameter gelten nur für deinen Benutzer, nicht für alle. Im Skript heisst der Weg «System → Benutzervorgaben», nicht SU3.", "q": "Skript S. 12, 42, 176; Kurs 19.11."}, {"nr": 3, "t": "Sachkonten mit Kostenart anlegen", "sm": true, "worum": "Du legst fünf Sachkonten (Konten der Finanzbuchhaltung) an. Vier davon sind Aufwandskonten und bekommen zugleich eine Kostenart, damit die Kosten auch im Controlling ankommen. Ein Konto (22154) ist ein Bilanzkonto und bekommt keine Kostenart. Immer mit einer Vorlage anlegen; einen Teil im GUI, einen Teil in Fiori (S. 13).", "daten": ["Kontenplan CACH, Buchungskreis B200, Kostenrechnungskreis K200 (S. 13)"], "tabelle": [["Sachkonto", "Bezeichnung", "Steuerkategorie", "Vorlage", "Kostenartentyp"], ["22154.05", "S05-Vblk. Kreditkarten", "leer", "22150", "keiner (Bilanzkonto)"], ["58102.05", "S05-Aus- und Fortbildung", "V1", "58100", "1"], ["62002.05", "S05-Reparaturen", "V1", "62000", "1"], ["62022.05", "S05-Reinigung", "V1", "62020", "1"], ["65032.05", "S05-Fachliteratur", "V2", "65030", "1"]], "g": [{"h": "Schritt 1: Transaktion öffnen", "b": ["FS00 (Sachkonto zentral bearbeiten) eingeben, Enter."]}, {"h": "Schritt 2: Konto und Vorlage angeben", "b": [[["Sachkonto", "62002.05", "deine neue Kontonummer"], ["Buchungskreis", "B200", "deine Firma"]]]}, {"h": "Schritt 3: «Mit Vorlage anlegen»", "b": ["Knopf «mit Vorlage» drücken, Vorlage eintragen, Weiter. SAP kopiert alle Einstellungen der Vorlage; du änderst Sachkontoart (N → P), Text und Steuerkategorie und prüfst den Kostenartentyp.", [["Sachkonto (Vorlage)", "62000", "bestehendes Reparaturkonto mit richtigen Einstellungen"], ["Buchungskreis (Vorlage)", "B200", "gleiche Firma"]]]}, {"h": "Schritt 4: Register «Typ/Bezeichnung»", "b": [[["Sachkontoart", "P (Primärkosten oder Erlöse)", "ACHTUNG: Die Vorlage bringt N (Nicht betriebliche Aufwendungen und Erträge, nur FI) mit. Auf P ändern! Nur mit P (in FI und CO verwendet) kann eine primäre Kostenart entstehen (S. 46). Bei 22154: X Bestandskonto."], ["Kontengruppe", "ERG. (Erfolgskonten)", "aus der Vorlage; Pflichtfeld; bestimmt, welche Felder beim Anlegen erscheinen (S. 47, 56). Bei 22154 Wert der Vorlage 22150 lassen."], ["Kurztext", "S05-Reparaturen", "Pflichtfeld; die Gruppennummer gehört in den Namen (S. 13)"], ["Sachkontenlangtext", "S05-Reparaturen", "Kann-Feld; gleicher Text"]]]}, {"h": "Schritt 5: Register «Steuerungsdaten»", "b": [[["Kontowährung", "CHF", "Pflichtfeld; Währung der Firma"], ["Steuerkategorie", "V1 (bei 65032: V2; bei 22154: leer)", "V1 heisst: Auf das Konto darf nur mit Steuerkennzeichen V1 gebucht werden (S. 48)"], ["Sortierschlüssel", "aus der Vorlage (im Kurs 8 = Kostenstelle)", "bestimmt, was im Feld «Zuordnung» der Buchung steht (S. 48)"], ["Kostenartentyp (Bereich Kostenrechnungskreis K200)", "1 (Primärkosten/kostenmindernde Erlöse)", "Pflicht bei Aufwandskonten; dadurch entsteht die Kostenart (S. 49). Bei 22154 kein Kostenartentyp."]]]}, {"h": "Schritt 6: Register «Erfassung/Bank/Zins»", "b": [[["Feldstatusgruppe", "aus der Vorlage (im Kurs G023, bei 65032 E004)", "Pflichtfeld; steuert beim Buchen, welche Felder Muss-, Kann- oder ausgeblendet sind (S. 50)"]]]}, {"h": "Schritt 7: Sichern", "b": ["Sichern. Die Kostenart wird mit angelegt; KA01 (Kostenart anlegen) zeigte der Trainer zusätzlich, nötig ist es nicht (S. 44)."]}], "f": [{"h": "Schritt 1: App öffnen und Vorlage suchen", "b": ["App «Sachkontenstammdaten verwalten» (S. 51).", [["Kontenplan", "CACH", "Pflichtfilter"], ["Sachkonto", "58100", "die Vorlage"]]]}, {"h": "Schritt 2: Kopieren", "b": ["Vorlage markieren → «Kopieren» (Anlegen mit Vorlage, S. 61).", [["Sachkonto", "58102.05", "deine neue Nummer"]]]}, {"h": "Schritt 3: Bereich «Allgemein»", "b": [[["Sachkontoart", "Primärkosten oder Erlöse (P)", "Vorlage zeigt evtl. N: auf P ändern, sonst keine Kostenart (S. 46, 55)"], ["Kontengruppe", "ERG. (Erfolgskonten)", "aus der Vorlage; Pflichtfeld (S. 56)"], ["Kurztext", "S05-Aus- und Fortbildung", "Pflichtfeld; höchstens 20 Zeichen, sonst kürzen"], ["Sachkontenlangtext", "S05-Aus- und Fortbildung", "gleicher Text"]]]}, {"h": "Schritt 4: Bereich «Buchungskreisdaten» (B200)", "b": [[["Kontowährung", "CHF", "Pflichtfeld; wird mit der Währung des Buchungskreises vorbelegt (S. 58)"], ["Steuerkategorie", "V1 (bei 65032: V2)", "nur dieses Steuerkennzeichen ist erlaubt"], ["Feldstatusgruppe", "aus der Vorlage", "Pflichtfeld"]], "Übernehmen. Der Kostenrechnungskreis K200 wird aus dem Buchungskreis abgeleitet (S. 59)."]}, {"h": "Schritt 5: Bereich «Controlling-Daten» (K200)", "b": [[["Kostenartentyp", "1", "dadurch wird das Konto zur Kostenart (S. 59–60)"]]]}, {"h": "Schritt 6: Sichern", "b": []}], "kontrolle": "FS00 mit deiner Kontonummer und B200 öffnen (Anzeigen): Sachkontoart P, Kontengruppe ERG., Steuerkategorie V1 und Kostenartentyp 1 stehen da. Meldet FB50 «nicht vorhanden in SKB1», fehlt der Buchungskreis-Teil B200: in FS00 mit Vorlage anlegen und sichern.", "falle": "Sachkontoart P, nicht N: N heisst nur FI, dann gibt es keine Kostenart und das Konto kommt nicht im Controlling an (S. 46). Mussfelder der Kostenart laut Folie: Bezeichnung und Kostenartentyp. Mussfelder auf Buchungskreisebene: Kontowährung und Feldstatusgruppe. Das Bilanzkonto 22154 bekommt weder Steuerkategorie noch Kostenartentyp.", "q": "Skript S. 13, 44–61; Folie 17; Kurs 19.11."}, {"nr": 4, "t": "Kostenstellengruppen HAUPT05 und HILF05 anlegen", "sm": false, "worum": "Unter deiner Gruppe S05-HG in der Standardhierarchie (Baum aller Kostenstellen) legst du zwei Untergruppen an: eine für die Hauptkostenstellen, eine für die Hilfskostenstellen.", "daten": ["Kostenrechnungskreis K200, Standardhierarchie K200", "Obergruppe S05-HG (S05-Hauptgruppe)", "Neu: HAUPT05 «S05-Hauptkostenstellen» und HILF05 «S05-Hilfskostenstellen» (S. 14)"], "g": [{"h": "Schritt 1: Nur deine Gruppe öffnen", "b": ["Zuerst OKENN (Standardhierarchie anzeigen, S. 103) und nur S05-HG wählen. Grund: In OKEON würden sich sonst alle Teilnehmer gegenseitig sperren (Kurs-Hinweis S. 105)."]}, {"h": "Schritt 2: Ändern-Modus", "b": ["OKEON (Standardhierarchie ändern, S. 105) → im Baum S05-HG markieren."]}, {"h": "Schritt 3: Untergruppe anlegen", "b": ["Symbol «Anlegen» → «Untergeordnete Gruppe» (S. 107).", [["Gruppe", "HAUPT05", "Name der neuen Gruppe"], ["Bezeichnung", "S05-Hauptkostenstellen", "Text"]]]}, {"h": "Schritt 4: Zweite Untergruppe", "b": ["Wieder S05-HG markieren → Anlegen → Untergeordnete Gruppe.", [["Gruppe", "HILF05", "Name"], ["Bezeichnung", "S05-Hilfskostenstellen", "Text"]]]}, {"h": "Schritt 5: Sichern", "b": ["Nicht gesicherte Änderungen sind rot (Folie).", "Alternative: KSH2 (Kostenstellengruppe ändern, S. 70) mit Gruppe S05-HG. KSH1 legt dagegen eine Gruppe ausserhalb der Standardhierarchie an (S. 64)."]}], "f": [{"h": "Schritt 1: App öffnen", "b": ["App «Kostenstellengruppen verwalten» (S. 74) → Standardhierarchie K200 öffnen (S. 112) → Bearbeiten."]}, {"h": "Schritt 2: Untergruppen anlegen", "b": ["S05-HG markieren → Neu → untergeordnete Gruppe.", [["Gruppe", "HAUPT05", "neue Gruppe"], ["Name", "S05-Hauptkostenstellen", "Text"]], "Gleich für HILF05 «S05-Hilfskostenstellen»."]}, {"h": "Schritt 3: Sichern", "b": []}], "kontrolle": "Im Baum stehen unter S05-HG die Gruppen HAUPT05 und HILF05.", "falle": "Eine Gruppe, die du über «Neu» separat anlegst (S. 77), gehört nicht automatisch zur Standardhierarchie.", "q": "Skript S. 14, 64–80, 103–113"}, {"nr": 5, "t": "Acht Kostenstellen anlegen", "sm": true, "worum": "Du legst vier Hauptkostenstellen und vier Hilfskostenstellen an und hängst sie in die passende Gruppe. Einen Teil im GUI, einen Teil in Fiori. Alle gültig ab 01.01.", "daten": ["Verantwortlicher S05, Währung CHF, Buchungskreis B200 (S. 15)", "Art der Kostenstelle laut Skript S. 84: G Logistik, H Hilfskostenstelle, V Verkauf, W Verwaltung"], "tabelle": [["Kostenstelle", "Bezeichnung", "Art", "Gruppe"], ["RW05", "S05-Rechnungswesen", "W (Verwaltung)", "HAUPT05"], ["EK05", "S05-Einkauf", "G (Logistik)", "HAUPT05"], ["VT05", "S05-Vertrieb", "V (Verkauf)", "HAUPT05"], ["PE05", "S05-Personal", "W (Verwaltung)", "HAUPT05"], ["PKW05", "S05-PKW", "H (Hilfskostenstelle)", "HILF05"], ["LIT05", "S05-Fachliteratur", "H", "HILF05"], ["REIN05", "S05-Reinigung", "H", "HILF05"], ["BILD05", "S05-Ausbildung", "H", "HILF05"]], "g": [{"h": "Schritt 1: Einstieg", "b": ["KS01 (Kostenstelle anlegen, S. 81).", [["Kostenrechnungskreis", "K200", "aus dem Parameter; ändern mit F6"], ["Kostenstelle", "RW05", "neue Nummer"], ["Gültig ab", "01.01.2026", "laut Aufgabe ab Jahresbeginn"], ["Gültig bis", "31.12.9999", "unbegrenzt"], ["Vorlage", "leer, oder eine fertige Kostenstelle", "mit Vorlage geht die nächste schneller"]]]}, {"h": "Schritt 2: Register «Grunddaten»", "b": [[["Bezeichnung", "S05-Rechnungswesen", "Pflichtfeld"], ["Beschreibung", "S05-Rechnungswesen", "Text"], ["Verantwortlicher", "S05", "Pflichtfeld, freier Text (S. 62)"], ["Verantwortlicher Benutzer", "leer", "kein Pflichtfeld (wäre ein SAP-Benutzer)"], ["Art der Kostenstelle", "W", "Pflichtfeld; siehe Tabelle"], ["Hierarchiebereich", "HAUPT05", "Pflichtfeld; Platz im Baum"], ["Buchungskreis", "B200", "deine Firma"], ["Währung", "CHF", "Pflichtfeld"]]]}, {"h": "Schritt 3: Register «Steuerung»", "b": ["Sperrkennzeichen Erlöse bleibt gesetzt (Kurs): Auf die Kostenstelle dürfen keine Erlöse gebucht werden."]}, {"h": "Schritt 4: Sichern", "b": ["Für die nächste Kostenstelle die fertige als Vorlage nehmen und Nummer, Texte, Art und Hierarchiebereich anpassen."]}], "f": [{"h": "Schritt 1: App öffnen", "b": ["App «Kostenstellen verwalten» (S. 93) → Anlegen (S. 97)."]}, {"h": "Schritt 2: Bereich «Allgemeine Informationen»", "b": [[["Kostenrechnungskreis", "K200", "Pflicht"], ["Kostenstelle", "PKW05", "neue Nummer"], ["Bezeichnung", "S05-PKW", "Pflicht (rot markiert)"], ["Beschreibung", "S05-PKW", "Pflicht (rot markiert)"], ["Verantwortlicher", "S05", "Pflicht"], ["Art der Kostenstelle", "H", "Hilfskostenstelle"], ["Gültig ab / bis", "01.01.2026 / 31.12.9999", "Gültigkeit"]]]}, {"h": "Schritt 3: Bereich «Organisationseinheit» (S. 99)", "b": [[["Standardhierarchieknoten", "HILF05", "Pflicht; Platz im Baum"], ["Buchungskreis", "B200", "deine Firma"], ["Währung", "CHF", "Währung"]]]}, {"h": "Schritt 4: Anlegen", "b": ["Mit Vorlage: fertige Kostenstelle markieren → Kopieren (S. 100) und anpassen."]}], "kontrolle": "Alle acht Kostenstellen erscheinen unter S05-HG (siehe Aufgabe 6).", "falle": "Mussfelder in KS01 laut Folie: Bezeichnung, Verantwortlicher, Art der Kostenstelle, Hierarchiebereich, Währung. «Verantwortlicher» (Text) ist Pflicht, «verantwortlicher Benutzer» nicht.", "q": "Skript S. 15, 62, 81–101; Kurs 19.11."}, {"nr": 6, "t": "Hierarchie S05-HG anzeigen", "sm": true, "worum": "Du kontrollierst, ob alle Gruppen und Kostenstellen an der richtigen Stelle im Baum hängen.", "daten": ["Erwartet: S05-HG → HAUPT05 (RW05, EK05, VT05, PE05) und HILF05 (PKW05, LIT05, REIN05, BILD05)"], "g": [{"h": "Variante A: OKENN", "b": ["OKENN (Standardhierarchie anzeigen, S. 103) → S05-HG wählen → Baum aufklappen."]}, {"h": "Variante B: KSH3", "b": ["KSH3 (Kostenstellengruppe anzeigen, S. 72).", [["Kostenrechnungskreis", "K200", "Controlling-Einheit"], ["Kostenstellengruppe", "S05-HG", "deine Obergruppe"]]]}], "f": [{"h": "App öffnen", "b": ["App «Kostenstellengruppen verwalten» → Standardhierarchie → Name K200 anklicken (nur anzeigen, S. 112) → S05-HG suchen und aufklappen."]}], "kontrolle": "Acht Kostenstellen sichtbar, je vier unter HAUPT05 und HILF05.", "falle": "Rot angezeigte Einträge sind noch nicht gesicherte Änderungen (Folie).", "q": "Skript S. 15, 72, 103, 112; Folie"}, {"nr": 7, "t": "Werkstattrechnung für das Pool-Auto buchen", "sm": true, "worum": "Die Werkstatt hat das Pool-Auto repariert, für CHF 556.29 inklusive MwSt (Mehrwertsteuer). Bezahlt wurde mit der Firmenkreditkarte. Du buchst den Aufwand auf die Kostenstelle des Autos.", "satz": "Reparaturaufwand 62002.05 (Soll, Kostenstelle PKW05, Steuerkennzeichen V1) an Verbindlichkeiten Kreditkarten 22154.05 (Haben)", "daten": ["Rechnung Nr. 8840, KFZ-Werkstatt Ing. Otto Motor (S. 16)", "Netto 514.61 + MwSt 8,1 % 41.68 = CHF 556.29"], "g": [{"h": "Schritt 1: Transaktion öffnen", "b": ["FB50 (Sachkontenbeleg erfassen, S. 174). Buchungskreis B200 kommt aus dem Parameter."]}, {"h": "Schritt 2: Register «Grunddaten»", "b": [[["Belegdatum", "Datum der Rechnung", "so steht es auf dem Papierbeleg"], ["Buchungsdatum", "heute", "bestimmt die Periode"], ["Referenz", "8840", "Rechnungsnummer, damit man den Beleg wiederfindet"], ["Währung", "CHF", "Rechnungswährung"], ["Belegkopftext", "z. B. Reparatur Pool-Auto", "freiwillig"]]]}, {"h": "Schritt 3: Register «Detail»", "b": ["Häkchen bei «Steuer rechnen» setzen (oder schon gesetzt über Parameter XTX, S. 176). Dann rechnet SAP die MwSt aus dem Bruttobetrag selbst heraus."]}, {"h": "Schritt 4: Erfassungsvariante wählen", "b": ["Arbeitsvorlagen → Erfassungsvarianten → STANDARD 3_0100. Grund: Diese Variante zeigt die Spalten Steuer und Kostenstelle (S. 178; Folie)."]}, {"h": "Schritt 5: Zeile 1, Aufwand", "b": [[["Sachkonto", "62002.05", "dein Reparaturkonto aus Aufgabe 3"], ["S/H (Soll/Haben)", "S (Soll)", "Aufwand steht im Soll"], ["Betrag Belegwährung", "556.29", "Bruttobetrag der Rechnung"], ["Steuerkennzeichen", "V1", "Vorsteuer 8,1 %; das Konto erlaubt nur V1"], ["Kostenstelle", "PKW05", "die Kosten gehören zum Pool-Auto"]]]}, {"h": "Schritt 6: Zeile 2, Gegenkonto", "b": [[["Sachkonto", "22154.05", "Schuld bei der Kreditkartenfirma"], ["S/H", "H (Haben)", "Gegenseite der Buchung"], ["Betrag", "556.29 (oder * für den Restbetrag, S. 177)", "gleicher Betrag, damit der Saldo 0 ist"], ["Steuerkennzeichen", "leer", "auf der Gegenseite steht nie ein Steuerkennzeichen (Folie 28)"], ["Kostenstelle", "leer", "Bilanzkonto, kein Controlling"]]]}, {"h": "Schritt 7: Prüfen und buchen", "b": ["«Simulieren»: Die Ampel muss grün sein (Saldo 0).", "Dann «Buchen». Belegnummer notieren."]}], "f": [{"h": "Schritt 1: App öffnen", "b": ["App «Hauptbuchbelege buchen» (S. 181). Die Skript-Aufgabe verlangt diese App."]}, {"h": "Schritt 2: Kopfdaten (S. 183)", "b": [[["Buchungskreis", "B200", "deine Firma"], ["Buchungsbelegdatum", "Datum der Rechnung", "Papierbeleg"], ["Buchungsdatum", "heute", "Periode"], ["Belegart", "SA", "Sachkontenbeleg"], ["Transaktionswährung", "CHF", "Rechnungswährung"], ["Referenz", "8840", "Rechnungsnummer"]]]}, {"h": "Schritt 3: Zeile 1, Aufwand", "b": ["In Fiori gibt es kein Feld S/H, sondern zwei Spalten «Soll» und «Haben» (S. 184).", [["Sachkonto", "62002.05", "Reparaturkonto"], ["Soll", "556.29", "Aufwand"], ["Steuerkennzeichen", "V1", "Vorsteuer 8,1 %"], ["Kostenstelle", "PKW05", "Pool-Auto"]]]}, {"h": "Schritt 4: Zeile 2, Gegenkonto", "b": [[["Sachkonto", "22154.05", "Kreditkartenschuld"], ["Haben", "556.29", "Gegenseite"], ["Steuerkennzeichen", "leer", "nie auf der Gegenseite"]]]}, {"h": "Schritt 5: Buchen", "b": ["«Steuer berechnen» aktivieren, Saldo 0 (grün) → Buchen. Falls 556.29 nicht angenommen wird: Dezimalpunkt in den Einstellungen setzen (Kurs)."]}], "kontrolle": "SAP teilt auf: 514.61 Aufwand auf PKW05 und 41.68 Vorsteuer.", "falle": "Frage «Welche Eingaben gehören in die Positionen?» → Sachkonto, Soll/Haben, Betrag, Steuerkennzeichen, Kostenstelle (Folie 28).", "q": "Skript S. 13, 16, 174–186; Folien 27–29; Kurs 19.11."}, {"nr": 8, "t": "Lieferant Putzteufel anlegen und Rechnung buchen", "sm": false, "worum": "Eine Reinigungsfirma hat 18 Stunden geputzt. Du legst die Firma als Lieferanten an und buchst ihre Rechnung als Reinigungsaufwand auf die Kostenstelle Reinigung.", "satz": "Reinigungsaufwand 62022.05 (Soll, Kostenstelle REIN05, V1) an Lieferant Putzteufel GmbH (Haben)", "daten": ["Putzteufel GmbH, Industriestrasse 14, 8952 Schlieren (S. 17)", "Rechnung Nr. 864: 18 Std. × CHF 25.00 = 450.00 + MwSt 8,1 % 36.45 = CHF 486.45, zahlbar ohne Abzug"], "g": [{"h": "Teil A, Schritt 1: Geschäftspartner öffnen", "b": ["Oben links ins Kommandofeld BP eintippen, Enter (aus einer anderen Transaktion: /nBP). Es öffnet sich «Geschäftspartner bearbeiten» (S. 142).", "Oben die drei Knöpfe Person, Organisation, Gruppe: auf «Organisation» klicken, weil der Lieferant eine Firma ist."]}, {"h": "Teil A, Schritt 2: Grunddaten", "b": [[["Anlegen in GP-Rolle (Geschäftspartnerrolle)", "ZVEND Kreditor/Lieferant zentral", "damit Einkaufs- und Buchhaltungsdaten möglich sind"], ["Gruppierung", "BPCH (interne Nummernvergabe CH)", "SAP vergibt die Nummer selbst"], ["Geschäftspartner (Nummer)", "leer", "wird automatisch vergeben"], ["Name", "Putzteufel GmbH", "laut Rechnung"], ["Strasse / PLZ / Ort", "Industriestrasse 14 / 8952 / Schlieren", "laut Rechnung"], ["Land / Sprache", "CH / DE", "Schweizer Firma"]]]}, {"h": "Teil A, Schritt 3: Buchungskreisdaten B200", "b": [[["Abstimmkonto", "20000", "Pflichtfeld; verbindet den Lieferanten mit dem Hauptbuch (S. 165)"], ["Zahlungsbedingung", "sofort ohne Abzug", "laut Rechnung"]], "Sichern und die neue Nummer notieren."]}, {"h": "Teil B, Schritt 1: Rechnung erfassen", "b": ["FB60 (Eingangsrechnung erfassen, S. 187). Vorgang: Rechnung."]}, {"h": "Teil B, Schritt 2: Register «Grunddaten»", "b": [[["Kreditor", "Nummer von Putzteufel", "wer die Rechnung stellt"], ["Rechnungsdatum", "Datum der Rechnung", "Papierbeleg"], ["Buchungsdatum", "heute", "Periode"], ["Referenz", "864", "Rechnungsnummer"], ["Betrag", "486.45", "Bruttobetrag"], ["Währung", "CHF", ""], ["Steuer rechnen", "Häkchen", "MwSt wird herausgerechnet"]]]}, {"h": "Teil B, Schritt 3: Position (Aufwand)", "b": [[["Sachkonto", "62022.05", "Reinigungskonto aus Aufgabe 3"], ["S/H", "S (Soll)", "Aufwand"], ["Betrag", "486.45", "brutto"], ["Steuerkennzeichen", "V1", "Vorsteuer 8,1 %"], ["Kostenstelle", "REIN05", "Kosten der Reinigung"]], "Die Lieferantenzeile (Haben) erzeugt SAP selbst aus dem Kopf; dort steht kein Steuerkennzeichen."]}, {"h": "Teil B, Schritt 4: Buchen", "b": ["Saldo 0 (grün) → Buchen."]}], "f": [{"h": "Lieferant anlegen", "b": ["App «Lieferantenstammdaten verwalten» → Anlegen (S. 164). Felder wie in Aufgabe 10."]}, {"h": "Rechnung buchen", "b": ["Das Skript beschreibt für diesen Schritt keine Fiori-App. Im Kurs und in der Prüfung gilt der Weg im SAP GUI (grafische Benutzeroberfläche).", "In SAP gibt es dafür z. B. die App «Lieferantenrechnungen erfassen» (allgemeines SAP-Wissen, nicht im Skript und nicht im Übungsheft; im Kurs prüfen)."]}], "kontrolle": "Siehe Aufgabe 9: REIN05 ist mit 450.00 belastet (netto, die Vorsteuer ist kein Aufwand).", "falle": "Auf der Folie heisst die alte Transaktion FK01 (Kreditor anlegen); im Skript wird der Lieferant mit BP angelegt.", "q": "Skript S. 17, 142–172, 187–190; Folie"}, {"nr": 9, "t": "Buchung auf REIN05 kontrollieren", "sm": true, "worum": "Du prüfst die Buchung aus Aufgabe 8 aus allen Blickwinkeln: Beleg der Finanzbuchhaltung, Beleg des Controllings, offene Posten beim Lieferanten, Einzelposten und Bericht der Kostenstelle.", "daten": ["Laut Skript S. 18: FB03, KSB5, FBL1N, KSB1, S_ALR_87013611"], "g": [{"h": "Schritt 1: FI-Beleg (Finanzbuchhaltung)", "b": ["FB03 (Beleg anzeigen, S. 196).", [["Belegnummer", "aus Aufgabe 8", "welcher Beleg"], ["Buchungskreis", "B200", ""], ["Geschäftsjahr", "2026", ""]], "Zum CO-Beleg (Controlling-Beleg): Umfeld → Belegumfeld → Rechnungswesenbelege (S. 198)."]}, {"h": "Schritt 2: CO-Beleg direkt", "b": ["KSB5 (Kostenrechnungsbelege Istkosten anzeigen, S. 199)."]}, {"h": "Schritt 3: Lieferant", "b": ["FBL1N (Lieferanten-Einzelposten, S. 195).", [["Lieferant", "Putzteufel", "wessen Posten"], ["Buchungskreis", "B200", ""], ["Status", "offene Posten", "Rechnung ist noch nicht bezahlt"]]]}, {"h": "Schritt 4: Kostenstelle, Einzelposten", "b": ["KSB1 (Kostenstellen-Einzelposten Ist).", [["Kostenstelle", "REIN05", "die belastete Kostenstelle"], ["Periode / Jahr", "aktuelle Periode, 2026", "Zeitraum"]]]}, {"h": "Schritt 5: Bericht", "b": ["S_ALR_87013611 (Kostenstellen Ist/Plan/Abweichung, S. 348).", [["Kostenrechnungskreis", "K200", ""], ["Geschäftsjahr / Periode", "2026 / aktuelle", ""], ["Kostenstelle oder -gruppe", "REIN05", "Folie: Gruppe statt einzeln eingeben ist eine Variante"]], "Ausführen → Doppelklick auf den Betrag → Einzelposten → Umfeld → Ursprungsbeleg."]}], "f": [{"h": "Beleg", "b": ["App «Buchungsbelege verwalten» (im Skript S. 344 als Sprungziel genannt)."]}, {"h": "Bericht Kostenstelle", "b": ["App «Kostenstellen – Istdaten» (S. 343–344); im Übungsheft F2121 heisst die Berichts-App «Cost Centers Review Booklet»."]}, {"h": "Einzelposten Kostenstelle", "b": ["App «Einzelposten anzeigen – Kostenrechnung» (Display Line Items – Cost Accounting; Übungsheft Übung 13)."]}, {"h": "Lieferanten-Einzelposten", "b": ["Das Skript beschreibt für diesen Schritt keine Fiori-App. Im Kurs und in der Prüfung gilt der Weg im SAP GUI (grafische Benutzeroberfläche). (Fiori-App dafür: allgemeines SAP-Wissen, nicht im Skript und nicht im Übungsheft; im Kurs prüfen)"]}], "kontrolle": "Überall dieselben Zahlen: FI-Beleg 486.45 brutto; REIN05 mit 450.00 belastet; beim Lieferanten 486.45 offen.", "falle": "FB03 zeigt den FI-Beleg (Finanzbuchhaltung), KSB5 den CO-Beleg (Controlling). Vom Bericht kommst du per Doppelklick bis zum Ursprungsbeleg.", "q": "Skript S. 18, 195–199, 343–344, 348–350; Folie; Übungsheft F2121 Übung 13"}, {"nr": 10, "t": "Lieferant S05-Atlas Training in Fiori anlegen", "sm": false, "worum": "Eine Schulungsfirma wird als neuer Lieferant angelegt, diesmal mit der Fiori-App. Später bestellst du bei ihr Skripten und buchst ihre Rechnungen.", "daten": ["Name S05-Atlas Training (ATLAS Training GmbH), Schulhausstrasse 14, 8002 Zürich (S. 19)", "Buchungskreis B200, Einkaufsorganisation E200, Abstimmkonto 20000, sofort zahlbar ohne Abzug, Zahlweg Überweisung"], "g": [{"h": "Gleicher Inhalt mit BP", "b": ["Kommandofeld: BP eintippen, Enter (Geschäftspartner bearbeiten, S. 142) → Knopf «Organisation», Rolle ZVEND, Gruppierung BPCH. Felder wie im Fiori-Teil unten; zusätzlich Einkaufsorganisation E200 mit Bestellwährung CHF. Die Skript-Aufgabe verlangt aber Fiori."]}], "f": [{"h": "Schritt 1: App öffnen", "b": ["App «Lieferantenstammdaten verwalten» → Anlegen (S. 164)."]}, {"h": "Schritt 2: Erstes Bild", "b": [[["Geschäftspartnerkategorie", "Organisation", "Firma, keine Person"], ["Gruppierung", "BPCH (interne Nummernvergabe CH)", "SAP vergibt die Nummer"], ["Geschäftspartner", "leer", "automatisch"], ["Geschäftspartnerrolle", "leer lassen", "ZVEND gibt es in Fiori nicht; die Rollen Lieferant und Kreditor kommen später im Register Rollen dazu (S. 165)"]]]}, {"h": "Schritt 3: Name und Adresse", "b": [[["Anrede", "Firma", ""], ["Name 1", "S05-Atlas Training", "mit Gruppennummer"], ["Strasse", "Schulhausstrasse 14", ""], ["PLZ / Ort", "8002 / Zürich", ""], ["Land / Sprache", "CH / DE", ""]]]}, {"h": "Schritt 4: Organisationsdaten (S. 165)", "b": [[["Einkaufsorganisation", "E200", "damit man bei ihm bestellen kann"], ["Auftragswährung", "CHF", "Bestellwährung"], ["Buchungskreis", "B200", "damit man Rechnungen buchen kann"], ["Abstimmkonto", "20000", "Pflicht; Verbindung zum Hauptbuch"]]]}, {"h": "Schritt 5: Zahlungsdaten", "b": [[["Zahlungsbedingung (Einkaufsorganisation E200)", "0001 sofort zahlbar ohne Abzug", "laut Aufgabe (S. 168)"], ["Zahlweg (Buchungskreis B200)", "Überweisung", "laut Aufgabe (S. 19)"]]]}, {"h": "Schritt 6: Sichern", "b": ["Lieferantennummer notieren."]}], "kontrolle": "Der Lieferant erscheint in der App-Liste mit B200 und E200.", "falle": "Ohne Abstimmkonto kann der Lieferant nicht gesichert werden. Ohne Einkaufsorganisation kann man bei ihm nicht bestellen.", "q": "Skript S. 19, 142–172"}, {"nr": 11, "t": "Rechnung von Atlas Training (SAP-Lehrgang) buchen", "sm": false, "worum": "Atlas Training stellt den SAP-Lehrgang in Rechnung. Du buchst ihn als Ausbildungsaufwand auf die Kostenstelle Ausbildung.", "satz": "Aus- und Fortbildung 58102.05 (Soll, Kostenstelle BILD05, V1) an Lieferant S05-Atlas Training (Haben)", "daten": ["Rechnung Nr. 17071: CHF 2'450.00 + MwSt 8,1 % 198.45 = CHF 2'648.45, zahlbar ohne Abzug (S. 20)"], "g": [{"h": "Schritt 1: Transaktion", "b": ["FB60 (Eingangsrechnung erfassen, S. 187). Vorgang: Rechnung."]}, {"h": "Schritt 2: Register «Grunddaten»", "b": [[["Kreditor", "S05-Atlas Training", "Rechnungssteller"], ["Rechnungsdatum", "laut Rechnung", ""], ["Buchungsdatum", "heute", ""], ["Referenz", "17071", "Rechnungsnummer"], ["Betrag", "2648.45", "brutto"], ["Währung", "CHF", ""], ["Steuer rechnen", "Häkchen", "MwSt wird herausgerechnet"], ["Text", "SAP Lehrgang", "freiwillig"]]]}, {"h": "Schritt 3: Position (Aufwand)", "b": [[["Sachkonto", "58102.05", "Aus- und Fortbildung"], ["S/H", "S (Soll)", "Aufwand"], ["Betrag", "2648.45", "brutto"], ["Steuerkennzeichen", "V1", "Vorsteuer 8,1 %"], ["Kostenstelle", "BILD05", "Ausbildungskosten"]]]}, {"h": "Schritt 4: Buchen", "b": ["Saldo 0 → Buchen. Belegnummer notieren, du brauchst sie in Aufgabe 12."]}], "f": [{"h": "Rechnung buchen", "b": ["Das Skript beschreibt für diesen Schritt keine Fiori-App. Im Kurs und in der Prüfung gilt der Weg im SAP GUI (grafische Benutzeroberfläche).", "Fiori-App für Rechnungen ohne Bestellung: z. B. «Lieferantenrechnungen erfassen» (allgemeines SAP-Wissen, nicht im Skript und nicht im Übungsheft; im Kurs prüfen)."]}], "kontrolle": "BILD05 ist mit 2'450.00 belastet (netto).", "falle": "Die Kosten landen zuerst auf BILD05 (Ausbildung) und werden erst in Aufgabe 12 auf RW05 umgebucht.", "q": "Skript S. 20–21, 187–190"}, {"nr": 12, "t": "Ausbildungskosten von BILD05 auf RW05 umbuchen", "sm": false, "worum": "Der Lehrgang war für das Rechnungswesen. Deshalb verschiebst du die Kosten aus Aufgabe 11 von der Kostenstelle Ausbildung auf die Kostenstelle Rechnungswesen, mit Bezug auf den ursprünglichen Beleg.", "satz": "Kostenstelle RW05 belastet, Kostenstelle BILD05 entlastet, je 2'450.00 auf Kostenart 58102.05", "daten": ["Sender BILD05, Empfänger RW05, Bezug: Beleg aus Aufgabe 11 (S. 21)"], "g": [{"h": "Schritt 1: Transaktion", "b": ["KB61 (Einzelpostenumbuchung, S. 264). «Einzelposten» heisst: Du nimmst eine bestimmte Buchung und hängst sie um."]}, {"h": "Schritt 2: Beleg auswählen", "b": [[["Belegnummer", "FI-Beleg aus Aufgabe 11", "welche Buchung umgehängt wird"], ["Buchungskreis", "B200", ""], ["Geschäftsjahr", "2026", ""], ["Kostenart / Kostenstelle (freiwillig)", "58102.05 / BILD05", "engt die Auswahl ein"]], "Ausführen."]}, {"h": "Schritt 3: Neue Kostenstelle eintragen", "b": [[["Kostenstelle (neu)", "RW05", "Rechnungswesen trägt die Kosten"], ["Betrag", "2450.00", "ganzer Nettobetrag"]]]}, {"h": "Schritt 4: Buchen", "b": ["Senderverprobung: SAP prüft, ob die Kosten wirklich auf BILD05 gebucht waren. Der FI-Beleg bleibt unverändert (dort steht weiter BILD05)."]}], "f": [{"h": "Umbuchen", "b": ["App «Kosten und Erlöse neu zuordnen» (Reassign Costs and Revenues; Übungsheft F2121 Übung 15).", [["Sachkonto", "58102.05", "Kostenart"], ["Sender-Kostenstelle", "BILD05", "gibt ab"], ["Empfänger-Kostenstelle", "RW05", "erhält"], ["Betrag", "2450.00", ""]], "Achtung, meine Zuordnung: So gebucht wirkt es wie KB11N, ohne Bezug zum Ursprungsbeleg. Das Skript zeigt hier nur KB61."]}], "kontrolle": "BILD05 steht auf 0, RW05 hat +2'450.00.", "falle": "KB61 = mit Bezug auf einen Beleg und mit Senderverprobung. KB11N = ohne Belegbezug, ohne Senderverprobung (S. 257, 263).", "q": "Skript S. 21, 257, 263–266; Übungsheft F2121 Übung 15"}, {"nr": 13, "t": "Skripten bei Atlas Training bestellen und Obligo prüfen", "sm": true, "worum": "Du bestellst 35 Skripten für die Kostenstelle Fachliteratur. Schon mit der Bestellung entsteht ein Obligo (Verpflichtung, Kosten sind «reserviert»), das du im Controlling sehen kannst.", "daten": ["10 BT + 6 PT + 4 ST + 7 FT + 3 CT + 5 ET = 35 Skripten à CHF 15.00 = 525.00 netto (S. 21)", "Lieferung in 14 Tagen, Warengruppe Sonstiges, Werk W210", "Sachkonto 65032.05, Kostenstelle LIT05, Steuerkennzeichen V2 (2,6 %, Bücher)"], "g": [{"h": "Schritt 1: Transaktion", "b": ["ME21N (Bestellung anlegen, S. 209)."]}, {"h": "Schritt 2: Kopf", "b": [[["Belegart", "NB Normalbestellung", "normale Bestellung"], ["Lieferant", "S05-Atlas Training", "bei wem bestellt wird"], ["Einkaufsorganisation", "E200", "aus Parameter"], ["Einkäufergruppe", "S05", "aus Parameter"], ["Buchungskreis", "B200", "aus Parameter"]]]}, {"h": "Schritt 3: Positionen (je Skriptum eine Zeile)", "b": [[["K (Kontierungstyp)", "K", "K = Kostenstelle; die Ware wird direkt verbraucht"], ["Material", "leer", "kein Lagermaterial"], ["Kurztext", "z. B. SAP CP BT Skriptum", "beschreibt die Ware"], ["Bestellmenge", "10 (bzw. 6, 4, 7, 3, 5)", "laut Aufgabe"], ["Bestellmengeneinheit", "ST (Stück)", ""], ["Lieferdatum", "in 14 Tagen", "laut Aufgabe"], ["Nettopreis", "15", "Preis pro Stück"], ["Warengruppe", "Sonstiges", "laut Aufgabe"], ["Werk", "W210", "Lieferort"]]]}, {"h": "Schritt 4: Positionsdetail, Register «Kontierung»", "b": [[["Sachkonto", "65032.05", "Fachliteratur"], ["Kostenstelle", "LIT05", "wer die Kosten trägt"]]]}, {"h": "Schritt 5: Positionsdetail, Steuer", "b": [[["Steuerkennzeichen", "V2", "2,6 % für Bücher (S. 215)"]]]}, {"h": "Schritt 6: Sichern", "b": ["Bestellnummer notieren."]}, {"h": "Schritt 7: Obligo prüfen", "b": ["ME23N (Bestellung anzeigen) → Umfeld → Belegposition → RW-Obligobelege (S. 219), oder Bericht S_ALR_87013620 (Kostenstellen Ist/Plan/Obligo, S. 220)."]}], "f": [{"h": "Schritt 1: App", "b": ["App «Bestellungen verwalten» → Anlegen (S. 227)."]}, {"h": "Schritt 2: Allgemeine Informationen", "b": [[["Bestellart", "Normalbestellung (NB)", ""], ["Lieferant", "S05-Atlas Training", ""], ["Einkaufsorganisation / Buchungskreis / Währung", "E200 / B200 / CHF", "kommen aus dem Lieferanten"], ["Einkäufergruppe", "S05", ""]]]}, {"h": "Schritt 3: Positionen → Anlegen (S. 229)", "b": [[["Kurztext", "z. B. SAP CP BT Skriptum", ""], ["Warengruppe", "Sonstiges", ""], ["Werk", "W210", "Pflicht"], ["Bestellmenge", "10 usw.", ""], ["Bestellnettopreis", "15", ""], ["Preiseinheit", "1", "Preis gilt pro 1 Stück"]]]}, {"h": "Schritt 4: Positionsdetails", "b": [[["Kontierungstyp", "K", "Kostenstelle"], ["Sachkonto", "65032.05", ""], ["Kostenstelle", "LIT05", ""], ["Steuerkennzeichen", "V2", "Bücher"]]]}, {"h": "Schritt 5: Bestellen und Obligo prüfen", "b": ["Bestellen. Danach in der Bestellung den Knopf «Obligos anzeigen» drücken (S. 226)."]}], "kontrolle": "Obligo auf LIT05: 525.00. Noch kein Ist (keine echten Kosten), weil die Ware noch nicht da ist.", "falle": "Die Folie zeigt alte Werte W110/E100. Massgebend ist das Skript: W210/E200.", "q": "Skript S. 21, 209–231; Folie"}, {"nr": 14, "t": "Wareneingang zur Bestellung buchen", "sm": false, "worum": "Die Skripten sind angekommen. Mit dem Wareneingang werden die Kosten auf LIT05 zu echten Istkosten, und das Obligo wird abgebaut.", "satz": "Fachliteratur 65032.05 (Kostenstelle LIT05) an WE/RE-Verrechnungskonto (Wareneingang/Rechnungseingang), 525.00 (Kontenlogik S. 240, 254)", "daten": ["Belastung LIT05: CHF 525.00 = 35 × 15 (meine Rechnung; Vorsteuer ist kein Aufwand) (S. 22)"], "g": [{"h": "Schritt 1: Transaktion", "b": ["MIGO (Warenbewegung, S. 232)."]}, {"h": "Schritt 2: Oben links auswählen", "b": [[["Vorgang", "A01 Wareneingang", "was du tust"], ["Referenz", "R01 Bestellung", "worauf du dich beziehst"], ["Bestellnummer", "aus Aufgabe 13", "welche Bestellung"]], "Enter. Die Bewegungsart wird aus dem Vorgang vorgeschlagen (S. 232)."]}, {"h": "Schritt 3: Positionen bestätigen", "b": ["Bei jeder Position das Kästchen «Position OK» anhaken (mindestens eine)."]}, {"h": "Schritt 4: Prüfen und buchen", "b": []}], "f": [{"h": "Schritt 1: App", "b": ["App «Wareneingang zu Einkaufsbeleg buchen» (S. 237).", [["Einkaufsbeleg", "Bestellnummer aus Aufgabe 13", "welche Bestellung"]]]}, {"h": "Schritt 2: Positionen prüfen und buchen", "b": [[["Menge", "35 (verteilt auf 6 Positionen)", "alles geliefert"], ["Lagerort", "LO05", "Kurs"]]]}], "kontrolle": "Materialbeleg → Rechnungswesenbelege: LIT05 ist mit 525.00 belastet, das Obligo ist weg.", "falle": "Bei einer kontierten Bestellung (Kontierung K) entsteh uptledger"], ["Buchungskreis", "B200", ""], ["Gültig von", "01.01.2026", ""], ["Ist/Plan", "Ist", ""]]]}, {"h": "Schritt 2: Segment anlegen (S. 329–331)", "b": [[["Register Regeln: Senderregel", "Gebuchte Beträge", ""], ["Senderanteil", "100 %", ""], ["Empfängerregel", "Variable Anteile", ""], ["Register Sender", "Kostenstelle REIN05, Kostenart 62022.05", "Reinigungskosten"], ["Register Empfänger", "EK05, VT05, PE05, RW05", ""], ["Register Empfängerbasis", "statistische Kennzahl RAUM05", "Quadratmeter"]], "Zyklus prüfen, Sichern."]}, {"h": "Schritt 3: Ausführen", "b": ["App «Verrechnungen ausführen» (S. 338): Zyklus REIN05 hinzufügen → Testlauf → Protokoll prüfen → Echtlauf."]}], "kontrolle": "PKW05 und REIN05 stehen auf 0. Verteilung siehe Aufgabe 20.", "falle": "Periodische Umbuchung (KSW5): Der Sender bekommt keinen eigenen Entlastungssatz, er wird mit Minus auf derselben Kostenart bebucht. Verteilung (KSV5): Der Sender bekommt einen eigenen Entlastungssatz. Bei beiden bleibt die Primärkostenart erhalten (Folie; S. 273).", "q": "Skript S. 27, 272–346; Folie"}, {"nr": 20, "t": "Istkosten und Über-/Unterdeckung notieren", "sm": false, "worum": "Zum Schluss liest du im Bericht ab, wie viel Kosten jede Kostenstelle nach allen Buchungen trägt.", "daten": ["Erwartete Werte: meine Rechnung aus den Fallstudien-Daten, netto ohne Vorsteuer. Deine echten Werte weichen ab, wenn im Kurs etwas anders gebucht wurde."], "tabelle": [["Kostenstelle", "aus PKW05 (km)", "aus REIN05 (m²)", "aus LIT05", "aus BILD05", "Ist total"], ["EK05", "79.53", "100.00", "120.00", "–", "299.53"], ["VT05", "381.12", "47.50", "90.00", "–", "518.62"], ["PE05", "43.24", "57.50", "105.00", "–", "205.74"], ["RW05", "10.72", "245.00", "210.00", "2'450.00", "2'915.72"], ["PKW05, REIN05, LIT05, BILD05", "", "", "", "", "0.00"], ["Summe S05-HG", "514.61", "450.00", "525.00", "2'450.00", "3'939.61"]], "g": [{"h": "Schritt 1: Bericht starten", "b": ["S_ALR_87013611 (Kostenstellen: Ist/Plan/Abweichung, S. 348) let lsMode='gui',lsOpen=new Set();
function renderLoes(){
 app.innerHTML=`<div class="card"><b>Lösungen zu den 20 Skript-Aufgaben</b><p class="muted">Pro Aufgabe: worum es geht, die Daten, dann Schritt für Schritt mit Tabellen «Feld | Was eintragen | Warum», im SAP GUI oder in Fiori, dazu Kontrolle und Prüfungsfalle. 05 = deine Gruppennummer (im Skript ##). Seitenzahlen sind anklickbar (Skript-Ansicht). 🙂 = Smiley-Folie des Trainers. Wo Folie und Skript sich widersprechen, gilt das Skript. Was nicht im Skript steht, ist als Kurs, Folie oder «meine Rechnung» gekennzeichnet.</p>
 <div class="seg"><button id="lsg" class="${lsMode==='gui'?'on':''}">SAP GUI</button><button id="lsf" class="${lsMode==='fiori'?'on':''}">Fiori</button><button id="lsb" class="${lsMode==='beide'?'on':''}">Beide</button></div>
 <div class="row" style="margin-top:6px"><button class="btn sec" id="lsall">Alle aufklappen</button><button class="btn sec" id="lsnone">Alle zuklappen</button></div></div>`+
 LOES.map(a=>{const P=x=>pageLinks(esc(x));
  const tb=(rows,hd)=>`<div class="tw"><table class="lt"><tr>${(hd||['Feld','Was eintragen','Warum']).map(x=>`<th>${esc(x)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i===1&&!hd?' class="v"':''}>${P(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
  const st=s=>s.map(x=>`<div class="stp"><div class="sh">${esc(x.h)}</div>${x.b.map(y=>Array.isArray(y)?tb(y):`<p>${P(y)}</p>`).join('')}</div>`).join('');
  const g=`<div class="side"><div class="sideh">SAP GUI</div><p class="muted">Transaktion öffnen: oben links ins Kommandofeld (weisses Feld neben dem grünen Häkchen) den Code eintippen, z. B. BP, dann Enter. Bist du schon in einer anderen Transaktion: /n vor den Code, z. B. /nBP (Skript S. 40).</p>${st(a.g)}</div>`,f=`<div class="side"><div class="sideh">Fiori</div><p class="muted">App öffnen: im Fiori Launchpad oben auf die Suche (Lupe) tippen, den App-Namen eingeben und die App anklicken (Folie 29).</p>${st(a.f)}</div>`;
  return `<details class="ls" data-n="${a.nr}" ${lsOpen.has(a.nr)?'open':''}><summary>Aufgabe ${a.nr}: ${esc(a.t)} ${a.sm?'<span class="tag sm">🙂</span>':''}</summary><div class="lsb">
  <div class="sh">Worum geht es?</div><p>${P(a.worum)}</p>
  ${a.satz?`<div class="sh">Buchungssatz in Worten</div><p>${P(a.satz)}</p>`:''}
  <div class="sh">Daten</div><ul>${a.daten.map(x=>`<li>${P(x)}</li>`).join('')}</ul>
  ${a.tabelle?tb(a.tabelle.slice(1),a.tabelle[0]):''}
  ${lsMode==='gui'?g:lsMode==='fiori'?f:g+f}
  <div class="kb"><div class="sh">✔ Kontrolle</div><p>${P(a.kontrolle)}</p></div>
  <div class="fb"><div class="sh">⚠ Prüfungsfalle</div><p>${P(a.falle)}</p></div>
  <div class="muted">Quelle: ${P(a.q)}</div></div></details>`;}).join('');
 document.querySelectorAll('details.ls').forEach(d=>d.addEventListener('toggle',()=>{const n=+d.dataset.n;d.open?lsOpen.add(n):lsOpen.delete(n);}));
 $('#lsg').onclick=()=>{lsMode='gui';renderLoes();};$('#lsf').onclick=()=>{lsMode='fiori';renderLoes();};$('#lsb').onclick=()=>{lsMode='beide';renderLoes();};
 $('#lsall').onclick=()=>{LOES.forEach(a=>lsOpen.add(a.nr));renderLoes();};$('#lsnone').onclick=()=>{lsOpen.clear();renderLoes();};}
// ---- Fortschritt ----
function renderStats(){
 const rows=Object.keys(DATA.parts).map(p=>{const ids=DATA.questions.filter(x=>x.p===p).map(x=>x.id);const c=counts('q',ids);return `<tr><td>${p} · ${DATA.parts[p]}</td><td>${ids.length}</td><td>${c[3]}</td><td>${c[2]}</td><td>${c[1]}</td><td>${c[0]}</td></tr>`;}).join('');
 const ex=S.exams.slice(-10).reverse().map(e=>`<tr><td>${new Date(e.t).toLocaleString('de-CH')}</td><td>${e.p} %</td></tr>`).join('');
 const wrong=DATA.questions.filter(x=>box('q',x.id)===1).map(x=>x.id);
 app.innerHTML=`<div class="card"><b>Fragen nach Teil</b><table><tr><th>Teil</th><th>Total</th><th>sicher</th><th>1× richtig</th><th>falsch</th><th>neu</th></tr>${rows}</table>
 <p class="muted">„sicher“ = zweimal hintereinander gewusst. Deine Fehlerliste: ${wrong.length?wrong.join(', '):'leer'}</p></div>
 <div class="card"><b>Letzte Prüfungssimulationen</b>${ex?`<table><tr><th>Datum</th><th>Ergebnis</th></tr>${ex}</table>`:'<p class="muted">Noch keine.</p>'}</div>
 <div class="card"><b>Fortschritt zurücksetzen</b><p class="muted">Löscht alle gespeicherten Ergebnisse in diesem Browser.</p><div class="row"><button class="btn sec" id="rs">Zurücksetzen</button><span id="rsq" class="hide">Wirklich? <button class="btn bad" id="rsy">Ja, löschen</button></span></div></div>`;
 $('#rs').onclick=()=>$('#rsq').classList.remove('hide');
 $('#rsy').onclick=()=>{S={q:{},c:{},exams:[]};save();renderStats();};}
show('start');
skriptInit();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
