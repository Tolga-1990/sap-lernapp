try{anLang=localStorage.getItem('sap_anl_lang')||'de';}catch(e){}
const ANT={de:{h:'Schritt-für-Schritt-Anleitungen je Transaktion',i:'Für jede Transaktion aus dem Kurs: wozu sie dient, wie du sie öffnest und was du Schritt für Schritt eingibst, im SAP GUI und in Fiori. Grundlage ist das Skript (Seitenzahlen anklickbar), ergänzt um Hinweise des Trainers. Englische Menü- und App-Namen sind meine Übersetzung, ausser wo «F2121» steht (SAP-Übungsheft); das Kurssystem war deutsch.',
  all:'Alle aufklappen',none:'Alle zuklappen',both:'Beide',b:'Bereich',alle:'alle',z:'Wozu?',tip:'⚠ Achtung / Prüfung',src:'Quelle',sol:'Ausführlich mit Kursdaten: Lösung Aufgabe'},
 en:{h:'Step-by-step guides per transaction',i:'For every transaction from the course: what it is for, how to open it and what to enter step by step, in SAP GUI and in Fiori. Based on the course script (page numbers clickable), plus the trainer\'s hints. English menu and app names are my translation unless marked «F2121» (SAP exercise book); the course system was German.',
  all:'Expand all',none:'Collapse all',both:'Both',b:'Area',alle:'all',z:'What for?',tip:'⚠ Watch out / exam',src:'Source',sol:'In detail with course data: solution task'}};
const ANB={Einstellungen:'Settings',Stammdaten:'Master data',Buchen:'Postings','Periodenabschluss':'Period-end closing',Berichte:'Reports'};
function openTask(nr){lsOpen=new Set([nr]);fromSearch=true;show('loes');setTimeout(()=>{const d=document.querySelector(`details.ls[data-n="${nr}"]`);if(!d)return;const head=document.querySelector('header');const off=(head&&getComputedStyle(head).position==='sticky')?head.offsetHeight+8:8;window.scrollTo(0,d.getBoundingClientRect().top+window.scrollY-off);d.classList.add('flash');setTimeout(()=>d.classList.remove('flash'),1600);},60);}
function openAn(c){anOpen=new Set([c]);anB='alle';fromSearch=true;show('anl');
 setTimeout(()=>{const d=[...document.querySelectorAll('details.an')].find(x=>x.dataset.c===c);if(!d)return;const head=document.querySelector('header');const off=(head&&getComputedStyle(head).position==='sticky')?head.offsetHeight+8:8;window.scrollTo(0,d.getBoundingClientRect().top+window.scrollY-off);d.classList.add('flash');setTimeout(()=>d.classList.remove('flash'),1600);},60);}
function renderAnl(){const T=ANT[anLang],L=anLang,P=x=>pageLinks(esc(x));
 const bs=[...new Set(ANL.map(a=>a.b))];
 const list=ANL.filter(a=>anB==='alle'||a.b===anB);
 app.innerHTML=backBtn()+`<div class="card"><b>${T.h}</b><p class="muted">${T.i}</p>
 <div class="seg"><button id="anDE" class="${L==='de'?'on':''}">Deutsch</button><button id="anEN" class="${L==='en'?'on':''}">English</button></div>
 <div class="seg"><button id="ang" class="${anMode==='gui'?'on':''}">SAP GUI</button><button id="anf" class="${anMode==='fiori'?'on':''}">Fiori</button><button id="anb" class="${anMode==='beide'?'on':''}">${T.both}</button></div>
 <div class="row" style="margin-top:6px"><label>${T.b}: <select id="anB"><option value="alle">${T.alle} (${ANL.length})</option>${bs.map(b=>`<option value="${esc(b)}" ${anB===b?'selected':''}>${esc(L==='en'?ANB[b]||b:b)} (${ANL.filter(a=>a.b===b).length})</option>`).join('')}</select></label>
 <button class="btn sec" id="anall">${T.all}</button><button class="btn sec" id="annone">${T.none}</button></div></div>`+
 list.map(a=>{const d=a[L];
  const g=`<div class="side"><div class="sideh">SAP GUI</div><ol>${d.g.map(x=>`<li>${P(x)}</li>`).join('')}</ol></div>`;
  const f=`<div class="side"><div class="sideh">Fiori</div><ol>${d.f.map(x=>`<li>${P(x)}</li>`).join('')}</ol></div>`;
  return `<details class="ls an" data-c="${esc(a.c)}" ${anOpen.has(a.c)?'open':''}><summary><span class="tag">${esc(a.c)}</span> ${esc(d.t)}</summary><div class="lsb">
  <div class="sh">${T.z}</div><p>${P(d.z)}</p>
  ${anMode==='gui'?g:anMode==='fiori'?f:g+f}
  ${d.tip?`<div class="fb"><div class="sh">${T.tip}</div><p>${P(d.tip)}</p></div>`:''}
  ${a.auf.length?`<div class="row">${a.auf.map(n=>`<button class="btn sec" style="padding:3px 10px;font-size:13px" onclick="openTask(${n})">${T.sol} ${n}</button>`).join('')}</div>`:''}
  <div class="muted">${T.src}: ${P(a.s)}</div></div></details>`;}).join('');
 document.querySelectorAll('details.an').forEach(d=>d.addEventListener('toggle',()=>{const c=d.dataset.c;d.open?anOpen.add(c):anOpen.delete(c);}));
 const setL=l=>{anLang=l;try{localStorage.setItem('sap_anl_lang',l);}catch(e){}renderAnl();};
 $('#anDE').onclick=()=>setL('de');$('#anEN').onclick=()=>setL('en');
 $('#ang').onclick=()=>{anMode='gui';renderAnl();};$('#anf').onclick=()=>{anMode='fiori';renderAnl();};$('#anb').onclick=()=>{anMode='beide';renderAnl();};
 $('#anB').onchange=e=>{anB=e.target.value;renderAnl();};
 $('#anall').onclick=()=>{list.forEach(a=>anOpen.add(a.c));renderAnl();};$('#annone').onclick=()=>{anOpen.clear();renderAnl();};}
// ---- Fortschritt ----
function renderStats(){
 const rows=Object.keys(DATA.parts).map(p=>{const ids=DATA.questions.filter(x=>x.p===p).map(x=>x.id);const c=counts('q',ids);return `<tr><td>${p} · ${DATA.parts[p]}</td><td>${ids.length}</td><td>${c[3]}</td><td>${c[2]}</td><td>${c[1]}</td><td>${c[0]}</td></tr>`;}).join('');
 const ex=S.exams.slice(-10).reverse().map(e=>`<tr><td>${new Date(e.t).toLocaleString('de-CH')}</td><td>${e.p} %</td></tr>`).join('');
 const wrong=DATA.questions.filter(x=>box('q',x.id)===1).map(x=>x.id);
 app.innerHTML=`<div class="card"><b>Fragen nach Teil</b><table><tr><th>Teil</th><th>Total</th><th>sicher</th><th>1× richtig</th><th>falsch</th><th>neu</th></tr>${rows}</table>
 <p class="muted">„sicher“ = zweimal hintereinander gewusst. Deine Fehlerliste: ${wrong.length?wrong.join(', '):'leer'}</p></div>
 <div class="card"><b>Letzte Prüfungssimulationen</b>${ex?`<table><tr><th>Datum</th><th>Ergebnis</th></tr>${ex}</table>`:'<p class="muted">Noch keine.</p>'}</div>
 <div class="card"><b>Fortschritt zurücksetzen</b><p class="muted">Löscht alle gespeicherten Ergebnisse in diesem Browser.</p><div class="row"><button class="btn sec" id="rs">Zurücksetzen</button><span id="rsq" class="hide">Wirklich? <button class="btn bad" id="rsy">Ja, löschen</button></span></div></div>`;
 $('#rs').onclick=()=>$('#rsq').classList.remove('hide');
 $('#rsy').onclick=()=>{S={q:{},c:{},exams:[]};save();renderStats();};}
show('start');
skriptInit();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
