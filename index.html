<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAP CP Controlling – Lern-App</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f5fbf">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SAP Lernen">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--muted:#5d6675;--line:#dde1e7;--acc:#1f5fbf;--ok:#1e8a4c;--bad:#c0392b;--warn:#b7791f}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--ink:#e8ebf0;--muted:#9aa3b2;--line:#2e343e;--acc:#6ea2ff;--ok:#4cc483;--bad:#ff7a6b;--warn:#f0b75a}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0 0 8px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:7px 12px;border-radius:8px;font-size:14px;cursor:pointer}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.muted{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);margin-right:6px;color:var(--muted)}
.tag.fs{border-color:var(--acc);color:var(--acc)}
.tag.sm{border-color:#1f5fbf;background:#1f5fbf;color:#fff}
mark{background:#ffe08a;color:#000;border-radius:3px;padding:0 2px}
.hit{border-top:1px solid var(--line);padding:8px 0;font-size:14px}
details.ls{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.ls>summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none}
details.ls>summary::-webkit-details-marker{display:none}
details.ls[open]>summary{border-bottom:1px solid var(--line)}
.lsb{padding:12px 16px}
.lsb ol,.lsb ul{margin:6px 0 10px;padding-left:22px}
.lsb li{margin:4px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:6px 0}
.seg button{border:0;padding:7px 14px;background:var(--bg);color:var(--ink);cursor:pointer;font-size:14px}
.seg button.on{background:var(--acc);color:#fff}
#pv{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column}
.pvbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px;border-bottom:1px solid var(--line);background:var(--card)}
.pvbar .btn{padding:8px 12px}
#pvc{flex:1;overflow:auto;text-align:center;padding:8px}
#pvcv{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
a.pl{color:var(--acc);font-weight:600}
input[type=search]{width:100%;font-size:16px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.q{font-size:18px;font-weight:600;margin:10px 0}
.a{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px;font-size:16px}
.big{font-size:32px;font-weight:700;letter-spacing:.5px;margin:12px 0;word-break:break-all}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button.btn{border:0;border-radius:8px;padding:11px 16px;font-size:15px;cursor:pointer;background:var(--acc);color:#fff}
button.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
button.btn.ok{background:var(--ok)}
button.btn.bad{background:var(--bad)}
select,label{font-size:14px}
select{padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.hide{display:none}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer;font-size:15px}
.opt input{margin-top:4px;transform:scale(1.2)}
.opt.sel{border-color:var(--acc)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.hint{font-size:13px;color:var(--warn);font-weight:600}
.res{font-weight:700;margin-top:8px}
.stp{margin:.6em 0 .2em}.sh{font-weight:700;margin:.7em 0 .25em}.side{border-left:4px solid var(--acc);padding-left:.7em;margin:.8em 0}.sideh{font-weight:800;font-size:1.05em;color:var(--acc)}
.tw{overflow-x:auto}table.lt{border-collapse:collapse;width:100%;margin:.3em 0;font-size:.93em}table.lt th,table.lt td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}table.lt th{background:var(--bg)}td.v{font-weight:700}
.kb{border-left:4px solid var(--ok);background:var(--bg);border-radius:6px;padding:2px 8px;margin:.6em 0}.fb{border-left:4px solid var(--warn);background:var(--bg);border-radius:6px;padding:2px 8px;margin:.6em 0}.lsb p{margin:.25em 0}
ul.fl{margin:.2em 0 .4em 1.1em;padding-left:.8em;list-style:disc}ul.fl li{margin:.1em 0}
</style>
</head>
<body>
<header>
  <h1>SAP CP (Competence Pass) Controlling – Lern-App</h1>
  <nav>
    <button data-v="start" class="on">Start</button>
    <button data-v="quiz">Quiz</button>
    <button data-v="cards">Karteikarten</button>
    <button data-v="exam">Prüfungssimulation</button>
    <button data-v="loes">Lösungen</button>
    <button data-v="search">Suche</button>
    <button id="navsk">Skript</button>
    <button data-v="stats">Fortschritt</button>
  </nav>
</header>
<main id="app"></main>
<script>
const DATA={"parts": {"A": "Grundlagen, Fiori und Organisationseinheiten", "B": "Stammdaten", "C": "Buchungen und Beschaffung", "D": "Werteflüsse und Periodenabschluss", "E": "Berichtswesen", "F": "Bildschirmaufgaben", "K": "Kurs 19.11.: Aufgaben 1–7 wie im Kurs gezeigt", "L": "Kurs-Mitschnitt 19.11. und Skript-Fallstudie Aufgaben 8–20"}, "questions": [{"id": "A1", "p": "A", "q": "Was bedeuten „S“, „4“ und „HANA“ in SAP S/4HANA (aktuelle SAP-Software)?", "a": "S = Simple, 4 = vierte Produktgeneration, HANA = High Performance Analytic Appliance (3)", "o": [{"t": "S = Simple, 4 = vierte Produktgeneration, HANA = High Performance Analytic Appliance", "r": true}, {"t": "S = Standard, 4 = vierte Version von R/3, HANA = High Availability Network Architecture", "r": false}, {"t": "S = Suite, 4 = vier Module (FI, CO, MM, SD), HANA = High Performance Analytic Appliance", "r": false}, {"t": "S = Simple, 4 = vierte Datenbankgeneration, HANA = Hybrid Application Network", "r": false}]}, {"id": "A2", "p": "A", "q": "Welche Produktgenerationen gingen S/4HANA (aktuelle SAP-Software) voraus?", "a": "SAP R/2 (frühere SAP-Generation), R/3 (frühere SAP-Generation) und ERP (Unternehmenssoftware: Business Suite mit ECC, dem Vorgänger von S/4HANA) (3)", "o": [{"t": "SAP R/2", "r": true}, {"t": "SAP R/3", "r": true}, {"t": "SAP ERP (Business Suite mit ECC)", "r": true}, {"t": "SAP Business One", "r": false}]}, {"id": "A3", "p": "A", "q": "Was besagt das Principle of One?", "a": "Für eine Anforderung gibt es idealerweise nur einen Lösungsansatz, inhaltlich und technisch (3)", "o": [{"t": "Für eine Anforderung gibt es idealerweise nur einen Lösungsansatz, inhaltlich und technisch", "r": true}, {"t": "Jeder Benutzer hat genau eine Rolle im System", "r": false}, {"t": "Jede Transaktion hat genau eine Fiori-App", "r": false}, {"t": "Ein Mandant hat genau einen Buchungskreis", "r": false}]}, {"id": "A4", "p": "A", "q": "Nenne zwei Unterschiede zwischen On-Premises und Cloud.", "a": "On-Premises läuft auf eigener Hardware und ist voll anpassbar. Die Cloud ist SaaS (Software as a Service, Software zur Miete) ohne eigene Hardware, aber vor allem in der Public Cloud nur begrenzt anpassbar (3)", "o": [{"t": "On-Premises läuft auf eigener Hardware und ist voll anpassbar", "r": true}, {"t": "Die Cloud ist SaaS (Software zur Miete) ohne eigene Hardware", "r": true}, {"t": "Vor allem in der Public Cloud sind die Anpassungsmöglichkeiten begrenzt", "r": true}, {"t": "In der Cloud lassen sich kundenspezifische Änderungen sofort und in vollem Umfang umsetzen", "r": false}]}, {"id": "A5", "p": "A", "q": "Wer sind die Adressaten des externen und des internen Rechnungswesens?", "a": "Extern (FI = Finanzbuchhaltung): Eigentümer, Finanzbehörde, Gläubiger. Intern (CO = Controlling): Geschäftsleitung und Führungskräfte (4.1)", "o": [{"t": "Extern (FI = Finanzbuchhaltung): Eigentümer, Finanzbehörde, Gläubiger", "r": true}, {"t": "Intern (CO = Controlling): Geschäftsleitung und Führungskräfte", "r": true}, {"t": "Extern (FI = Finanzbuchhaltung): nur die Geschäftsleitung", "r": false}, {"t": "Intern (CO = Controlling): vor allem die Finanzbehörde", "r": false}]}, {"id": "A6", "p": "A", "q": "Was ist das Hauptziel des internen Rechnungswesens?", "a": "Die Wirtschaftlichkeit der Leistungserstellung zu überwachen (4.1)", "o": [{"t": "Die Wirtschaftlichkeit der Leistungserstellung überwachen", "r": true}, {"t": "Den gesetzlichen Jahresabschluss erstellen", "r": false}, {"t": "Die Zahlungsfähigkeit gegenüber Gläubigern nachweisen", "r": false}, {"t": "Die Steuerlast des Unternehmens berechnen", "r": false}]}, {"id": "A7", "p": "A", "q": "Was bedeutet Mitbuchtechnik?", "a": "Jede Buchung in einem Nebenbuch erzeugt automatisch die passende Buchung im Hauptbuch (4.2)", "o": [{"t": "Jede Buchung in einem Nebenbuch erzeugt automatisch die passende Buchung im Hauptbuch", "r": true}, {"t": "Jede FI-Buchung erzeugt automatisch eine Buchung im Nebenbuch", "r": false}, {"t": "Eine Buchung wird von zwei Benutzern gemeinsam erfasst", "r": false}, {"t": "CO-Buchungen werden nachträglich ins FI übertragen", "r": false}]}, {"id": "A8", "p": "A", "q": "Nenne die drei Hauptkomponenten des CO (Controlling).", "a": "CO-OM Gemeinkostenrechnung, CO-PC Produktkostenrechnung, CO-PA Ergebnis- und Marktsegmentrechnung (4.3)", "o": [{"t": "CO-OM Gemeinkostenrechnung", "r": true}, {"t": "CO-PC Produktkostenrechnung", "r": true}, {"t": "CO-PA Ergebnis- und Marktsegmentrechnung", "r": true}, {"t": "FI-AA Anlagenbuchhaltung", "r": false}]}, {"id": "A9", "p": "A", "q": "Welche Bereiche gehören zur Gemeinkostenrechnung?", "a": "Kostenartenrechnung, Kostenstellenrechnung, Innenaufträge (4.3)", "o": [{"t": "Kostenartenrechnung", "r": true}, {"t": "Kostenstellenrechnung", "r": true}, {"t": "Innenaufträge", "r": true}, {"t": "Produktkostenrechnung", "r": false}]}, {"id": "A10", "p": "A", "q": "Was ist das Universal Journal, und wie heisst seine Tabelle?", "a": "Gemeinsame Datenhaltung für FI (Finanzbuchhaltung) und CO (Controlling) in der Tabelle ACDOCA (Universal Journal, zentrale Buchungstabelle), die „Single Source of Truth“ (4.4)", "o": [{"t": "Gemeinsame Datenhaltung für FI und CO in der Tabelle ACDOCA", "r": true}, {"t": "Gemeinsame Datenhaltung für FI und CO in der Tabelle COEP", "r": false}, {"t": "Ein Bericht, der FI und CO vergleicht, Tabelle BSEG", "r": false}, {"t": "Das neue Hauptbuch (New GL) mit getrennten Tabellen für FI und CO", "r": false}]}, {"id": "A11", "p": "A", "q": "Welche Daten stehen in ACDOCA (Universal Journal, zentrale Buchungstabelle)?", "a": "Alle FI-Buchungen (FI = Finanzbuchhaltung) und die Ist-Buchungen des CO (Controlling) (4.4)", "o": [{"t": "Alle FI-Buchungen (FI = Finanzbuchhaltung)", "r": true}, {"t": "Die Ist-Buchungen des CO (Controlling)", "r": true}, {"t": "Die Planwerte des CO (Controlling)", "r": false}, {"t": "Nur die Stammdaten der Kostenstellen", "r": false}]}, {"id": "A12", "p": "A", "q": "Welche Komponenten greifen auf das Universal Journal zu?", "a": "FI-GL (Hauptbuch), CO (Controlling), FI-AA (Anlagenbuchhaltung), CO-PA (Ergebnisrechnung, buchhalterisch) und das Material Ledger (4.4)", "o": [{"t": "FI-GL Hauptbuch", "r": true}, {"t": "CO Controlling", "r": true}, {"t": "FI-AA Anlagenbuchhaltung", "r": true}, {"t": "SD Vertrieb (Kundenaufträge)", "r": false}]}, {"id": "A13", "p": "A", "q": "Nenne drei Vorteile des Universal Journals.", "a": "Keine doppelte Datenhaltung, kein Abgleich zwischen Tabellen, weniger Speicherplatz, höherer Datendurchsatz (4.4)", "o": [{"t": "Keine doppelte Datenhaltung", "r": true}, {"t": "Kein Abgleich zwischen Tabellen nötig", "r": true}, {"t": "Weniger Speicherplatz und höherer Datendurchsatz", "r": true}, {"t": "Planwerte und Istwerte stehen in derselben Tabelle COEP", "r": false}]}, {"id": "A14", "p": "A", "q": "Nenne die Merkmale von SAP Fiori.", "a": "Rollenbasiert, geräteunabhängig, einfach, gleich aufgebaut, ansprechend (5.1)", "o": [{"t": "Rollenbasiert", "r": true}, {"t": "Geräteunabhängig", "r": true}, {"t": "Gleich aufgebaut", "r": true}, {"t": "Pro Transaktion genau eine App", "r": false}]}, {"id": "A15", "p": "A", "q": "Gibt es zu jeder GUI-Transaktion (GUI = Programmoberfläche) genau eine Fiori-App?", "a": "Nein. Die Funktionen sind nach Rollen auf die Apps verteilt (5.1)", "o": [{"t": "Nein, die Funktionen sind nach Rollen auf die Apps verteilt", "r": true}, {"t": "Ja, jede GUI-Transaktion hat genau eine Fiori-App", "r": false}, {"t": "Ja, aber nur im Controlling", "r": false}, {"t": "Nein, Fiori kennt gar keine Apps, nur Transaktionen", "r": false}]}, {"id": "A16", "p": "A", "q": "Wie startest du das Fiori Launchpad aus dem SAP GUI (Programmoberfläche)?", "a": "Mit dem Transaktionscode /UI2/FLP (Fiori Launchpad starten), eventuell mit /n davor. Die Anmeldung wird übernommen (5.2)", "o": [{"t": "Mit dem Transaktionscode /UI2/FLP, eventuell mit /n davor; die Anmeldung wird übernommen", "r": true}, {"t": "Mit dem Transaktionscode FLP01, danach neu anmelden", "r": false}, {"t": "Über System → Benutzervorgaben → Fiori", "r": false}, {"t": "Gar nicht, Fiori startet nur über den Browser mit neuer Anmeldung", "r": false}]}, {"id": "A17", "p": "A", "q": "Wie viele Mandanten kann ein SAP-System haben?", "a": "Bis zu 1'000 (000 bis 999) (6.1)", "o": [{"t": "Bis zu 1'000 (000 bis 999)", "r": true}, {"t": "Genau einen", "r": false}, {"t": "Bis zu 99 (01 bis 99)", "r": false}, {"t": "Bis zu 10'000", "r": false}]}, {"id": "A18", "p": "A", "q": "Was ist ein Buchungskreis?", "a": "Die kleinste rechtlich selbstständige, bilanzierende Einheit (6.2)", "o": [{"t": "Die kleinste rechtlich selbstständige, bilanzierende Einheit", "r": true}, {"t": "Die Organisationseinheit, die die Kostenrechnung gliedert", "r": false}, {"t": "Eine logistische Einheit für Disposition und Bestandsführung", "r": false}, {"t": "Eine in sich geschlossene Einheit mit eigenen Stammdaten im System", "r": false}]}, {"id": "A19", "p": "A", "q": "Welche Parameter müssen für jeden Buchungskreis festgelegt werden?", "a": "Kontenplan, Hauswährung, Geschäftsjahresvariante (6.2)", "o": [{"t": "Kontenplan", "r": true}, {"t": "Hauswährung", "r": true}, {"t": "Geschäftsjahresvariante", "r": true}, {"t": "Standardhierarchie", "r": false}]}, {"id": "A20", "p": "A", "q": "Wozu dient ein Kostenrechnungskreis über mehrere Buchungskreise?", "a": "Für eine buchungskreisübergreifende Kostenrechnung, z. B. Deckungsbeiträge über mehrere Vertriebsgesellschaften (6.3)", "o": [{"t": "Für eine buchungskreisübergreifende Kostenrechnung, z. B. Deckungsbeiträge über mehrere Vertriebsgesellschaften", "r": true}, {"t": "Damit jeder Buchungskreis eine eigene Bilanz erstellen kann", "r": false}, {"t": "Damit Werke mehreren Buchungskreisen gehören können", "r": false}, {"t": "Für die Konsolidierung über mehrere Mandanten", "r": false}]}, {"id": "A21", "p": "A", "q": "Was muss innerhalb jedes Kostenrechnungskreises angelegt sein?", "a": "Die Standardhierarchie (6.3)", "o": [{"t": "Die Standardhierarchie", "r": true}, {"t": "Ein Werk", "r": false}, {"t": "Eine Einkaufsorganisation", "r": false}, {"t": "Ein Umbuchungszyklus", "r": false}]}, {"id": "A22", "p": "A", "q": "Zu wie vielen Buchungskreisen gehört ein Werk?", "a": "Zu genau einem (6.4)", "o": [{"t": "Zu genau einem", "r": true}, {"t": "Zu höchstens zwei", "r": false}, {"t": "Zu beliebig vielen", "r": false}, {"t": "Zu keinem, es hängt am Kostenrechnungskreis", "r": false}]}, {"id": "A23", "p": "A", "q": "Wann spielt das Werk im Controlling eine Rolle?", "a": "Bei kontierten Bestellungen und Verbrauchsbuchungen im Beschaffungsprozess (6.4)", "o": [{"t": "Bei kontierten Bestellungen und Verbrauchsbuchungen im Beschaffungsprozess", "r": true}, {"t": "Bei jeder Umbuchung zwischen Kostenstellen", "r": false}, {"t": "Beim Anlegen einer Kostenart", "r": false}, {"t": "Nur im Berichtswesen", "r": false}]}, {"id": "A24", "p": "A", "q": "Kann eine Einkaufsorganisation Werke mehrerer Buchungskreise versorgen?", "a": "Ja. Und ein Werk kann von mehreren Einkaufsorganisationen versorgt werden (6.5)", "o": [{"t": "Ja, und ein Werk kann von mehreren Einkaufsorganisationen versorgt werden", "r": true}, {"t": "Nein, nur Werke des eigenen Buchungskreises", "r": false}, {"t": "Ja, aber ein Werk kann nur eine Einkaufsorganisation haben", "r": false}, {"t": "Nein, eine Einkaufsorganisation versorgt genau ein Werk", "r": false}]}, {"id": "A25", "p": "A", "q": "Nenne die Organisationseinheiten im Schulungsmandanten.", "a": "Kostenrechnungskreis K200, Buchungskreis B200, Werk W210, Einkaufsorganisation E200, Einkäufergruppe S## (6.6)", "o": [{"t": "Kostenrechnungskreis K200", "r": true}, {"t": "Buchungskreis B200", "r": true}, {"t": "Werk W210", "r": true}, {"t": "Einkaufsorganisation W200", "r": false}]}, {"id": "B1", "p": "B", "q": "Mit welcher Transaktion legst du in S/4HANA (aktuelle SAP-Software) eine Kostenart an?", "a": "FS00 (Sachkonto bearbeiten). Sachkonto und Kostenart werden gemeinsam gepflegt (7.1)", "o": [{"t": "FS00 (Sachkonto bearbeiten)", "r": true}, {"t": "KA01 (Kostenart anlegen)", "r": false}, {"t": "KS01 (Kostenstelle anlegen)", "r": false}, {"t": "KK01 (statistische Kennzahl anlegen)", "r": false}]}, {"id": "B2", "p": "B", "q": "Brauchen auch sekundäre Kostenarten ein Sachkonto?", "a": "Ja, in S/4HANA (aktuelle SAP-Software) braucht jede Kostenart ein Sachkonto (7.1)", "o": [{"t": "Ja, in S/4HANA braucht jede Kostenart ein Sachkonto", "r": true}, {"t": "Nein, nur primäre Kostenarten brauchen ein Sachkonto", "r": false}, {"t": "Nein, sekundäre Kostenarten werden in KA06 ohne Sachkonto angelegt", "r": false}, {"t": "Nur wenn sie im FI bebucht werden", "r": false}]}, {"id": "B3", "p": "B", "q": "Was entspricht einer Primärkostenart im FI (Finanzbuchhaltung)?", "a": "Ein Aufwandskonto aus dem GuV-Teil (GuV = Gewinn- und Verlustrechnung) des Kontenplans, mit demselben Schlüssel (7.1.1)", "o": [{"t": "Ein Aufwandskonto aus dem GuV-Teil des Kontenplans, mit demselben Schlüssel", "r": true}, {"t": "Ein Bestandskonto aus der Bilanz", "r": false}, {"t": "Ein Abstimmkonto für Kreditoren", "r": false}, {"t": "Ein Konto der Sachkontoart N", "r": false}]}, {"id": "B4", "p": "B", "q": "Nenne drei Beispiele für primäre und drei für sekundäre Kostenarten.", "a": "Primär: Material-, Lohn-, Energiekosten. Sekundär: Umlage, interne Leistungsverrechnung, Auftragsabrechnung (7.1.1, 7.1.2)", "o": [{"t": "Primär: Materialkosten", "r": true}, {"t": "Primär: Lohnkosten", "r": true}, {"t": "Sekundär: Umlage", "r": true}, {"t": "Sekundär: Energiekosten", "r": false}]}, {"id": "B5", "p": "B", "q": "Was passiert, wenn du auf ein Sachkonto mit Kostenart buchst, ohne ein CO-Objekt (CO = Controlling) anzugeben?", "a": "Die Buchung ist nicht möglich, ausser im Customizing ist eine automatische Kontierung hinterlegt (7.1.1, 8.1)", "o": [{"t": "Die Buchung ist nicht möglich, ausser im Customizing ist eine automatische Kontierung hinterlegt", "r": true}, {"t": "Die Buchung läuft, die Kosten das spart Eingaben. Die Vorlage sollte ein ähnliches Konto aus derselben Kontenklasse sein (7.1.3)", "o": [{"t": "Die Daten werden übernommen, das spart Eingaben", "r": true}, {"t": "Die Vorlage sollte ein ähnliches Konto aus derselben Kontenklasse sein", "r": true}, {"t": "Ohne Vorlage kann kein Sachkonto angelegt werden", "r": false}, {"t": "Die Vorlage muss aus einem anderen Buchungskreis stammen", "r": false}]}, {"id": "B11", "p": "B", "q": "Woher kennt FS00 (Sachkonto bearbeiten) den Kontenplan?", "a": "Über den Buchungskreis, dem im Customizing ein Kontenplan zugeordnet ist (7.1.3)", "o": [{"t": "Über den Buchungskreis, dem im Customizing ein Kontenplan zugeordnet ist", "r": true}, {"t": "Man muss den Kontenplan in jedem Fall von Hand eingeben", "r": false}, {"t": "Über den Kostenrechnungskreis", "r": false}, {"t": "Über die Benutzervorgaben (Parameter-ID)", "r": false}]}, {"id": "B12", "p": "B", "q": "Was steuert die Kontengruppe, was die Feldstatusgruppe?", "a": "Kontengruppe: die Erfassungsbilder des Sachkontenstammsatzes. Feldstatusgruppe: den Bildaufbau bei der Belegerfassung, also Muss, Kann, Anzeige oder ausgeblendet (7.1.3)", "o": [{"t": "Kontengruppe: Erfassungsbilder beim Anlegen und Ändern des Sachkontos", "r": true}, {"t": "Feldstatusgruppe: Muss, Kann, Anzeige oder ausgeblendet bei der Belegerfassung", "r": true}, {"t": "Kontengruppe: welche Steuerkennzeichen erlaubt sind", "r": false}, {"t": "Feldstatusgruppe: in welcher Währung gebucht werden darf", "r": false}]}, {"id": "B13", "p": "B", "q": "Was bedeuten die Steuerkategorien +, − und *?", "a": "+ nur Ausgangssteuer, − nur Vorsteuer, * alle Steuerarten (7.1.3)", "o": [{"t": "„+“ nur Ausgangssteuer", "r": true}, {"t": "„−“ nur Vorsteuer", "r": true}, {"t": "„*“ alle Steuerarten", "r": true}, {"t": "„*“ keine Steuer erlaubt", "r": false}]}, {"id": "B14", "p": "B", "q": "Was bewirkt das Kennzeichen „Nur automatisch bebuchbar“?", "a": "Das Konto wird nur über die Kontenfindung bebucht, nicht durch direkte Eingabe (7.1.3)", "o": [{"t": "Das Konto wird nur über die Kontenfindung bebucht, nicht durch direkte Eingabe", "r": true}, {"t": "Das Konto wird am Periodenende automatisch umgebucht", "r": false}, {"t": "Das Konto rechnet die Steuer automatisch", "r": false}, {"t": "Das Konto ist für alle Benutzer gesperrt", "r": false}]}, {"id": "B15", "p": "B", "q": "Was ist der Unterschied zwischen Kostenstelle und Kostenstellengruppe?", "a": "Die Kostenstelle ist ein bebuchbares Kontierungsobjekt. Die Gruppe ist nicht bebuchbar und dient der Auswertung und der Hierarchie (7.2)", "o": [{"t": "Die Kostenstelle ist bebuchbar", "r": true}, {"t": "Die Gruppe ist nicht bebuchbar und dient Auswertung und Hierarchie", "r": true}, {"t": "Die Gruppe ist bebuchbar, die Kostenstelle nicht", "r": false}, {"t": "Es gibt keinen Unterschied, beides sind Kontierungsobjekte", "r": false}]}, {"id": "B16", "p": "B", "q": "Was sind Hilfskostenstellen, und was passiert mit ihnen am Periodenende?", "a": "Kostenstellen, auf denen alle Mitarbeitenden Kosten verursachen (z. B. Kantine). Sie werden vollständig auf die Hauptkostenstellen entlastet (7.2.1)", "o": [{"t": "Kostenstellen, auf denen alle Mitarbeitenden Kosten verursachen, z. B. Kantine", "r": true}, {"t": "Sie werden am Periodenende vollständig auf die Hauptkostenstellen entlastet", "r": true}, {"t": "Sie werden am Periodenende gelöscht", "r": false}, {"t": "Sie dürfen nicht bebucht werden", "r": false}]}, {"id": "B17", "p": "B", "q": "Welches Feld ist beim Anlegen einer Kostenstelle wegen der Verantwortung ein Mussfeld?", "a": "Verantwortlicher (7.2.1)", "o": [{"t": "Verantwortlicher", "r": true}, {"t": "Profitcenter", "r": false}, {"t": "Telefonnummer", "r": false}, {"t": "Sachkonto", "r": false}], "sm": true}, {"id": "B18", "p": "B", "q": "Was bedeutet das Datum 31.12.9999 bei einer Kostenstelle?", "a": "Unbegrenzte Gültigkeit (7.2.6)", "o": [{"t": "Unbegrenzte Gültigkeit", "r": true}, {"t": "Die Kostenstelle ist gesperrt", "r": false}, {"t": "Die Kostenstelle ist zum Löschen vorgemerkt", "r": false}, {"t": "Das Datum der letzten Buchung", "r": false}]}, {"id": "B19", "p": "B", "q": "Wofür ist die Art der Kostenstelle vor allem relevant?", "a": "Für die Leistungsverrechnung: Eine Leistungsart darf nur von bestimmten Kostenstellenarten erbracht werden. Zusätzlich für Auswertungen (7.2.6)", "o": [{"t": "Für die Leistungsverrechnung: Eine Leistungsart darf nur von bestimmten Kostenstellenarten erbracht werden", "r": true}, {"t": "Für die Steuerberechnung", "r": false}, {"t": "Für die Zuordnung zum Buchungskreis", "r": false}, {"t": "Für die Währung der Kostenstelle", "r": false}]}, {"id": "B20", "p": "B", "q": "Was legt der Hierarchiebereich im Kostenstellenstammsatz fest?", "a": "Den Knoten der Standardhierarchie, dem die Kostenstelle zugeordnet ist (7.2.6)", "o": [{"t": "Den Knoten der Standardhierarchie, dem die Kostenstelle zugeordnet ist", "r": true}, {"t": "Den Buchungskreis der Kostenstelle", "r": false}, {"t": "Den Verantwortlichen der Kostenstelle", "r": false}, {"t": "Die Gültigkeit der Kostenstelle", "r": false}]}, {"id": "B21", "p": "B", "q": "Was unterscheidet eine mit KSH1 (Kostenstellengruppe anlegen) angelegte Kostenstellengruppe?", "a": "Sie ist eine alternative Gruppe ausserhalb der Standardhierarchie. Nachträglich zuordnen geht nur, solange ihr keine Kostenstellen zugeordnet sind (7.2.2)", "o": [{"t": "Sie ist eine alternative Gruppe ausserhalb der Standardhierarchie", "r": true}, {"t": "Nachträglich zuordnen geht nur, solange ihr keine Kostenstellen zugeordnet sind", "r": true}, {"t": "Sie gehört automatisch zur Standardhierarchie", "r": false}, {"t": "Sie ist bebuchbar", "r": false}]}, {"id": "B22", "p": "B", "q": "Wann kann eine Kostenstelle mit KS04 (Kostenstelle löschen) gelöscht werden?", "a": "Nur ohne Plan-, Ist- und Obligodaten und ohne geplante statistische Kennzahlen; zuerst Testlauf, dann Echtlauf (7.2.9)", "o": [{"t": "Nur ohne Plan-, Ist- und Obligodaten", "r": true}, {"t": "Nur ohne geplante statistische Kennzahlen", "r": true}, {"t": "Zuerst Testlauf, dann Echtlauf", "r": true}, {"t": "Jederzeit, die Buchungen werden automatisch umgebucht", "r": false}]}, {"id": "B23", "p": "B", "q": "Wie heissen die Transaktionen zum Anzeigen und Ändern der Standardhierarchie?", "a": "OKENN (Standardhierarchie anzeigen) anzeigen, OKEON (Standardhierarchie ändern) ändern (7.3)", "o": [{"t": "OKENN anzeigen, OKEON ändern", "r": true}, {"t": "OKEON anzeigen, OKENN ändern", "r": false}, {"t": "KSH3 anzeigen, KSH2 ändern", "r": false}, {"t": "KS03 anzeigen, KS02 ändern", "r": false}]}, {"id": "B24", "p": "B", "q": "Was ist der Objektmanager in der Standardhierarchie?", "a": "Die Kombination aus Suchbereich und Auswahlbereich (7.3)", "o": [{"t": "Die Kombination aus Suchbereich und Auswahlbereich", "r": true}, {"t": "Der Strukturbaum im Übersichtsbereich", "r": false}, {"t": "Die Stammdaten im Detailbereich", "r": false}, {"t": "Ein Benutzer mit Änderungsrecht für die Hierarchie", "r": false}]}, {"id": "B25", "p": "B", "q": "Wozu dienen statistische Kennzahlen in der Kostenrechnung?", "a": "Als Bezugsbasis für periodische Umbuchung und Verteilung, z. B. Quadratmeter für Reinigungskosten (7.4)", "o": [{"t": "Als Bezugsbasis für periodische Umbuchung und Verteilung, z. B. m² für Reinigungskosten", "r": true}, {"t": "Als Kostenart für sekundäre Kosten", "r": false}, {"t": "Zur Steuerberechnung", "r": false}, {"t": "Als Ersatz für Kostenstellengruppen", "r": false}]}, {"id": "B26", "p": "B", "q": "Erkläre den Unterschied zwischen Festwert und Summenwert.", "a": "Festwerte werden bis zum Ende des Geschäftsjahres fortgeschrieben (z. B. m², Mitarbeiter). Summenwerte gelten nur in der erfassten Periode (z. B. km, Telefoneinheiten) (7.4.1)", "o": [{"t": "Festwerte werden bis zum Ende des Geschäftsjahres fortgeschrieben (z. B. m², Mitarbeiter)", "r": true}, {"t": "Summenwerte gelten nur in der erfassten Periode (z. B. km, Telefoneinheiten)", "r": true}, {"t": "Festwerte gelten nur in der erfassten Periode", "r": false}, {"t": "Gefahrene Kilometer sind ein Festwert", "r": false}]}, {"id": "B27", "p": "B", "q": "Mit welcher Transaktion erfasst du Werte statistischer Kennzahlen?", "a": "KB31N (Kennzahlwerte erfassen); in Fiori „Statistische Kennzahlwerte verwalten“ (7.4.6, 7.4.7)", "o": [{"t": "KB31N (Kennzahlwerte erfassen)", "r": true}, {"t": "Fiori: „Statistische Kennzahlwerte verwalten“", "r": true}, {"t": "KK01 (statistische Kennzahl anlegen)", "r": false}, {"t": "KB11N (manuelle Kostenumbuchung)", "r": false}]}, {"id": "B28", "p": "B", "q": "Welche drei Datenebenen hat ein Lieferantenstammsatz?", "a": "Allgemeine Daten (Mandantenebene), Buchungskreisdaten, Einkaufsorganisationsdaten (7.5)", "o": [{"t": "Allgemeine Daten (Mandantenebene)", "r": true}, {"t": "Buchungskreisdaten", "r": true}, {"t": "Einkaufsorganisationsdaten", "r": true}, {"t": "Kostenrechnungskreisdaten", "r": false}]}, {"id": "B29", "p": "B", "q": "Welches Feld ist in den Buchungskreisdaten Pflicht, und warum?", "a": "Das Abstimmkonto. Es ist nötig, damit die Eingangsrechnung korrekt im Hauptbuch erfasst wird (7.5.2)", "o": [{"t": "Das Abstimmkonto, damit die Eingangsrechnung korrekt im Hauptbuch erfasst wird", "r": true}, {"t": "Die Kostenstelle, damit die Kosten ins CO gehen", "r": false}, {"t": "Die Einkaufsorganisation, damit bestellt werden kann", "r": false}, {"t": "Die Steuernummer, damit Vorsteuer gebucht wird", "r": false}]}, {"id": "B30", "p": "B", "q": "Welche Partnerrollen kann ein Lieferant haben?", "a": "Bestellempfänger, Warenlieferant, Rechnungssteller (7.5)", "o": [{"t": "Bestellempfänger", "r": true}, {"t": "Warenlieferant", "r": true}, {"t": "Rechnungssteller", "r": true}, {"t": "Kostenstellenverantwortlicher", "r": false}]}, {"id": "B31", "p": "B", "q": "Was legen GP-Typ (GP = Geschäftspartner), Gruppierung und GP-Rolle (GP = Geschäftspartner) fest?", "a": "GP-Typ (GP = Geschäftspartner): Person, Organisation oder Gruppe. Gruppierung: Nummernkreis und interne oder externe Vergabe. GP-Rolle (GP = Geschäftspartner): die Geschäftsbeziehung, z. B. Lieferant (7.5.1, 7.5.2)", "o": [{"t": "GP-Typ: Person, Organisation oder Gruppe", "r": true}, {"t": "Gruppierung: Nummernkreis und interne oder externe Vergabe", "r": true}, {"t": "GP-Rolle: die Geschäftsbeziehung, z. B. Lieferant", "r": true}, {"t": "Gruppierung: die Geschäftsbeziehung, z. B. Kunde", "r": false}]}, {"id": "B32", "p": "B", "q": "Was ist der Vorteil des Geschäftspartnerkonzepts?", "a": "Ein Partner, der Kunde und Lieferant ist, wird unter einer gemeinsamen GP-Nummer (GP = Geschäftspartner) geführt (7.5.1)", "o": [{"t": "Ein Partner, der Kunde und Lieferant ist, wird unter einer gemeinsamen GP-Nummer geführt", "r": true}, {"t": "Jeder Lieferant braucht keine Adresse mehr", "r": false}, {"t": "Lieferanten werden automatisch in jedem Buchungskreis angelegt", "r": false}, {"t": "Kunden und Lieferanten erhalten getrennte Nummernkreise", "r": false}]}, {"id": "C1", "p": "C", "q": "Was versteht man unter vorgangsbezogenen Buchungen?", "a": "Die Verrechnung von Kosten pro Geschäftsvorgang (8)", "o": [{"t": "Die Verrechnung von Kosten pro Geschäftsvorgang", "r": true}, {"t": "Die Verteilung von Kosten am Periodenende über Zyklen", "r": false}, {"t": "Buchungen, die nur im Plan erfasst werden", "r": false}, {"t": "Buchungen ohne Bezug zu einem Beleg", "r": false}]}, {"id": "C2", "p": "C", "q": "Warum ist ein CO-Beleg (CO = Controlling) einseitig?", "a": "Nur die Buchung auf dem GuV-Konto (GuV = Gewinn- und Verlustrechnung, z. B. das Aufwandskonto) geht ans CO (Controlling), nicht die Gegenbuchung auf dem Bestandskonto (8.1)", "o": [{"t": "Nur die Buchung auf dem GuV-Konto (z. B. Aufwandskonto) geht ans CO, nicht die Gegenbuchung auf dem Bestandskonto", "r": true}, {"t": "Weil das CO nur Haben-Buchungen kennt", "r": false}, {"t": "Weil die Gegenbuchung im CO erst am Periodenende entsteht", "r": false}, {"t": "Weil CO-Belege keinen Betrag enthalten", "r": false}]}, {"id": "C3", "p": "C", "q": "Nenne die drei Wege, eine Fehlkontierung zu korrigieren.", "a": "Belegstorno; manuelle Kostenumbuchung ohne Bezug zum FI-Beleg (FI = Finanzbuchhaltung); Einzelpostenumbuchung mit Bezug zum FI-Beleg (FI = Finanzbuchhaltung) (8.1)", "o": [{"t": "Belegstorno", "r": true}, {"t": "Manuelle Kostenumbuchung ohne Bezug zum FI-Beleg", "r": true}, {"t": "Einzelpostenumbuchung mit Bezug zum FI-Beleg", "r": true}, {"t": "Periodische Umbuchung mit KSW5", "r": false}]}, {"id": "C4", "p": "C", "q": "Aus welchen Anwendungen stammen die meisten CO-Buchungen (CO = Controlling)?", "a": "FI (Finanzbuchhaltung), MM (Materialwirtschaft), SD (Vertrieb), HR (Personalwirtschaft). Voraussetzung sind Customizing-Einstellungen wie die Kontenfindung (8.1)", "o": [{"t": "FI (Finanzbuchhaltung)", "r": true}, {"t": "MM (Materialwirtschaft)", "r": true}, {"t": "SD (Vertrieb)", "r": true}, {"t": "BW (Business Warehouse)", "r": false}]}, {"id": "C5", "p": "C", "q": "Wofür steht „Einbildtransaktion“ bei FB50 (Sachkontenbeleg erfassen) und FB60 (Eingangsrechnung ohne Bestellung)?", "a": "Belege lassen sich auf einem einzigen Bildschirm erfassen, merken, vorerfassen und buchen (8.2, 8.4)", "o": [{"t": "Belege lassen sich auf einem einzigen Bildschirm erfassen, merken, vorerfassen und buchen", "r": true}, {"t": "Pro Beleg darf nur eine Position erfasst werden", "r": false}, {"t": "Die Transaktion läuft nur im Einbenutzerbetrieb", "r": false}, {"t": "Der Beleg wird ohne Belegkopf gebucht", "r": false}]}, {"id": "C6", "p": "C", "q": "Aus wie vielen Positionen besteht ein buchbarer Beleg mindestens?", "a": "Aus einem Belegkopf und mindestens zwei Positionen (8.2)", "o": [{"t": "Aus einem Belegkopf und mindestens zwei Positionen", "r": true}, {"t": "Aus einem Belegkopf und mindestens einer Position", "r": false}, {"t": "Aus mindestens drei Positionen ohne Belegkopf", "r": false}, {"t": "Aus genau zwei Positionen, mehr sind nicht erlaubt", "r": false}]}, {"id": "C7", "p": "C", "q": "Was zeigt die Ampel beim Saldo in FB50 (Sachkontenbeleg erfassen)?", "a": "Rot: Saldo ungleich null. Gelb: noch nicht ermittelt. Grün: Saldo null, Beleg buchbar (8.2)", "o": [{"t": "Rot: Saldo ungleich null", "r": true}, {"t": "Gelb: Saldo noch nicht ermittelt", "r": true}, {"t": "Grün: Saldo null, Beleg buchbar", "r": true}, {"t": "Grün: Beleg bereits gebucht und storniert", "r": false}]}, {"id": "C8", "p": "C", "q": "Was bedeutet „Merken“ in der App „Hauptbuchbelege buchen“?", "a": "Der Beleg wird unter einer temporären ID (Identifikation) gesichert, ohne Vollständigkeitsprüfung und ohne Buchung (8.3)", "o": [{"t": "Gesichert unter einer temporären ID, ohne Vollständigkeitsprüfung und ohne Buchung", "r": true}, {"t": "Gebucht, aber noch nicht ans CO übergeben", "r": false}, {"t": "Vorerfasst mit vollständiger Prüfung", "r": false}, {"t": "Endgültig gebucht mit Belegnummer", "r": false}]}, {"id": "C9", "p": "C", "q": "Wie erfasst du eine Rechnung ohne Bestellung, wie eine mit Bestellung?", "a": "Ohne Bestellung: FB60 (Eingangsrechnung ohne Bestellung) in der Kreditorenbuchhaltung. Mit Bestellung: MIRO (Rechnung zur Bestellung erfassen) bzw. App „Lieferantenrechnung anlegen“ (8.4, 8.6.11)", "o": [{"t": "Ohne Bestellung: FB60", "r": true}, {"t": "Mit Bestellung: MIRO bzw. App „Lieferantenrechnung anlegen“", "r": true}, {"t": "Ohne Bestellung: MIRO", "r": false}, {"t": "Mit Bestellung: FB50", "r": false}]}, {"id": "C10", "p": "C", "q": "Ist FB60 (Eingangsrechnung ohne Bestellung) in Fiori eine eigene App?", "a": "Nein, die GUI-Transaktion (GUI = Programmoberfläche) wird über die GUI (Programmoberfläche) für HTML (Webseiten-Sprache) geöffnet (8.4)", "o": [{"t": "Nein, die GUI-Transaktion wird über die GUI für HTML geöffnet", "r": true}, {"t": "Ja, die App heisst „Hauptbuchbelege buchen“", "r": false}, {"t": "Ja, die App heisst „Lieferantenrechnung anlegen“", "r": false}, {"t": "Nein, FB60 gibt es in Fiori überhaupt nicht", "r": false}]}, {"id": "C11", "p": "C", "q": "Wie kommst du in FB03 (Beleg anzeigen) vom FI-Beleg (FI = Finanzbuchhaltung) zum CO-Beleg (CO = Controlling)?", "a": "Umfeld → Belegumfeld → Rechnungswesenbelege. Direkt geht es mit KSB5 (CO-Belege anzeigen) (8.5)", "o": [{"t": "Umfeld → Belegumfeld → Rechnungswesenbelege", "r": true}, {"t": "Direkt mit KSB5 (CO-Belege anzeigen)", "r": true}, {"t": "Springen → Varianten → CO-Beleg", "r": false}, {"t": "Mit KSH3 (Kostenstellengruppe anzeigen)", "r": false}], "sm": true}, {"id": "C12", "p": "C", "q": "Nenne die Schritte des Beschaffungsprozesses und die Bereiche.", "a": "BANF (Bestellanforderung), Anfrage, Angebot, Bestellung (Einkauf); Wareneingang (Bestandsführung); Rechnungseingang (Logistik-Rechnungsprüfung) (8.6.1)", "o": [{"t": "BANF, Anfrage, Angebot, Bestellung im Einkauf", "r": true}, {"t": "Wareneingang in der Bestandsführung", "r": true}, {"t": "Rechnungseingang in der Logistik-Rechnungsprüfung", "r": true}, {"t": "Rechnungseingang in der Bestandsführung", "r": false}]}, {"id": "C13", "p": "C", "q": "Welcher Beleg ist im Beschaffungsprozess zentral, und warum?", "a": "Die Bestellung. Wareneingang und Rechnung beziehen sich auf ihre Nummer, Daten werden übernommen und der Bestellstatus aktualisiert (8.6.1)", "o": [{"t": "Die Bestellung, weil Wareneingang und Rechnung sich auf ihre Nummer beziehen", "r": true}, {"t": "Die Bestellanforderung, weil sie immer Pflicht ist", "r": false}, {"t": "Die Rechnung, weil erst sie das Obligo erzeugt", "r": false}, {"t": "Der Wareneingang, weil er die Bestellnummer vergibt", "r": false}]}, {"id": "C14", "p": "C", "q": "Was ist ein Obligo?", "a": "Die künftigen Kosten für bestellte Materialien und Dienstleistungen. Es bindet Mittel, die später zu Kosten werden (8.6.6)", "o": [{"t": "Die künftigen Kosten für bestellte Materialien und Dienstleistungen", "r": true}, {"t": "Bereits bezahlte Lieferantenrechnungen", "r": false}, {"t": "Die Differenz zwischen Plan und Ist", "r": false}, {"t": "Ein Sammelkonto für Fehlbuchungen", "r": false}]}, {"id": "C15", "p": "C", "q": "Wann entsteht das Obligo, und wann wird es aufgelöst?", "a": "Beim Sichern einer kontierten Bestellung. Aufgelöst beim bewerteten Wareneingang, sonst erst bei der Rechnung (8.6.6)", "o": [{"t": "Es entsteht beim Sichern einer kontierten Bestellung", "r": true}, {"t": "Bei bewertetem Wareneingang wird es mit dem Wareneingang aufgelöst", "r": true}, {"t": "Bei unbewertetem oder fehlendem Wareneingang erst mit der Rechnung", "r": true}, {"t": "Es entsteht erst mit dem Wareneingang", "r": false}]}, {"id": "C16", "p": "C", "q": "Wo siehst du das Obligo?", "a": "In ME23N (Bestellung anzeigen) über Umfeld → Belegposition → RW-Obligobelege (RW = Rechnungswesen) oder im Bericht S_ALR_87013620 (Bericht Kostenstellen Ist/Plan/Obligo) (8.6.6)", "o": [{"t": "In ME23N über Umfeld → Belegposition → RW-Obligobelege", "r": true}, {"t": "Im Bericht S_ALR_87013620 (Kostenstellen Ist/Plan/Obligo)", "r": true}, {"t": "In FB03 über Umfeld → Obligo", "r": false}, {"t": "Im Bericht S_ALR_87013611 (Ist/Plan/Abweichung) als eigene Spalte", "r": false}]}, {"id": "C17", "p": "C", "q": "Wann braucht eine Bestellposition einen Kontierungstyp?", "a": "Bei Verbrauchsmaterial, nicht bei Lagermaterial (8.6.2.3)", "o": [{"t": "Bei Verbrauchsmaterial, nicht bei Lagermaterial", "r": true}, {"t": "Bei Lagermaterial, nicht bei Verbrauchsmaterial", "r": false}, {"t": "Bei jeder Bestellposition", "r": false}, {"t": "Nur bei Dienstleistungen", "r": false}]}, {"id": "C18", "p": "C", "q": "Was steuert der Kontierungstyp?", "a": "Die nötigen Kontierungsdaten, ob Waren- und Rechnungseingang vorgesehen sind und ob der Wareneingang bewertet oder unbewertet ist (8.6.2.3)", "o": [{"t": "Welche Kontierungsdaten nötig sind", "r": true}, {"t": "Ob Waren- und Rechnungseingang vorgesehen sind", "r": true}, {"t": "Ob der Wareneingang bewertet oder unbewertet ist", "r": true}, {"t": "Welche Belegart die Bestellung hat", "r": false}]}, {"id": "C19", "p": "C", "q": "Was gibt der Positionstyp an?", "a": "Die Beschaffungsart; leer bedeutet „Normal“ (8.6.2.3)", "o": [{"t": "Die Beschaffungsart; leer bedeutet „Normal“", "r": true}, {"t": "Die Kontierung der Position", "r": false}, {"t": "Den Lieferdatumstyp", "r": false}, {"t": "Die Belegart der Bestellung", "r": false}]}, {"id": "C20", "p": "C", "q": "Welche Belegart schlägt ME21N (Bestellung anlegen) vor, und was steuert sie?", "a": "NB Normalbestellung. Sie steuert den Nummernkreis und die Feldauswahl (8.6.3.1)", "o": [{"t": "NB Normalbestellung; sie steuert Nummernkreis und Feldauswahl", "r": true}, {"t": "NB Normalbestellung; sie steuert die Kontierung", "r": false}, {"t": "FO Rahmenbestellung; sie steuert den Lieferanten", "r": false}, {"t": "UB Umlagerungsbestellung; sie steuert das Werk", "r": false}]}, {"id": "C21", "p": "C", "q": "Welche Lieferdatumstypen gibt es?", "a": "D oder T taggenau, W wochengenau, M monatsgenau (8.6.2.4)", "o": [{"t": "D oder T taggenau", "r": true}, {"t": "W wochengenau", "r": true}, {"t": "M monatsgenau", "r": true}, {"t": "J jahresgenau", "r": false}]}, {"id": "C22", "p": "C", "q": "Was gilt für Vorschlagswerte aus den persönlichen Einstellungen in ME21N (Bestellung anlegen)?", "a": "Sie übersteuern die Parameter aus den Benutzervorgaben (8.6.2.2)", "o": [{"t": "Sie übersteuern die Parameter aus den Benutzervorgaben", "r": true}, {"t": "Die Benutzervorgaben übersteuern sie", "r": false}, {"t": "Sie gelten nur für Lagermaterial", "r": false}, {"t": "Sie werden beim Sichern ignoriert", "r": false}]}, {"id": "C23", "p": "C", "q": "Welche Bewegungsart hat ein Wareneingang zur Bestellung, und wie entsteht sie?", "a": "101. Sie ergibt sich aus dem Vorgang „Wareneingang“ und dem Referenzbeleg „Bestellung“ (8.6.8)", "o": [{"t": "101; sie ergibt sich aus dem Vorgang „Wareneingang“ und dem Referenzbeleg „Bestellung“", "r": true}, {"t": "102; sie wird von Hand eingetragen", "r": false}, {"t": "201; sie ergibt sich aus der Kostenstelle", "r": false}, {"t": "101; sie ergibt sich aus der Belegart NB", "r": false}]}, {"id": "C24", "p": "C", "q": "Was legt die Bewegungsart fest?", "a": "Ob ein Bestandszu- oder -abgang vorliegt und wie der Folgebeleg in der Buchhaltung aussieht (8.6.8)", "o": [{"t": "Ob ein Bestandszu- oder -abgang vorliegt", "r": true}, {"t": "Wie der Folgebeleg in der Buchhaltung aussieht", "r": true}, {"t": "Welcher Lieferant geliefert hat", "r": false}, {"t": "Welche Kostenstelle belastet wird", "r": false}]}, {"id": "C25", "p": "C", "q": "Welche Belege entstehen bei der Rechnung nach einem bewerteten Wareneingang?", "a": "Nur ein Buchhaltungsbeleg: offener Posten beim Lieferanten, WE/RE-Konto (WE/RE = Wareneingang/Rechnungseingang) ausgeglichen, Vorsteuer gebucht (8.6.13)", "o": [{"t": "Nur ein Buchhaltungsbeleg (Lieferant offen, WE/RE-Konto ausgeglichen, Vorsteuer)", "r": true}, {"t": "Ein Buchhaltungsbeleg und ein Kostenrechnungsbeleg", "r": false}, {"t": "Nur ein Kostenrechnungsbeleg", "r": false}, {"t": "Kein Beleg, nur eine Statusänderung der Bestellung", "r": false}]}, {"id": "C26", "p": "C", "q": "Wann muss der Saldo in MIRO (Rechnung zur Bestellung erfassen) null sein?", "a": "Immer vor dem Buchen. Saldo = Bruttobetrag minus Netto, Steuer und ungeplante Bezugsnebenkosten (8.6.11)", "o": [{"t": "Immer vor dem Buchen: Bruttobetrag minus Netto, Steuer und ungeplante Bezugsnebenkosten", "r": true}, {"t": "Erst nach dem Buchen, beim Zahlungsausgang", "r": false}, {"t": "Nur wenn kein Wareneingang gebucht wurde", "r": false}, {"t": "Nie, eine Differenz wird automatisch ausgebucht", "r": false}]}, {"id": "D1", "p": "D", "q": "Was ist der Unterschied zwischen Umbuchung und Verrechnung?", "a": "Umbuchung: Die ursprüngliche Belastung auf dem Sender wird vermindert. Verrechnung: Sie bleibt stehen, auf dem Sender entsteht ein separater Entlastungssatz (9)", "o": [{"t": "Umbuchung: Die ursprüngliche Belastung auf dem Sender wird vermindert", "r": true}, {"t": "Verrechnung: Sie bleibt stehen, auf dem Sender entsteht ein separater Entlastungssatz", "r": true}, {"t": "Umbuchung: Auf dem Sender entsteht ein separater Entlastungssatz", "r": false}, {"t": "Verrechnung: Der Empfänger wird nicht belastet", "r": false}]}, {"id": "D2", "p": "D", "q": "Was bleibt bei der manuellen Umbuchung erhalten, was geht verloren?", "a": "Die Originalkostenart bleibt; der Bezug zum FI-Beleg (FI = Finanzbuchhaltung) geht verloren (9.1.1)", "o": [{"t": "Die Originalkostenart bleibt erhalten", "r": true}, {"t": "Der Bezug zum FI-Beleg geht verloren", "r": true}, {"t": "Der Bezug zum FI-Beleg bleibt erhalten", "r": false}, {"t": "Die Kostenart wird durch eine sekundäre ersetzt", "r": false}]}, {"id": "D3", "p": "D", "q": "Prüft KB11N (manuelle Kostenumbuchung), ob die Kosten auf dem Sender vorhanden sind?", "a": "Nein, keine Senderverprobung; negative Kosten auf dem Sender sind möglich (9.1.1)", "o": [{"t": "Nein, keine Senderverprobung; negative Kosten auf dem Sender sind möglich", "r": true}, {"t": "Ja, sonst bricht die Buchung ab", "r": false}, {"t": "Ja, aber nur bei Primärkosten", "r": false}, {"t": "Nein, KB11N bucht nur auf Empfänger ohne Sender", "r": false}]}, {"id": "D4", "p": "D", "q": "Welche Bedingung muss für eine Einzelpostenumbuchung erfüllt sein?", "a": "Der CO-Beleg (CO = Controlling) muss eine Referenz auf einen Buchhaltungsbeleg haben. Anders als KB11N (manuelle Kostenumbuchung) prüft KB61 (Einzelpostenumbuchung), ob der Posten auf dem Sender wirklich vorhanden ist (Senderverprobung) (9.2.1)", "o": [{"t": "Der CO-Beleg muss eine Referenz auf einen Buchhaltungsbeleg haben", "r": true}, {"t": "KB61 prüft, ob der Posten auf dem Sender vorhanden ist (Senderverprobung)", "r": true}, {"t": "Die Kostenstelle muss gesperrt sein", "r": false}, {"t": "Der Posten muss aus einem Zyklus stammen", "r": false}]}, {"id": "D5", "p": "D", "q": "Was steht nach einer Einzelpostenumbuchung auf dem FI-Beleg (FI = Finanzbuchhaltung)?", "a": "Weiterhin die alte Kostenstelle. Soll das FI (Finanzbuchhaltung) korrigiert werden, muss man stornieren und neu erfassen (9.2.1)", "o": [{"t": "Weiterhin die alte Kostenstelle", "r": true}, {"t": "Automatisch die neue Kostenstelle", "r": false}, {"t": "Gar keine Kostenstelle mehr", "r": false}, {"t": "Ein Storno-Vermerk", "r": false}]}, {"id": "D6", "p": "D", "q": "Was gibst du im Einstieg von KB61 (Einzelpostenumbuchung) ein?", "a": "Die Nummer des FI-Belegs (FI = Finanzbuchhaltung), bei Mehrdeutigkeit Buchungskreis und Geschäftsjahr; optional Kostenart oder Kostenstelle (9.2.2)", "o": [{"t": "Die Nummer des FI-Belegs", "r": true}, {"t": "Bei Mehrdeutigkeit Buchungskreis und Geschäftsjahr", "r": true}, {"t": "Den Umbuchungszyklus", "r": false}, {"t": "Die Bestellnummer", "r": false}]}, {"id": "D7", "p": "D", "q": "Welche Kosten kann KB15N (manuelle Kostenverrechnung) verrechnen?", "a": "Primär- und Sekundärkosten, ohne Senderverprobung und ohne Bezug zum Ursprungsbeleg (9.3.1)", "o": [{"t": "Primär- und Sekundärkosten", "r": true}, {"t": "Ohne Senderverprobung", "r": true}, {"t": "Nur Primärkosten", "r": false}, {"t": "Mit Bezug zum Ursprungsbeleg", "r": false}]}, {"id": "D8", "p": "D", "q": "Was steuert ein Zyklus, was enthält ein Segment?", "a": "Der Zyklus steuert den Ablauf. Das Segment enthält die Regeln: Sender, Empfänger, Sender- und Empfängerregeln, Bezugsgrössen (9.4.1)", "o": [{"t": "Der Zyklus steuert den Ablauf", "r": true}, {"t": "Das Segment enthält die Regeln: Sender, Empfänger, Sender- und Empfängerregeln, Bezugsgrössen", "r": true}, {"t": "Das Segment steuert den Ablauf, der Zyklus enthält die Regeln", "r": false}, {"t": "Ein Zyklus kann nur ein Segment enthalten", "r": false}]}, {"id": "D9", "p": "D", "q": "Welche vier Fragen beantwortet ein Segment?", "a": "Wer sendet, wer empfängt, welche Kosten werden verrechnet, nach welcher Basis wird verteilt (9.4.1)", "o": [{"t": "Wer sendet?", "r": true}, {"t": "Wer empfängt?", "r": true}, {"t": "Nach welcher Basis wird verteilt?", "r": true}, {"t": "Welcher Lieferant hat geliefert?", "r": false}]}, {"id": "D10", "p": "D", "q": "Welche Empfehlung gibt das Skript zur Zahl der Segmente?", "a": "Ein eigenes Segment für jedes Objekt, das Kosten abgibt (9.4.1)", "o": [{"t": "Ein eigenes Segment für jedes Objekt, das Kosten abgibt", "r": true}, {"t": "Ein einziges Segment für alle Sender", "r": false}, {"t": "Ein Segment pro Empfänger", "r": false}, {"t": "Ein Segment pro Kostenart", "r": false}]}, {"id": "D11", "p": "D", "q": "Wozu dient die periodische Umbuchung?", "a": "Kosten, die während der Periode auf einer Hilfskostenstelle gesammelt wurden, am Periodenende verursachungsgerecht umzubuchen. Das hält FI-Buchungen (FI = Finanzbuchhaltung) klein und schützt z. B. Gehaltsdaten (9.4.2)", "o": [{"t": "Am Periodenende gesammelte Kosten einer Hilfskostenstelle verursachungsgerecht umbuchen", "r": true}, {"t": "Weniger FI-Buchungen, z. B. Schutz von Gehaltsdaten", "r": true}, {"t": "Fehlkontierungen einzelner FI-Belege korrigieren", "r": false}, {"t": "Kosten mit einem eigenen Entlastungssatz verrechnen", "r": false}]}, {"id": "D12", "p": "D", "q": "Wie legst du einen Umbuchungszyklus an, und warum findest du die Transaktion nicht im Menü?", "a": "KSW1 (Umbuchungszyklus anlegen); ändern mit KSW2 (Umbuchungszyklus ändern), anzeigen mit KSW3 (Umbuchungszyklus anzeigen). Sie stehen nicht im SAP-Menü, man ruft sie über das Kommandofeld oder das Mehr-Menü von KSW5 (periodische Umbuchung ausführen) auf (9.4.2.1)", "o": [{"t": "Mit KSW1 (Umbuchungszyklus anlegen)", "r": true}, {"t": "Sie steht nicht im SAP-Menü, man ruft sie über das Kommandofeld oder das Mehr-Menü von KSW5 auf", "r": true}, {"t": "Mit KSV1 (Verteilungszyklus anlegen)", "r": false}, {"t": "In der Fiori-App „Verrechnungen verwalten“", "r": false}]}, {"id": "D13", "p": "D", "q": "Was bedeutet das Kennzeichen iterativ?", "a": "Bei wechselseitigem Leistungsaustausch wird so lange gerechnet, bis jeder Sender vollständig entlastet ist (9.4.2.1)", "o": [{"t": "Bei wechselseitigem Leistungsaustausch wird gerechnet, bis jeder Sender vollständig entlastet ist", "r": true}, {"t": "Der Zyklus läuft jeden Monat automatisch", "r": false}, {"t": "Jeder Empfänger wird nur einmal belastet", "r": false}, {"t": "Der Zyklus wird nur im Testlauf ausgeführt", "r": false}]}, {"id": "D14", "p": "D", "q": "Welche vier Register hat ein Segment?", "a": "Segmentkopf, Sender/Empfänger, Senderwerte, Empfängerbezugsbasis (9.4.2.2)", "o": [{"t": "Segmentkopf", "r": true}, {"t": "Sender/Empfänger", "r": true}, {"t": "Empfängerbezugsbasis", "r": true}, {"t": "Kontierung", "r": false}]}, {"id": "D15", "p": "D", "q": "Nenne die drei Sender-Regeln.", "a": "Gebuchte Beträge, Feste Beträge, Feste Tarife (Tarif × Bezugsbasis) (9.4.2.2)", "o": [{"t": "Gebuchte Beträge", "r": true}, {"t": "Feste Beträge", "r": true}, {"t": "Feste Tarife", "r": true}, {"t": "Variable Anteile", "r": false}]}, {"id": "D16", "p": "D", "q": "Wann erscheint das Register Senderwerte?", "a": "Nur bei der Sender-Regel „Feste Beträge“ oder „Feste Tarife“ (9.4.2.2)", "o": [{"t": "Bei der Sender-Regel „Feste Beträge“", "r": true}, {"t": "Bei der Sender-Regel „Feste Tarife“", "r": true}, {"t": "Bei der Sender-Regel „Gebuchte Beträge“", "r": false}, {"t": "Immer, bei jedem Segment", "r": false}]}, {"id": "D17", "p": "D", "q": "Nenne die Empfänger-Regeln und ihre Wirkung.", "a": "Variable Anteile (Werte auf den Empfängern, z. B. Istkosten oder Kennzahl Ist); Feste Beträge (Sender-Regel wird ignoriert); Feste Prozentsätze (Rest bleibt auf dem Sender); Feste Anteile (Sender immer voll entlastet) (9.4.2.2)", "o": [{"t": "Variable Anteile: Werte auf den Empfängern, z. B. Istkosten oder Kennzahl Ist", "r": true}, {"t": "Feste Prozentsätze: ein Rest unter 100 % bleibt auf dem Sender", "r": true}, {"t": "Feste Anteile: der Sender wird immer voll entlastet", "r": true}, {"t": "Feste Beträge: die Sender-Regel bestimmt den Betrag", "r": false}]}, {"id": "D18", "p": "D", "q": "Wozu dienen Empfängergewichtungsfaktoren?", "a": "Um die Bezugsbasis einzelner Empfänger zu gewichten, z. B. höherer Reinigungsaufwand pro m² (9.4.2.2)", "o": [{"t": "Um die Bezugsbasis einzelner Empfänger zu gewichten, z. B. höherer Reinigungsaufwand pro m²", "r": true}, {"t": "Um den Sender stärker zu entlasten", "r": false}, {"t": "Um die Steuer zu gewichten", "r": false}, {"t": "Um Planwerte in Istwerte umzurechnen", "r": false}]}, {"id": "D19", "p": "D", "q": "Wie läuft die Ausführung eines Zyklus ab?", "a": "Zuerst Testlauf mit Protokoll, dann Kennzeichen Testlauf entfernen und Echtlauf. Erst der Echtlauf bucht (9.4.2.3)", "o": [{"t": "Zuerst Testlauf mit Protokoll", "r": true}, {"t": "Dann Kennzeichen Testlauf entfernen und Echtlauf", "r": true}, {"t": "Erst der Echtlauf bucht", "r": true}, {"t": "Schon der Testlauf bucht", "r": false}]}, {"id": "D20", "p": "D", "q": "Warum erscheint im Protokoll jede Sender-Empfänger-Kombination zweimal?", "a": "Einmal als Entlastung des Senders, einmal als Belastung des Empfängers, mit umgekehrtem Vorzeichen (9.4.2.3)", "o": [{"t": "Einmal als Entlastung des Senders, einmal als Belastung des Empfängers, mit umgekehrtem Vorzeichen", "r": true}, {"t": "Weil Test- und Echtlauf gleichzeitig angezeigt werden", "r": false}, {"t": "Weil Plan und Ist getrennt erscheinen", "r": false}, {"t": "Weil der Zyklus iterativ ist", "r": false}]}, {"id": "D21", "p": "D", "q": "Worin unterscheidet sich die Verteilung von der periodischen Umbuchung?", "a": "Die Verteilung ist eine Verrechnung mit separatem Entlastungssatz: genauer dokumentiert, aber mehr Datensätze und damit Last für das System (9.4.3)", "o": [{"t": "Die Verteilung ist eine Verrechnung mit separatem Entlastungssatz", "r": true}, {"t": "Genauer dokumentiert, aber mehr Datensätze und mehr Last für das System", "r": true}, {"t": "Die Verteilung ändert die Originalkostenart in eine sekundäre", "r": false}, {"t": "Die Verteilung geht nur im Plan", "r": false}]}, {"id": "D22", "p": "D", "q": "Welche Zyklen
