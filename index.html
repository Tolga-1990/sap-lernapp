<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAP CP Controlling – Lern-App</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--muted:#5d6675;--line:#dde1e7;--acc:#1f5fbf;--ok:#1e8a4c;--bad:#c0392b;--warn:#b7791f}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--ink:#e8ebf0;--muted:#9aa3b2;--line:#2e343e;--acc:#6ea2ff;--ok:#4cc483;--bad:#ff7a6b;--warn:#f0b75a}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0 0 8px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:7px 12px;border-radius:8px;font-size:14px;cursor:pointer}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.muted{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);margin-right:6px;color:var(--muted)}
.tag.fs{border-color:var(--acc);color:var(--acc)}
.q{font-size:18px;font-weight:600;margin:10px 0}
.a{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px;font-size:16px}
.big{font-size:32px;font-weight:700;letter-spacing:.5px;margin:12px 0;word-break:break-all}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button.btn{border:0;border-radius:8px;padding:11px 16px;font-size:15px;cursor:pointer;background:var(--acc);color:#fff}
button.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
button.btn.ok{background:var(--ok)}
button.btn.bad{background:var(--bad)}
select,label{font-size:14px}
select{padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.hide{display:none}
</style>
</head>
<body>
<header>
  <h1>SAP CP (Competence Pass) Controlling – Lern-App</h1>
  <nav>
    <button data-v="start" class="on">Start</button>
    <button data-v="quiz">Quiz</button>
    <button data-v="cards">Karteikarten</button>
    <button data-v="exam">Prüfungssimulation</button>
    <button data-v="stats">Fortschritt</button>
  </nav>
</header>
<main id="app"></main>
<script>
const DATA={"parts": {"A": "Grundlagen, Fiori und Organisationseinheiten", "B": "Stammdaten", "C": "Buchungen und Beschaffung", "D": "Werteflüsse und Periodenabschluss", "E": "Berichtswesen", "F": "Bildschirmaufgaben"}, "questions": [{"id": "A1", "p": "A", "q": "Was bedeuten „S“, „4“ und „HANA“ in SAP S/4HANA (aktuelle SAP-Software)?", "a": "S = Simple, 4 = vierte Produktgeneration, HANA = High Performance Analytic Appliance (3)"}, {"id": "A2", "p": "A", "q": "Welche Produktgenerationen gingen S/4HANA (aktuelle SAP-Software) voraus?", "a": "SAP R/2 (frühere SAP-Generation), R/3 (frühere SAP-Generation) und ERP (Unternehmenssoftware: Business Suite mit ECC, dem Vorgänger von S/4HANA) (3)"}, {"id": "A3", "p": "A", "q": "Was besagt das Principle of One?", "a": "Für eine Anforderung gibt es idealerweise nur einen Lösungsansatz, inhaltlich und technisch (3)"}, {"id": "A4", "p": "A", "q": "Nenne zwei Unterschiede zwischen On-Premises und Cloud.", "a": "On-Premises läuft auf eigener Hardware und ist voll anpassbar. Die Cloud ist SaaS (Software as a Service, Software zur Miete) ohne eigene Hardware, aber vor allem in der Public Cloud nur begrenzt anpassbar (3)"}, {"id": "A5", "p": "A", "q": "Wer sind die Adressaten des externen und des internen Rechnungswesens?", "a": "Extern (FI = Finanzbuchhaltung): Eigentümer, Finanzbehörde, Gläubiger. Intern (CO = Controlling): Geschäftsleitung und Führungskräfte (4.1)"}, {"id": "A6", "p": "A", "q": "Was ist das Hauptziel des internen Rechnungswesens?", "a": "Die Wirtschaftlichkeit der Leistungserstellung zu überwachen (4.1)"}, {"id": "A7", "p": "A", "q": "Was bedeutet Mitbuchtechnik?", "a": "Jede Buchung in einem Nebenbuch erzeugt automatisch die passende Buchung im Hauptbuch (4.2)"}, {"id": "A8", "p": "A", "q": "Nenne die drei Hauptkomponenten des CO (Controlling).", "a": "CO-OM Gemeinkostenrechnung, CO-PC Produktkostenrechnung, CO-PA Ergebnis- und Marktsegmentrechnung (4.3)"}, {"id": "A9", "p": "A", "q": "Welche Bereiche gehören zur Gemeinkostenrechnung?", "a": "Kostenartenrechnung, Kostenstellenrechnung, Innenaufträge (4.3)"}, {"id": "A10", "p": "A", "q": "Was ist das Universal Journal, und wie heisst seine Tabelle?", "a": "Gemeinsame Datenhaltung für FI (Finanzbuchhaltung) und CO (Controlling) in der Tabelle ACDOCA (Universal Journal, zentrale Buchungstabelle), die „Single Source of Truth“ (4.4)"}, {"id": "A11", "p": "A", "q": "Welche Daten stehen in ACDOCA (Universal Journal, zentrale Buchungstabelle)?", "a": "Alle FI-Buchungen (FI = Finanzbuchhaltung) und die Ist-Buchungen des CO (Controlling) (4.4)"}, {"id": "A12", "p": "A", "q": "Welche Komponenten greifen auf das Universal Journal zu?", "a": "FI-GL (Hauptbuch), CO (Controlling), FI-AA (Anlagenbuchhaltung), CO-PA (Ergebnisrechnung, buchhalterisch) und das Material Ledger (4.4)"}, {"id": "A13", "p": "A", "q": "Nenne drei Vorteile des Universal Journals.", "a": "Keine doppelte Datenhaltung, kein Abgleich zwischen Tabellen, weniger Speicherplatz, höherer Datendurchsatz (4.4)"}, {"id": "A14", "p": "A", "q": "Nenne die Merkmale von SAP Fiori.", "a": "Rollenbasiert, geräteunabhängig, einfach, gleich aufgebaut, ansprechend (5.1)"}, {"id": "A15", "p": "A", "q": "Gibt es zu jeder GUI-Transaktion (GUI = Programmoberfläche) genau eine Fiori-App?", "a": "Nein. Die Funktionen sind nach Rollen auf die Apps verteilt (5.1)"}, {"id": "A16", "p": "A", "q": "Wie startest du das Fiori Launchpad aus dem SAP GUI (Programmoberfläche)?", "a": "Mit dem Transaktionscode /UI2/FLP (Fiori Launchpad starten), eventuell mit /n davor. Die Anmeldung wird übernommen (5.2)"}, {"id": "A17", "p": "A", "q": "Wie viele Mandanten kann ein SAP-System haben?", "a": "Bis zu 1'000 (000 bis 999) (6.1)"}, {"id": "A18", "p": "A", "q": "Was ist ein Buchungskreis?", "a": "Die kleinste rechtlich selbstständige, bilanzierende Einheit (6.2)"}, {"id": "A19", "p": "A", "q": "Welche Parameter müssen für jeden Buchungskreis festgelegt werden?", "a": "Kontenplan, Hauswährung, Geschäftsjahresvariante (6.2)"}, {"id": "A20", "p": "A", "q": "Wozu dient ein Kostenrechnungskreis über mehrere Buchungskreise?", "a": "Für eine buchungskreisübergreifende Kostenrechnung, z. B. Deckungsbeiträge über mehrere Vertriebsgesellschaften (6.3)"}, {"id": "A21", "p": "A", "q": "Was muss innerhalb jedes Kostenrechnungskreises angelegt sein?", "a": "Die Standardhierarchie (6.3)"}, {"id": "A22", "p": "A", "q": "Zu wie vielen Buchungskreisen gehört ein Werk?", "a": "Zu genau einem (6.4)"}, {"id": "A23", "p": "A", "q": "Wann spielt das Werk im Controlling eine Rolle?", "a": "Bei kontierten Bestellungen und Verbrauchsbuchungen im Beschaffungsprozess (6.4)"}, {"id": "A24", "p": "A", "q": "Kann eine Einkaufsorganisation Werke mehrerer Buchungskreise versorgen?", "a": "Ja. Und ein Werk kann von mehreren Einkaufsorganisationen versorgt werden (6.5)"}, {"id": "A25", "p": "A", "q": "Nenne die Organisationseinheiten im Schulungsmandanten.", "a": "Kostenrechnungskreis K200, Buchungskreis B200, Werk W210, Einkaufsorganisation E200, Einkäufergruppe S## (6.6)"}, {"id": "B1", "p": "B", "q": "Mit welcher Transaktion legst du in S/4HANA (aktuelle SAP-Software) eine Kostenart an?", "a": "FS00 (Sachkonto bearbeiten). Sachkonto und Kostenart werden gemeinsam gepflegt (7.1)"}, {"id": "B2", "p": "B", "q": "Brauchen auch sekundäre Kostenarten ein Sachkonto?", "a": "Ja, in S/4HANA (aktuelle SAP-Software) braucht jede Kostenart ein Sachkonto (7.1)"}, {"id": "B3", "p": "B", "q": "Was entspricht einer Primärkostenart im FI (Finanzbuchhaltung)?", "a": "Ein Aufwandskonto aus dem GuV-Teil (GuV = Gewinn- und Verlustrechnung) des Kontenplans, mit demselben Schlüssel (7.1.1)"}, {"id": "B4", "p": "B", "q": "Nenne drei Beispiele für primäre und drei für sekundäre Kostenarten.", "a": "Primär: Material-, Lohn-, Energiekosten. Sekundär: Umlage, interne Leistungsverrechnung, Auftragsabrechnung (7.1.1, 7.1.2)"}, {"id": "B5", "p": "B", "q": "Was passiert, wenn du auf ein Sachkonto mit Kostenart buchst, ohne ein CO-Objekt (CO = Controlling) anzugeben?", "a": "Die Buchung ist nicht möglich, ausser im Customizing ist eine automatische Kontierung hinterlegt (7.1.1, 8.1)"}, {"id": "B6", "p": "B", "q": "Welche Sachkontoart wählst du für ein Konto, das nur im CO (Controlling) verwendet wird?", "a": "S Sekundärkosten (7.1.3)"}, {"id": "B7", "p": "B", "q": "Welche Sachkontoart ist ein nur im FI (Finanzbuchhaltung) verwendetes GuV-Konto (GuV = Gewinn- und Verlustrechnung)?", "a": "N Nicht betriebliche Aufwendungen und Erträge (7.1.3)"}, {"id": "B8", "p": "B", "q": "Was ist die Sachkontoart C?", "a": "Geldkonto, ein Bankabstimmkonto, unter dem mehrere Bankkonten geführt werden (7.1.3)"}, {"id": "B9", "p": "B", "q": "Wann ist das Feld Kostenartentyp ein Mussfeld, und welcher Wert gilt für Primärkosten?", "a": "Bei Sachkontoart P oder S; Primärkosten haben Typ 1 (7.1.3)"}, {"id": "B10", "p": "B", "q": "Warum wird das Anlegen mit Vorlage empfohlen, und worauf ist zu achten?", "a": "Die Daten werden übernommen, das spart Eingaben. Die Vorlage sollte ein ähnliches Konto aus derselben Kontenklasse sein (7.1.3)"}, {"id": "B11", "p": "B", "q": "Woher kennt FS00 (Sachkonto bearbeiten) den Kontenplan?", "a": "Über den Buchungskreis, dem im Customizing ein Kontenplan zugeordnet ist (7.1.3)"}, {"id": "B12", "p": "B", "q": "Was steuert die Kontengruppe, was die Feldstatusgruppe?", "a": "Kontengruppe: die Erfassungsbilder des Sachkontenstammsatzes. Feldstatusgruppe: den Bildaufbau bei der Belegerfassung, also Muss, Kann, Anzeige oder ausgeblendet (7.1.3)"}, {"id": "B13", "p": "B", "q": "Was bedeuten die Steuerkategorien +, − und *?", "a": "+ nur Ausgangssteuer, − nur Vorsteuer, * alle Steuerarten (7.1.3)"}, {"id": "B14", "p": "B", "q": "Was bewirkt das Kennzeichen „Nur automatisch bebuchbar“?", "a": "Das Konto wird nur über die Kontenfindung bebucht, nicht durch direkte Eingabe (7.1.3)"}, {"id": "B15", "p": "B", "q": "Was ist der Unterschied zwischen Kostenstelle und Kostenstellengruppe?", "a": "Die Kostenstelle ist ein bebuchbares Kontierungsobjekt. Die Gruppe ist nicht bebuchbar und dient der Auswertung und der Hierarchie (7.2)"}, {"id": "B16", "p": "B", "q": "Was sind Hilfskostenstellen, und was passiert mit ihnen am Periodenende?", "a": "Kostenstellen, auf denen alle Mitarbeitenden Kosten verursachen (z. B. Kantine). Sie werden vollständig auf die Hauptkostenstellen entlastet (7.2.1)"}, {"id": "B17", "p": "B", "q": "Welches Feld ist beim Anlegen einer Kostenstelle wegen der Verantwortung ein Mussfeld?", "a": "Verantwortlicher (7.2.1)"}, {"id": "B18", "p": "B", "q": "Was bedeutet das Datum 31.12.9999 bei einer Kostenstelle?", "a": "Unbegrenzte Gültigkeit (7.2.6)"}, {"id": "B19", "p": "B", "q": "Wofür ist die Art der Kostenstelle vor allem relevant?", "a": "Für die Leistungsverrechnung: Eine Leistungsart darf nur von bestimmten Kostenstellenarten erbracht werden. Zusätzlich für Auswertungen (7.2.6)"}, {"id": "B20", "p": "B", "q": "Was legt der Hierarchiebereich im Kostenstellenstammsatz fest?", "a": "Den Knoten der Standardhierarchie, dem die Kostenstelle zugeordnet ist (7.2.6)"}, {"id": "B21", "p": "B", "q": "Was unterscheidet eine mit KSH1 (Kostenstellengruppe anlegen) angelegte Kostenstellengruppe?", "a": "Sie ist eine alternative Gruppe ausserhalb der Standardhierarchie. Nachträglich zuordnen geht nur, solange ihr keine Kostenstellen zugeordnet sind (7.2.2)"}, {"id": "B22", "p": "B", "q": "Wann kann eine Kostenstelle mit KS04 (Kostenstelle löschen) gelöscht werden?", "a": "Nur ohne Plan-, Ist- und Obligodaten und ohne geplante statistische Kennzahlen; zuerst Testlauf, dann Echtlauf (7.2.9)"}, {"id": "B23", "p": "B", "q": "Wie heissen die Transaktionen zum Anzeigen und Ändern der Standardhierarchie?", "a": "OKENN (Standardhierarchie anzeigen) anzeigen, OKEON (Standardhierarchie ändern) ändern (7.3)"}, {"id": "B24", "p": "B", "q": "Was ist der Objektmanager in der Standardhierarchie?", "a": "Die Kombination aus Suchbereich und Auswahlbereich (7.3)"}, {"id": "B25", "p": "B", "q": "Wozu dienen statistische Kennzahlen in der Kostenrechnung?", "a": "Als Bezugsbasis für periodische Umbuchung und Verteilung, z. B. Quadratmeter für Reinigungskosten (7.4)"}, {"id": "B26", "p": "B", "q": "Erkläre den Unterschied zwischen Festwert und Summenwert.", "a": "Festwerte werden bis zum Ende des Geschäftsjahres fortgeschrieben (z. B. m², Mitarbeiter). Summenwerte gelten nur in der erfassten Periode (z. B. km, Telefoneinheiten) (7.4.1)"}, {"id": "B27", "p": "B", "q": "Mit welcher Transaktion erfasst du Werte statistischer Kennzahlen?", "a": "KB31N (Kennzahlwerte erfassen); in Fiori „Statistische Kennzahlwerte verwalten“ (7.4.6, 7.4.7)"}, {"id": "B28", "p": "B", "q": "Welche drei Datenebenen hat ein Lieferantenstammsatz?", "a": "Allgemeine Daten (Mandantenebene), Buchungskreisdaten, Einkaufsorganisationsdaten (7.5)"}, {"id": "B29", "p": "B", "q": "Welches Feld ist in den Buchungskreisdaten Pflicht, und warum?", "a": "Das Abstimmkonto. Es ist nötig, damit die Eingangsrechnung korrekt im Hauptbuch erfasst wird (7.5.2)"}, {"id": "B30", "p": "B", "q": "Welche Partnerrollen kann ein Lieferant haben?", "a": "Bestellempfänger, Warenlieferant, Rechnungssteller (7.5)"}, {"id": "B31", "p": "B", "q": "Was legen GP-Typ (GP = Geschäftspartner), Gruppierung und GP-Rolle (GP = Geschäftspartner) fest?", "a": "GP-Typ (GP = Geschäftspartner): Person, Organisation oder Gruppe. Gruppierung: Nummernkreis und interne oder externe Vergabe. GP-Rolle (GP = Geschäftspartner): die Geschäftsbeziehung, z. B. Lieferant (7.5.1, 7.5.2)"}, {"id": "B32", "p": "B", "q": "Was ist der Vorteil des Geschäftspartnerkonzepts?", "a": "Ein Partner, der Kunde und Lieferant ist, wird unter einer gemeinsamen GP-Nummer (GP = Geschäftspartner) geführt (7.5.1)"}, {"id": "C1", "p": "C", "q": "Was versteht man unter vorgangsbezogenen Buchungen?", "a": "Die Verrechnung von Kosten pro Geschäftsvorgang (8)"}, {"id": "C2", "p": "C", "q": "Warum ist ein CO-Beleg (CO = Controlling) einseitig?", "a": "Nur die Buchung auf dem GuV-Konto (GuV = Gewinn- und Verlustrechnung, z. B. das Aufwandskonto) geht ans CO (Controlling), nicht die Gegenbuchung auf dem Bestandskonto (8.1)"}, {"id": "C3", "p": "C", "q": "Nenne die drei Wege, eine Fehlkontierung zu korrigieren.", "a": "Belegstorno; manuelle Kostenumbuchung ohne Bezug zum FI-Beleg (FI = Finanzbuchhaltung); Einzelpostenumbuchung mit Bezug zum FI-Beleg (FI = Finanzbuchhaltung) (8.1)"}, {"id": "C4", "p": "C", "q": "Aus welchen Anwendungen stammen die meisten CO-Buchungen (CO = Controlling)?", "a": "FI (Finanzbuchhaltung), MM (Materialwirtschaft), SD (Vertrieb), HR (Personalwirtschaft). Voraussetzung sind Customizing-Einstellungen wie die Kontenfindung (8.1)"}, {"id": "C5", "p": "C", "q": "Wofür steht „Einbildtransaktion“ bei FB50 (Sachkontenbeleg erfassen) und FB60 (Eingangsrechnung ohne Bestellung)?", "a": "Belege lassen sich auf einem einzigen Bildschirm erfassen, merken, vorerfassen und buchen (8.2, 8.4)"}, {"id": "C6", "p": "C", "q": "Aus wie vielen Positionen besteht ein buchbarer Beleg mindestens?", "a": "Aus einem Belegkopf und mindestens zwei Positionen (8.2)"}, {"id": "C7", "p": "C", "q": "Was zeigt die Ampel beim Saldo in FB50 (Sachkontenbeleg erfassen)?", "a": "Rot: Saldo ungleich null. Gelb: noch nicht ermittelt. Grün: Saldo null, Beleg buchbar (8.2)"}, {"id": "C8", "p": "C", "q": "Was bedeutet „Merken“ in der App „Hauptbuchbelege buchen“?", "a": "Der Beleg wird unter einer temporären ID (Identifikation) gesichert, ohne Vollständigkeitsprüfung und ohne Buchung (8.3)"}, {"id": "C9", "p": "C", "q": "Wie erfasst du eine Rechnung ohne Bestellung, wie eine mit Bestellung?", "a": "Ohne Bestellung: FB60 (Eingangsrechnung ohne Bestellung) in der Kreditorenbuchhaltung. Mit Bestellung: MIRO (Rechnung zur Bestellung erfassen) bzw. App „Lieferantenrechnung anlegen“ (8.4, 8.6.11)"}, {"id": "C10", "p": "C", "q": "Ist FB60 (Eingangsrechnung ohne Bestellung) in Fiori eine eigene App?", "a": "Nein, die GUI-Transaktion (GUI = Programmoberfläche) wird über die GUI (Programmoberfläche) für HTML (Webseiten-Sprache) geöffnet (8.4)"}, {"id": "C11", "p": "C", "q": "Wie kommst du in FB03 (Beleg anzeigen) vom FI-Beleg (FI = Finanzbuchhaltung) zum CO-Beleg (CO = Controlling)?", "a": "Umfeld → Belegumfeld → Rechnungswesenbelege. Direkt geht es mit KSB5 (CO-Belege anzeigen) (8.5)"}, {"id": "C12", "p": "C", "q": "Nenne die Schritte des Beschaffungsprozesses und die Bereiche.", "a": "BANF (Bestellanforderung), Anfrage, Angebot, Bestellung (Einkauf); Wareneingang (Bestandsführung); Rechnungseingang (Logistik-Rechnungsprüfung) (8.6.1)"}, {"id": "C13", "p": "C", "q": "Welcher Beleg ist im Beschaffungsprozess zentral, und warum?", "a": "Die Bestellung. Wareneingang und Rechnung beziehen sich auf ihre Nummer, Daten werden übernommen und der Bestellstatus aktualisiert (8.6.1)"}, {"id": "C14", "p": "C", "q": "Was ist ein Obligo?", "a": "Die künftigen Kosten für bestellte Materialien und Dienstleistungen. Es bindet Mittel, die später zu Kosten werden (8.6.6)"}, {"id": "C15", "p": "C", "q": "Wann entsteht das Obligo, und wann wird es aufgelöst?", "a": "Beim Sichern einer kontierten Bestellung. Aufgelöst beim bewerteten Wareneingang, sonst erst bei der Rechnung (8.6.6)"}, {"id": "C16", "p": "C", "q": "Wo siehst du das Obligo?", "a": "In ME23N (Bestellung anzeigen) über Umfeld → Belegposition → RW-Obligobelege (RW = Rechnungswesen) oder im Bericht S_ALR_87013620 (Bericht Kostenstellen Ist/Plan/Obligo) (8.6.6)"}, {"id": "C17", "p": "C", "q": "Wann braucht eine Bestellposition einen Kontierungstyp?", "a": "Bei Verbrauchsmaterial, nicht bei Lagermaterial (8.6.2.3)"}, {"id": "C18", "p": "C", "q": "Was steuert der Kontierungstyp?", "a": "Die nötigen Kontierungsdaten, ob Waren- und Rechnungseingang vorgesehen sind und ob der Wareneingang bewertet oder unbewertet ist (8.6.2.3)"}, {"id": "C19", "p": "C", "q": "Was gibt der Positionstyp an?", "a": "Die Beschaffungsart; leer bedeutet „Normal“ (8.6.2.3)"}, {"id": "C20", "p": "C", "q": "Welche Belegart schlägt ME21N (Bestellung anlegen) vor, und was steuert sie?", "a": "NB Normalbestellung. Sie steuert den Nummernkreis und die Feldauswahl (8.6.3.1)"}, {"id": "C21", "p": "C", "q": "Welche Lieferdatumstypen gibt es?", "a": "D oder T taggenau, W wochengenau, M monatsgenau (8.6.2.4)"}, {"id": "C22", "p": "C", "q": "Was gilt für Vorschlagswerte aus den persönlichen Einstellungen in ME21N (Bestellung anlegen)?", "a": "Sie übersteuern die Parameter aus den Benutzervorgaben (8.6.2.2)"}, {"id": "C23", "p": "C", "q": "Welche Bewegungsart hat ein Wareneingang zur Bestellung, und wie entsteht sie?", "a": "101. Sie ergibt sich aus dem Vorgang „Wareneingang“ und dem Referenzbeleg „Bestellung“ (8.6.8)"}, {"id": "C24", "p": "C", "q": "Was legt die Bewegungsart fest?", "a": "Ob ein Bestandszu- oder -abgang vorliegt und wie der Folgebeleg in der Buchhaltung aussieht (8.6.8)"}, {"id": "C25", "p": "C", "q": "Welche Belege entstehen bei der Rechnung nach einem bewerteten Wareneingang?", "a": "Nur ein Buchhaltungsbeleg: offener Posten beim Lieferanten, WE/RE-Konto (WE/RE = Wareneingang/Rechnungseingang) ausgeglichen, Vorsteuer gebucht (8.6.13)"}, {"id": "C26", "p": "C", "q": "Wann muss der Saldo in MIRO (Rechnung zur Bestellung erfassen) null sein?", "a": "Immer vor dem Buchen. Saldo = Bruttobetrag minus Netto, Steuer und ungeplante Bezugsnebenkosten (8.6.11)"}, {"id": "D1", "p": "D", "q": "Was ist der Unterschied zwischen Umbuchung und Verrechnung?", "a": "Umbuchung: Die ursprüngliche Belastung auf dem Sender wird vermindert. Verrechnung: Sie bleibt stehen, auf dem Sender entsteht ein separater Entlastungssatz (9)"}, {"id": "D2", "p": "D", "q": "Was bleibt bei der manuellen Umbuchung erhalten, was geht verloren?", "a": "Die Originalkostenart bleibt; der Bezug zum FI-Beleg (FI = Finanzbuchhaltung) geht verloren (9.1.1)"}, {"id": "D3", "p": "D", "q": "Prüft KB11N (manuelle Kostenumbuchung), ob die Kosten auf dem Sender vorhanden sind?", "a": "Nein, keine Senderverprobung; negative Kosten auf dem Sender sind möglich (9.1.1)"}, {"id": "D4", "p": "D", "q": "Welche Bedingung muss für eine Einzelpostenumbuchung erfüllt sein?", "a": "Der CO-Beleg (CO = Controlling) muss eine Referenz auf einen Buchhaltungsbeleg haben. Anders als KB11N (manuelle Kostenumbuchung) prüft KB61 (Einzelpostenumbuchung), ob der Posten auf dem Sender wirklich vorhanden ist (Senderverprobung) (9.2.1)"}, {"id": "D5", "p": "D", "q": "Was steht nach einer Einzelpostenumbuchung auf dem FI-Beleg (FI = Finanzbuchhaltung)?", "a": "Weiterhin die alte Kostenstelle. Soll das FI (Finanzbuchhaltung) korrigiert werden, muss man stornieren und neu erfassen (9.2.1)"}, {"id": "D6", "p": "D", "q": "Was gibst du im Einstieg von KB61 (Einzelpostenumbuchung) ein?", "a": "Die Nummer des FI-Belegs (FI = Finanzbuchhaltung), bei Mehrdeutigkeit Buchungskreis und Geschäftsjahr; optional Kostenart oder Kostenstelle (9.2.2)"}, {"id": "D7", "p": "D", "q": "Welche Kosten kann KB15N (manuelle Kostenverrechnung) verrechnen?", "a": "Primär- und Sekundärkosten, ohne Senderverprobung und ohne Bezug zum Ursprungsbeleg (9.3.1)"}, {"id": "D8", "p": "D", "q": "Was steuert ein Zyklus, was enthält ein Segment?", "a": "Der Zyklus steuert den Ablauf. Das Segment enthält die Regeln: Sender, Empfänger, Sender- und Empfängerregeln, Bezugsgrössen (9.4.1)"}, {"id": "D9", "p": "D", "q": "Welche vier Fragen beantwortet ein Segment?", "a": "Wer sendet, wer empfängt, welche Kosten werden verrechnet, nach welcher Basis wird verteilt (9.4.1)"}, {"id": "D10", "p": "D", "q": "Welche Empfehlung gibt das Skript zur Zahl der Segmente?", "a": "Ein eigenes Segment für jedes Objekt, das Kosten abgibt (9.4.1)"}, {"id": "D11", "p": "D", "q": "Wozu dient die periodische Umbuchung?", "a": "Kosten, die während der Periode auf einer Hilfskostenstelle gesammelt wurden, am Periodenende verursachungsgerecht umzubuchen. Das hält FI-Buchungen (FI = Finanzbuchhaltung) klein und schützt z. B. Gehaltsdaten (9.4.2)"}, {"id": "D12", "p": "D", "q": "Wie legst du einen Umbuchungszyklus an, und warum findest du die Transaktion nicht im Menü?", "a": "KSW1 (Umbuchungszyklus anlegen); ändern mit KSW2 (Umbuchungszyklus ändern), anzeigen mit KSW3 (Umbuchungszyklus anzeigen). Sie stehen nicht im SAP-Menü, man ruft sie über das Kommandofeld oder das Mehr-Menü von KSW5 (periodische Umbuchung ausführen) auf (9.4.2.1)"}, {"id": "D13", "p": "D", "q": "Was bedeutet das Kennzeichen iterativ?", "a": "Bei wechselseitigem Leistungsaustausch wird so lange gerechnet, bis jeder Sender vollständig entlastet ist (9.4.2.1)"}, {"id": "D14", "p": "D", "q": "Welche vier Register hat ein Segment?", "a": "Segmentkopf, Sender/Empfänger, Senderwerte, Empfängerbezugsbasis (9.4.2.2)"}, {"id": "D15", "p": "D", "q": "Nenne die drei Sender-Regeln.", "a": "Gebuchte Beträge, Feste Beträge, Feste Tarife (Tarif × Bezugsbasis) (9.4.2.2)"}, {"id": "D16", "p": "D", "q": "Wann erscheint das Register Senderwerte?", "a": "Nur bei der Sender-Regel „Feste Beträge“ oder „Feste Tarife“ (9.4.2.2)"}, {"id": "D17", "p": "D", "q": "Nenne die Empfänger-Regeln und ihre Wirkung.", "a": "Variable Anteile (Werte auf den Empfängern, z. B. Istkosten oder Kennzahl Ist); Feste Beträge (Sender-Regel wird ignoriert); Feste Prozentsätze (Rest bleibt auf dem Sender); Feste Anteile (Sender immer voll entlastet) (9.4.2.2)"}, {"id": "D18", "p": "D", "q": "Wozu dienen Empfängergewichtungsfaktoren?", "a": "Um die Bezugsbasis einzelner Empfänger zu gewichten, z. B. höherer Reinigungsaufwand pro m² (9.4.2.2)"}, {"id": "D19", "p": "D", "q": "Wie läuft die Ausführung eines Zyklus ab?", "a": "Zuerst Testlauf mit Protokoll, dann Kennzeichen Testlauf entfernen und Echtlauf. Erst der Echtlauf bucht (9.4.2.3)"}, {"id": "D20", "p": "D", "q": "Warum erscheint im Protokoll jede Sender-Empfänger-Kombination zweimal?", "a": "Einmal als Entlastung des Senders, einmal als Belastung des Empfängers, mit umgekehrtem Vorzeichen (9.4.2.3)"}, {"id": "D21", "p": "D", "q": "Worin unterscheidet sich die Verteilung von der periodischen Umbuchung?", "a": "Die Verteilung ist eine Verrechnung mit separatem Entlastungssatz: genauer dokumentiert, aber mehr Datensätze und damit Last für das System (9.4.3)"}, {"id": "D22", "p": "D", "q": "Welche Zyklen kann die App „Verrechnungen verwalten“ nicht anlegen?", "a": "Zyklen für die periodische Umbuchung (9.4.4)"}, {"id": "D23", "p": "D", "q": "Welche Verwendungsarten bietet „Verrechnungen verwalten“?", "a": "Verteilung, Umlage, buchungskreisübergreifende Verrechnung, Top-down-Verteilung (9.4.4)"}, {"id": "D24", "p": "D", "q": "<b>Rechnen:</b> Die Hilfskostenstelle REIN## hat CHF 12'000 Kosten (Beispielbetrag). Flächen: Personal 23 m², Rechnungswesen 98 m², Einkauf 40 m², Vertrieb 19 m². Verteilung nach Fläche?", "a": "Summe 180 m², Satz CHF 66.67 pro m². Personal 1'533.33, Rechnungswesen 6'533.33, Einkauf 2'666.67, Vertrieb 1'266.67 (Summe 12'000). Flächen aus Fallstudie-Aufgabe 18, Rechenweg 9.4.2"}, {"id": "D25", "p": "D", "q": "<b>Rechnen:</b> CHF 6'000 nach Istkosten der Empfänger verteilen: A 1'200, B 800, C 400.", "a": "Summe 2'400, Faktor 2.5. A 3'000, B 2'000, C 1'000 (Rechenweg wie das Istkosten-Beispiel in 9.4.2.2)"}, {"id": "D26", "p": "D", "q": "<b>Rechnen:</b> CHF 10'000 mit festen Prozentsätzen 50 %, 30 %, 10 %. Was passiert?", "a": "A 5'000, B 3'000, C 1'000. CHF 1'000 bleiben auf dem Sender, weil die Summe nur 90 % ist (9.4.2.2)"}, {"id": "D27", "p": "D", "q": "<b>Rechnen:</b> CHF 8'000 mit festen Anteilen 2 : 1 : 1.", "a": "A 4'000, B 2'000, C 2'000. Der Sender ist voll entlastet (9.4.2.2)"}, {"id": "E1", "p": "E", "q": "Aus welchen Berichtsarten bestehen die Standardberichte?", "a": "Auftragsberichte, Kostenartenberichte, Verdichtungsberichte (10)"}, {"id": "E2", "p": "E", "q": "Wo liegen Ist-Einzelposten, wo die übrigen Werte?", "a": "Ist (Werttyp 04) und statistisches Ist (11) in ACDOCA (Universal Journal, zentrale Buchungstabelle), alle anderen Werte noch in COEP (ältere Tabelle der CO-Einzelposten) (10.1)"}, {"id": "E3", "p": "E", "q": "Warum gibt es Summensätze?", "a": "Damit Berichte schneller laufen, ohne jedes Mal alle Einzelposten zu aggregieren. Dargestellt werden sie mit Report-Painter-Berichten (10.1)"}, {"id": "E4", "p": "E", "q": "Welche Selektionskriterien hat S_ALR_87013611 (Bericht Kostenstellen Ist/Plan/Abweichung)?", "a": "Kostenrechnungskreis, Geschäftsjahr, Periode, Planversion, Kostenstelle(ngruppe), Kostenart(engruppe) (10.2)"}, {"id": "E5", "p": "E", "q": "Wie kommst du vom Summenbericht zum Ursprungsbeleg?", "a": "Doppelklick auf die Zeile, „Kostenstellen Einzelposten Ist“ (KSB1), dann Umfeld → Ursprungsbeleg (FB03) (10.2)"}, {"id": "E6", "p": "E", "q": "Was zeigt der Einzelpostenbericht zusätzlich zum Betrag?", "a": "Das Gegenkonto der Buchung (10.2)"}, {"id": "E7", "p": "E", "q": "Wann erscheint die Variation, und wozu dient sie?", "a": "Wenn statt einer Kostenstelle eine Kostenstellengruppe selektiert wird. Man wechselt per Klick zwischen den Hierarchieebenen (10.3)"}, {"id": "E8", "p": "E", "q": "Was bietet der Expertenmodus?", "a": "Erweitertes Selektionsbild sowie Bericht speichern, Layout, Schwellwerte, Export, Präsentationsgrafik, Währungsumrechnung und Extrakte (10.4)"}, {"id": "E9", "p": "E", "q": "Wozu dient RPC0 (Benutzereinstellungen für Berichte), und welche Register hat es?", "a": "Benutzerbezogene Vorschlagswerte für Berichte. Register: Grunddaten, Planungszeitraum, Berichtszeitraum, Berichtswährung, Weitere Angaben (10.5)"}, {"id": "E10", "p": "E", "q": "Welcher Bericht zeigt Ist, Plan und Obligo für Kostenstellen?", "a": "S_ALR_87013620 (Bericht Kostenstellen Ist/Plan/Obligo) (8.6.6.2). Für eine ganze Kostenstellengruppe gibt es S_ALR_87013621 (Bereich: Ist/Plan/Obligo) (10.6)"}, {"id": "F1", "p": "F", "q": "SAP GUI (Programmoberfläche): Die Werte der Organisationseinheiten sollen nicht bei jeder Transaktion neu eingegeben werden.", "a": "System → Benutzervorgaben → Benutzerdaten, Werte mit Parameter-ID (ID = Identifikation) hinterlegen; in Fiori als Standardwerte (Fallstudie, Aufgabe 2)"}, {"id": "F2", "p": "F", "q": "KS01 (Kostenstelle anlegen) läuft, aber der falsche Kostenrechnungskreis ist gesetzt.", "a": "Mit F6 oder Zusätze → Kostenrechnungskreis setzen ändern (7.2.6)"}, {"id": "F3", "p": "F", "q": "KS01 (Kostenstelle anlegen): Eine neue Kostenstelle soll wie eine bestehende aussehen.", "a": "Im Einstiegsbild die bestehende Kostenstelle als Vorlage angeben (7.2.6)"}, {"id": "F4", "p": "F", "q": "KSH1 (Kostenstellengruppe anlegen): Die neue Gruppe soll in die Standardhierarchie. Was ist zu beachten?", "a": "Zuordnen geht nur, solange der Gruppe noch keine Kostenstellen zugeordnet sind; sonst direkt in OKEON (Standardhierarchie ändern) anlegen (7.2.2, 7.3)"}, {"id": "F5", "p": "F", "q": "OKEON (Standardhierarchie ändern): Eine Kostenstelle soll in einen anderen Knoten.", "a": "Im Strukturbaum per Drag-and-drop verschieben oder im Stammsatz den Hierarchiebereich ändern (7.3)"}, {"id": "F6", "p": "F", "q": "BP (Geschäftspartner): Lieferant zentral anlegen. Welche Rolle und Gruppierung wählst du?", "a": "Rolle „ZVEND – Kreditor/Lieferant zentr.“ (ZVEND = Rolle Lieferant zentral), Gruppierung „BPCH Interne Nummernvergabe CH“; Feld Geschäftspartner leer lassen (7.5.2.1)"}, {"id": "F7", "p": "F", "q": "BP (Geschäftspartner), Lieferant: Kontoführung. Welches Feld ist Pflicht?", "a": "Abstimmkonto (7.5.2.1)"}, {"id": "F8", "p": "F", "q": "Fiori „Hauptbuchbelege buchen“: Reparatur am Pool-Auto, bezahlt mit Bankomatkarte. Was ist auf der Aufwandsposition Pflicht?", "a": "Ein Kontierungsobjekt, hier die Hilfskostenstelle des Pool-Autos (PKW##) (Fallstudie, Aufgabe 7; 8.3)"}, {"id": "F9", "p": "F", "q": "ME21N (Bestellung anlegen): Lieferdatum „in 14 Tagen“, die Woche genügt. Welcher Lieferdatumstyp?", "a": "W wochengenau (8.6.2.4)"}, {"id": "F10", "p": "F", "q": "ME23N (Bestellung anzeigen): Du willst das Obligo der Position sehen.", "a": "Umfeld → Belegposition → RW-Obligobelege (RW = Rechnungswesen) (8.6.6.1)"}, {"id": "F11", "p": "F", "q": "MIRO (Rechnung zur Bestellung erfassen): Der Saldo ist nicht null. Was tust du?", "a": "Betrag, Steuer und Bestellpositionen prüfen, bis der Saldo null ist; erst dann buchen (8.6.11)"}, {"id": "F12", "p": "F", "q": "KB31N (Kennzahlwerte erfassen): Kilometer laut Fahrtenbuch für Juli erfassen. Was beachtest du?", "a": "Kennzahl KM## ist ein Summenwert, sie gilt nur für die erfasste Periode (7.4.6)"}, {"id": "F13", "p": "F", "q": "KSV5 (Verteilung ausführen): Der Zyklus soll nur geprüft werden.", "a": "Kennzeichen Testlauf gesetzt lassen und ausführen, Protokoll prüfen (9.4.3.3)"}, {"id": "F14", "p": "F", "q": "„Verrechnungen verwalten“: Ein Segment soll im nächsten Lauf nicht mitlaufen.", "a": "Das Segment sperren (9.4.4)"}, {"id": "F15", "p": "F", "q": "S_ALR_87013611 (Bericht Kostenstellen Ist/Plan/Abweichung): Die Geschäftsleitung will nur Gruppen sehen, die Kostenstellenleitung die Details.", "a": "Kostenstellengruppe selektieren und mit der Variation zwischen den Ebenen wechseln (10.3)"}, {"id": "F16", "p": "F", "q": "Bericht: Du rufst ihn täglich mit denselben Werten auf.", "a": "Vorschlagswerte in RPC0 (Benutzereinstellungen für Berichte) speichern (10.5)"}]};

// Box 0 = neu, 1 = falsch, 2 = einmal richtig, 3 = sicher (zweimal hintereinander richtig)
function mark(store,id,ok){const r=S[store][id]||{b:0,r:0,f:0};if(ok){r.r++;r.b=r.b>=2?3:2;}else{r.f++;r.b=1;}r.t=Date.now();S[store][id]=r;save();}
function box(store,id){return (S[store][id]||{b:0}).b;}
function weight(store,id){return [3,6,2,1][box(store,id)];} // falsche Fragen kommen am häufigsten
function pick(list,store,idf){let tot=0;const w=list.map(x=>{const v=weight(store,idf(x));tot+=v;return v;});let r=Math.random()*tot;for(let i=0;i<list.length;i++){r-=w[i];if(r<0)return list[i];}return list[list.length-1];}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const $=s=>document.querySelector(s);

 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 ({start:renderStart,quiz:renderQuiz,cards:renderCards,exam:renderExam,stats:renderStats})[v]();}
function counts(store,ids){const c=[0,0,0,0];ids.forEach(id=>c[box(store,id)]++);return c;}

 const qc=counts('q',DATA.questions.map(x=>x.id)),cc=counts('c',CODES.map(x=>x.c));

function renderQuiz(){
 const opts=['alle',...Object.keys(DATA.parts)].map(p=>`<option value="${p}" ${qf.part===p?'selected':''}>${p==='alle'?'Alle Teile':p+' · '+DATA.parts[p]}</option>`).join('');
 const pool=quizPool();

 <label style="margin-left:10px">Modus <select id="qm"><option value="gewichtet" ${qf.mode==='gewichtet'?'selected':''}>Gemischt (Fehler öfter)</option><option value="fehler" ${qf.mode==='fehler'?'selected':''}>Nur falsch beantwortete</option></select></label>
 <div class="muted" style="margin-top:6px">${pool.length} Fragen in dieser Auswahl</div></div><div id="qbox"></div>`;
 $('#qp').onchange=e=>{qf.part=e.target.value;cur=null;renderQuiz();};

 if(!pool.length){$('#qbox').innerHTML=`<div class="card">Keine Fragen in dieser Auswahl. ${qf.mode==='fehler'?'Du hast aktuell keine falsch beantworteten Fragen.':''}</div>`;return;}

 <div class="row hide" id="b2"><button class="btn ok" id="ok">Gewusst</button><button class="btn bad" id="no">Nicht gewusst</button></div></div>`;
 $('#rev').onclick=()=>{$('#ans').classList.remove('hide');$('#b1').classList.add('hide');$('#b2').classList.remove('hide');};
 const go=ok=>{mark('q',x.id,ok);const p=quizPool();cur=p.length?pick(p.filter(y=>y!==x).length?p.filter(y=>y!==x):p,'q',y=>y.id):null;renderQuiz();};
 $('#ok').onclick=()=>go(true);$('#no').onclick=()=>go(false);}

let E=null;
function renderExam(){
 if(!E){app.innerHTML=`<div class="card"><b>Prüfungssimulation</b><p>40 zufällige Fragen aus allen Teilen, 60 Minuten Zeit, also 90 Sekunden pro Frage. Du beantwortest jede Frage im Kopf, deckst auf und bewertest dich selbst. Am Ende siehst du den Prozentwert: bestanden ab 60 % (24 von 40), Auszeichnung ab 80 % (32 von 40).</p>
 <p class="muted">Ehrlich bewerten: Zähle eine Antwort nur als richtig, wenn du die Kernaussage der Musterantwort genannt hast.</p>
 <div class="row"><button class="btn" id="go">Prüfung starten</button></div></div>`;
  $('#go').onclick=()=>{E={qs:shuffle(DATA.questions).slice(0,40),i:0,ok:0,res:[],end:Date.now()+60*60*1000,open:false};tick();renderExam();};return;}
 if(E.done){const p=Math.round(E.ok/40*100);
  const verdict=p>=80?'Auszeichnung erreicht':p>=60?'bestanden, aber unter 80 %':'nicht bestanden';
  const wrong=E.res.filter(r=>!r.ok).map(r=>r.id);
  app.innerHTML=`<div class="card"><b>Ergebnis</b><div class="big">${p} %</div><div>${E.ok} von 40 richtig · ${verdict}${E.timeout?' · Zeit abgelaufen':''}</div>
  ${wrong.length?`<p class="muted">Falsch: ${wrong.join(', ')}. Diese Fragen kommen im Quiz jetzt öfter.</p>`:''}
  <div class="row"><button class="btn" id="again">Neue Simulation</button></div></div>`;
  $('#again').onclick=()=>{E=null;renderExam();};return;}
 const x=E.qs[E.i];
 app.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between;margin-top:0"><span>Frage ${E.i+1} von 40</span><span class="timer" id="tm"></span></div>
 <span class="tag">${x.id}</span><div class="q">${x.q}</div><div id="ans" class="a ${E.open?'':'hide'}">${x.a}</div>
 <div class="row ${E.open?'hide':''}"><button class="btn" id="rev">Antwort aufdecken</button></div>
 <div class="row ${E.open?'':'hide'}"><button class="btn ok" id="ok">Richtig</button><button class="btn bad" id="no">Falsch</button></div>
 <div class="row"><button class="btn sec" id="stop">Prüfung abbrechen</button></div></div>`;
 updTimer();
 $('#rev').onclick=()=>{E.open=true;renderExam();};
 const go=ok=>{mark('q',x.id,ok);E.res.push({id:x.id,ok});if(ok)E.ok++;E.i++;E.open=false;if(E.i>=40)finish(false);else renderExam();};
 $('#ok').onclick=()=>go(true);$('#no').onclick=()=>go(false);
 $('#stop').onclick=()=>{if(confirmStop()){clearInterval(timerId);timerId=null;E=null;renderExam();}};}
function confirmStop(){return true;}
function finish(timeout){clearInterval(timerId);timerId=null;E.done=true;E.timeout=timeout;S.exams.push({t:Date.now(),p:Math.round(E.ok/40*100)});save();if(view==='exam')renderExam();}
function tick(){clearInterval(timerId);timerId=setInterval(()=>{if(!E||E.done)return;if(Date.now()>=E.end){finish(true);}else updTimer();},1000);}
function updTimer(){const el=$('#tm');if(!el||!E)return;const s=Math.max(0,Math.round((E.end-Date.now())/1000));el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} Min.`;}
// ---- Fortschritt ----
function renderStats(){
 const rows=Object.keys(DATA.parts).map(p=>{const ids=DATA.questions.filter(x=>x.p===p).map(x=>x.id);const c=counts('q',ids);return `<tr><td>${p} · ${DATA.parts[p]}</td><td>${ids.length}</td><td>${c[3]}</td><td>${c[2]}</td><td>${c[1]}</td><td>${c[0]}</td></tr>`;}).join('');
 const ex=S.exams.slice(-10).reverse().map(e=>`<tr><td>${new Date(e.t).toLocaleString('de-CH')}</td><td>${e.p} %</td></tr>`).join('');
 const wrong=DATA.questions.filter(x=>box('q',x.id)===1).map(x=>x.id);
 app.innerHTML=`<div class="card"><b>Fragen nach Teil</b><table><tr><th>Teil</th><th>Total</th><th>sicher</th><th>1× richtig</th><th>falsch</th><th>neu</th></tr>${rows}</table>
 <p class="muted">„sicher“ = zweimal hintereinander gewusst. Deine Fehlerliste: ${wrong.length?wrong.join(', '):'leer'}</p></div>
 <div class="card"><b>Letzte Prüfungssimulationen</b>${ex?`<table><tr><th>Datum</th><th>Ergebnis</th></tr>${ex}</table>`:'<p class="muted">Noch keine.</p>'}</div>
 <div class="card"><b>Fortschritt zurücksetzen</b><p class="muted">Löscht alle gespeicherten Ergebnisse in diesem Browser.</p><div class="row"><button class="btn sec" id="rs">Zurücksetzen</button><span id="rsq" class="hide">Wirklich? <button class="btn bad" id="rsy">Ja, löschen</button></span></div></div>`;
 $('#rs').onclick=()=>$('#rsq').classList.remove('hide');
 $('#rsy').onclick=()=>{S={q:{},c:{},exams:[]};save();renderStats();};}
show('start');
</script>
</body>
</html>
